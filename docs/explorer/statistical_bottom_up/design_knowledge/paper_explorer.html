<html lang="en">
<head>

  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;

      --accent: #256fbd;

      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);

    * { box-sizing: border-box; }
    body {

      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }
    .controls {
      display: grid;
      grid-template-columns: 180px 210px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }
    .point { stroke: white; stroke-width: 1.8; cursor: pointer; opacity: 0.86; transition: opacity 120ms ease; }
    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }
    .legend { max-height: 150px; overflow-y: auto; background: #ffffff; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }

cham's (1994) philosophical framework of technology onto Love's (2000) meta-theoretical taxonomy for design theory for the application to fashion design praxis. The purpose of this conceptual article is to conceptualise a philosophical framework for fashion design to be considered by fashion designers, researchers and curriculum developers when engaging in praxis. The relevant research questions are then: what are the underlying philosophical principles for fashion design within the current approach to praxis? What are the affordances of such a principle-based philosophical framework for fashion designers in their practice; researchers, scholars and curriculum developers? Within the current design praxis, this article proposes a principle-based philosophical framework including volition (mind-set), design knowledge (epistemology), design process (methodology) and objects (ontology). This framework may well create opportunities for fashion designers to consider these related principles and approach their praxis in alternative ways. Similarly, researchers wanting to strengthen scholarship for fashion design could use each of these different principles as units of analysis to explore and introduce new perspectives and research about the praxis. Alternative volition and new forms of design knowledge have the potential to change designers' choices, reasoning, cognition, and design processes and scholars may well write about this also. Finally, the framework offers the potential for scholars to question and research the ontological nature of objects and the relationship between designer, intentions and artefact function when sustainability and design for social good come into play. Furthermore, the framework for fashion design will also inform curriculum and programme development in fashion design education.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "International Journal of Techn  the ways that studio is enacted. Using practice theory, we illustrate our framework with two examples - one in Industrial Design and another in Human Computer Interaction - that demonstrate the ways in which the studio can act as a bridge between academic and professional communities. We came to see the studio as a unique practice community that connects academic and professional contexts. We argue that successful implementation of studio-based learning involves an awareness of disciplinary canons, ontological approaches to knowledge, and the academic constraints on studio-based approaches to learning. © 2011 Springer Science+Business Media B.V.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2013", "venue": "International Journal of Technology and Design Education", "doi": "10.1007/s10798-011-9181-5", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "HCI | practice | patterns | designers | principles | students | social | context | guidelines | heuristics | user | health | form | human | AI", "cluster_label_candidate": "Design knowledge — Design principles and HCI design [DK-C01]", "distinguishing_evidence_terms": "Design principles, HCI design", "cluster_summary_candidate": "We contribute prescriptive design knowledge for preserving human-centric decision-making by motivating expert sharing, enabling articulation, establishing fidelity, and ensuring applicability to successors. [E1] We propose a complementary perspective by looking at design projects and traditions where the 'ultimate particulars' can be considered to be activities rather than things. [E2]", "design_knowledge_form": "Design knowledge — Design principles and HCI design", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_t ment in digital design", "cluster": 0, "distance": 0.17351222038269043}, {"paper_id": "82f49b5a1905", "title": "SOLUTION REPERTOIRE", "cluster": 0, "distance": 0.17461097240447998}, {"paper_id": "e8a17b6120e4", "title": "Designing as reflective conversation with the materials of a design situation", "cluster": 0, "distance": 0.17690116167068481}], "hdbscan_peripheral": false}, {"paper_id": "2042efa7e455", "title": "The DSR grid: six core dimensions for effectively planning and communicating design science research projects", "authors": "J. Brocke; A. Maedche", "abstract": "The goal of design science research (DSR) is to generate prescriptive knowledge about the design of Information Systems (IS) artifacts like software, methods, models, and concepts (Hevner et al. 2004). In a wider sense, DSR intends to generate design knowledge, that is, knowledge about innovative solutions to real-world problems (vom Brocke et al. 2019). As such, DSR is considered particularly promising regarding its ability to contribute to practice through such means as digital innovation (Rai 2017) and to address our society’s (grand) challenges (Becker et al. 2015), such as that of ensuring environmental sustainability (Loos et al. 2011; Pernici et al. 2012; vom Brocke and Seidel 2012). Each DSR project is a complex matter with many aspects that must be considered. DSR is an iterative process, starting with the identification of a problem in the problem space and evaluating alternative solutions in the solution space. Through multiple iterations, a DSRproject seeks to contributemeans-end relationships between problem and solution spaces (Venable 2006). All DSR activities must be aligned to such intended contributions so modifications in such positioning lead to subsequent changes in how to scope and plan a DSR project. Multiple stakeholders are often involved in conducting DSR project, which makes it important to coordinate and communicate DSR research (vomBrocke and Lippe 2010). Stakeholders of DSR projects include researchers, industry partners, and editors. These roles should be considered in any DSR project e.g. in terms of their focus (e.g., domain expert or method expert) and seniority (e.g., Ph.D. student, Ph.D. supervisor). Such multi-stakeholder collaboration makes it important to communicate the manifold considerations of a DSR project in an efficient way. Based on our own experience as editors of DSR special issues, conferences and tracks, directors of many DSR projects and research programs, and mentors of Ph.D. students on DSR projects, we see great value in high-level representations of a DSR project that make it possible to capture on one page the project’s key aspects. Therefore, this article identifies six core dimensions of a DSR project that can lay the foundation for a high-level, one-page framework that describesDSRprojects. Similar approaches have been presented in other areas of research, including conceptual modeling (Frank et al. 2014) and reference modeling (vom Brocke 2007), where frameworks (specifically, process frameworks) provide a high-level conceptualization of various parts of more complex models (vom Brocke and Buddendick 2006; Legner et al. 2019), and business modeling, where the business model canvas (BMC) in particular provides a high-level conceptualization of the information needed to plan and communicate business models (Osterwalder and Pigneur 2010). Recently, we have seen an increase in contributions that have suggested canvas models, also referred to as visual inquiry tools, for many areas, and that have suggested principles for canvas design in general terms (Avdiji et al. 2019). In the DSR literature, too, This article is part of the Topical Collection on Science Research in the Networked Economy", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Electronic Markets", "doi": "", "url": "https://www.semanticscholar.org/pape Informatics system design", "authors": "B. Reeder; Rebecca A. Hills; G. Demiris; D. Revere; Jamie Pina", "abstract": "BackgroundSince it was first defined in 1995, Public Health Informatics (PHI) has become a recognized discipline, with a research agenda, defined domain-specific competencies and a specialized corpus of technical knowledge. Information systems form a cornerstone of PHI research and implementation, representing significant progress for the nascent field. However, PHI does not advocate or incorporate standard, domain-appropriate design methods for implementing public health information systems. Reusable design is generalized design advice that can be reused in a range of similar contexts. We propose that PHI create and reuse information design knowledge by taking a systems approach that incorporates design methods from the disciplines of Human-Computer Interaction, Interaction Design and other related disciplines.DiscussionAlthough PHI operates in a domain with unique characteristics, many design problems in public health correspond to classic design problems, suggesting that existing design methods and solution approaches are applicable to the design of public health information systems. Among the numerous methodological frameworks used in other disciplines, we identify scenario-based design and participatory design as two widely-employed methodologies that are appropriate for adoption as PHI standards. We make the case that these methods show promise to create reusable design knowledge in PHI.SummaryWe propose the formalization of a set of standard design methods within PHI that can be used to pursue a strategy of design knowledge creation and reuse for cost-effective, interoperable public health information systems. We suggest that all public health informaticians should be able to use these design methods and the methods should be incorporated into PHI training.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discu plement' design practices. Acquisition of the initial EDPs apply current best-practice design knowledge in the form of 'specify, implement, test, and iterate' design practices. This can be used similarly to acquire new HCI-EDPs. Strategies for developing HCI-EDPs are proposed together with conceptions of human-computer systems, required for conceptualisation and operationalisation of their associated design problems and design solutions. This book is primarily for postgraduate students and young researchers wishing to develop further the idea of HCI-EDPs and other more reliable HCI design knowledge. It is structured to support both the understanding and the operationalisation of HCI-EDPs, as required for their acquisition, their long-term potential contribution to HCI design knowledge, and their ultimate application to design practice. © 2022 Morgan and Claypool Publishers. All rights reserved.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2022", "venue": "Synthesis Lectures on Human-Centered Informatics", "doi": "10.2200/s01172ed1v02y202202hci055", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "HCI | practice | patterns | designers | principles | students | social | context | guidelines | heuristics | user | health | form | human | AI", "cluster_label_candidate": "Design knowledge — Design principles and HCI design [DK-C01]", "distinguishing_evidence_terms": "Design principles, HCI design", "cluster_summary_candidate": "We contribute prescriptive design knowledge for preserving human-centric decision-making by motivating expert sharing, enabling articulation, establishing fidelity, and ensuring applicability to successors. [E1] We propose a complementary perspective by looking at design projects and traditions where the 'ultimate particulars' can be considered to be activities rather than things. [E2]", "design_knowledge_form": "Design knowledge — Design pr  distinguished in the taxonomy. This reference ontology, developed using the Unified Foundational Ontology (UFO) and several of its core ontologies, is organized into different ontology modules, allowing to describe functionalities that are common to any digital platform and more specific functionalities that have their origin in the distinctive features that were used to construct the taxonomy. The taxonomy that we contribute helps to clearly define the different types of digital platform that can be observed today. It also helps analysing further evolutions in the platform domain. The contribution of a well-founded digital platform reference ontology is a step towards a better understanding of digital platform functionality, better communication between stakeholders, and eventually may facilitate future research and development of new types of digital platform. All rights reserved Elsevier.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Information Systems", "doi": "10.1016/j.is.2023.102293", "url": "", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "data | ontology | development | digital | types | prescriptive | theory | game | designers | artifacts | researchers | case | abstract | platform | practice", "cluster_label_candidate": "Design knowledge — Design theory and Design research [DK-C02]", "distinguishing_evidence_terms": "Design theory, Design research", "cluster_summary_candidate": "In this paper, we identify, analyze, and map a collection of 63 existing ethics-focused methods intentionally designed for ethical impact. [E1] We develop an empirically grounded understanding of how design knowledge accumulates over time. [E3]", "design_knowledge_form": "Design knowledge — Design theory and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type" tract": "The literature suggests that prevailing understandings of the makeup of design knowledge and agency in producing design knowledge in technology is not helpful for design processes and its practitioners. Tensions arise within processes of designing, when design knowledge is understood as objective, whilst subjectivity is experienced in the research methods employed. In the same time, knowledge production is pursued in an individualist manner, where the situated nature of knowing as an interplay of factors, likely reaching beyond personal traits and human intention, is not acknowledged. In this way, design processes are currently working against their inherent potential with likely effects on designers and subsequently design outcomes. The arising tensions cause issues for practitioners, who are stuck in between an objectivity demand and experienced subjectivity, without an alternative conception of their work. Practice-oriented conceptualisations of social dynamics, how things are, and come to be, as well as existing research in consumption practices and sustainable design, have shown that agency and knowing conceptualised as emerging from practice might reconcile this tension. It is therefore that we argue for a reconceptualization of the makeup of knowledge and agency in knowledge production, so that these advancements in conceptualising practices can be of service to the technology design discipline", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Conference Proceedings of the Academy for Design Innovation Management", "doi": "", "url": "https://www.semanticscholar.org/paper/4acc5b8aa733c7fa82f49703473735aeb54c7095", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "HCI | practice | patterns | designers | principles | students | social | context | guidelines | heuristics | user | health | form | human | AI", "cluster_label_candidate": "Design know : Literature Review, Analysis, and Future Directions", "cluster": 0, "distance": 0.19400262832641602}], "hdbscan_peripheral": false}, {"paper_id": "a883ec94b37a", "title": "Causal design knowledge: Alternative representation method for product development knowledge management", "authors": "Kyoung-Yun Kim (1); Yun Seon Kim (1)", "abstract": "This paper presents a mathematical comparison of procedural knowledge and causal knowledge, and discusses the potential roles and feasibility of causal knowledge across product development knowledge management. Since reuse of knowledge is so important in product development, various knowledge management approaches have been introduced. Most of the product design knowledge is represented by procedural knowledge, which unfortunately requires cumbersome processes to define, and is typically inadequate for representing the kind of knowledge generated during the product development process. A causal knowledge representation, however, can help us to overcome this limitation and is an alternative formalism for representing product design knowledge. In this paper we compare the procedural and causal knowledge representations. We present the mathematical definitions of two knowledge paradigms, then mathematically describe the relationship between the two. Both knowledge paradigms are then compared based on the perspective of knowledge expression, decision alternative representation, reasoning capability, and knowledge cultivation. This paper concludes that causal knowledge representation is superior to procedural knowledge representation based on the four perspectives. Finally, the knowledge systems are modeled using Systems Modeling Language (SysML), and we present a case study that demonstrates the causal knowledge features using a realistic example from industry. [All rights reserved Elsevier].", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Compute _id": "c0efa7750b45", "title": "Forms of reasoning in the design science research process", "authors": "Fischer, Christian (1, 2); Gregor, Shirley (2)", "abstract": "Several models for the conduct of design science research (DSR) in information systems (IS) have been suggested. There has, however, been little academic investigation of the basic forms of reasoning underlying these models, namely: deduction, induction and abduction. We argue that a more thorough investigation of these reasoning logics allows for a more comprehensive understanding of the DSR models and the building of information systems design theories (ISDTs). In particular, the question of whether prescriptive design knowledge can be ‘theory driven' by descriptive kernel theory can be addressed. First, we show that it is important to distinguish between a context of discovery and a context of justification in theory building and to consider the fundamental forms of reasoning in this light. We present an idealized model of the hypothetico-deductive method, showing how progress is achieved in science. This model includes the contexts of discovery and justification and the matching forms of reasoning. Second, we analyze frameworks for IS DSR and ISDT in comparison with this idealized model. This analysis suggests that few frameworks explicitly refer to the underlying forms of reasoning. Illustrative case studies with first-hand accounts of how IS DSR occurs in practice lend support to the conception of the idealized model. We conclude that work on methodological models for IS DSR and ISDT building would be given a firmer base and some differences in opinion resolved if there was explicit reflection on the underlying contexts of both discovery and justification and the forms of reasoning implicated, as in our idealized model. © Springer-Verlag Berlin Heidelberg 2011.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2011", "venue": articulate their needs. In this paper we present the theoretical underpinnings of requirement elicitation as a design knowledge transformation process. It requires a comprehensive understanding of the special needs of the users, critical domain knowledge, interdisciplinary expertise and engagement with multiple stakeholders, presently well supported by co-design approaches. However, engaging with certain user groups, such as, children with special needs is particularly harrowing as they are unable to articulate their needs or offer consistent feedback. This often renders their needs missed, ill understood or inaccurately captured. Additionally, designers struggle to gather clinical requirements and mitigate the demands and aspirations of other stakeholders beyond the beneficiaries, and above all, prioritizing the requirements to systematically undertake design. These findings are corroborated between literature and primary research, emphasizing the need for a knowledge support in requirement elicitation. Therefore, an existing support, the Master List of Requirements (MLoR) is further investigated in this paper and validation is sought, with respect to two key hypotheses; H1: The knowledge content of the MLoR, (i.e., Requirement and its corresponding ontological tagging) is ‘practically sound’; and H2: A Master List of Requirement is an appropriate (type of) knowledge support for designing for Children with special needs (DfC*). An empirical validation study is undertaken with design and clinical experts, with respect to the Validation Square, and the results indicate several disagreements on the practical soundness and interpretation of the requirements and their priority in the MLoR. The experts confirm that requirements tend to be context-specific, and hence, the proposition of a generic, standardized MLoR poses difficulties in adapting to apply to various use-cases, however, they commend the ontology. The underlying phenomena leading to this ambiguity in interpretation of an explicit knowledge, such as a requirement, is due to the tacit nature of contextual knowledge. Thus, a concept of a Foundational Model for DfC* is proposed, leveraging an extended ontology on knowledge typology to offer a structured and explicit manner to capture implicit needs, and is intended to support both customized one-off solutions and generalizable frameworks by facilitating access to context-sensitive knowledge which is reflective of the complexities of the real world.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2025", "venue": "Digital Enterprise Computing", "doi": "", "url": "https://www.semanticscholar.org/paper/a02bcc09b09789ba51cd5bf0e57da568c03c8021", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "data | ontology | development | digital | types | prescriptive | theory | game | designers | artifacts | researchers | case | abstract | platform | practice", "cluster_label_candidate": "Design knowledge — Design theory and Design research [DK-C02]", "distinguishing_evidence_terms": "Design theory, Design research", "cluster_summary_candidate": "In this paper, we identify, analyze, and map a collection of 63 existing ethics-focused methods intentionally designed for ethical impact. [E1] We develop an empirically grounded understanding of how design knowledge accumulates over time. [E3]", "design_knowledge_form": "Design knowledge — Design theory and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support" tual knowledge in the most appropriate and effective way to solve programming problems. Strategic knowledge also includes the ability to exploit and combine solutions to known problems to solve new ones and is one of the hardest skills to acquire when learning to programm [5, 6, 11]. Terms such as goals[10] patterns [5, 6, 11]. schema,[9] strategies[4], and variables' roles[3] have been used to refer to this kind of knowledge. Several authors suggest that strategic knowledge should be taught explicitly, however there are three main issues to address: plans/patterns/schema are used sometimes interchangeably and sometimes similarly but not correspondingly; it is claimed that a small number of plans/patterns is needed in an introductory programming course, however there is no agreed upon inventory of plans/patterns among the CS community;the notion of variables' roles isn't always explicitly linked to the notion of plans/patterns;little instructional material is available that explicitly teaches strategies, and it is neither easy nor obvious how to design such material. The aim of this study is to investigate whether and how such notions of plans/patterns/schema and variables' roles can be integrated into introductory programming courses.The idea is to establish a framework that includes and arranges the different definitions presented in literature. The framework developed will be used for building a catalogue of plans/pattern and variables' roles encountered in CS1 practice, in CS1 assessment, and in the literature on introductory programming; this catalogue will be the basis for designing new instructional/learning material for fostering strategic knowledge. The developed material will be used in one of our introductory programming courses and in peer tutoring activities for the students. The effectiveness will be tested evaluating students programming skills with a pre-test and a post-test, using a group as a treatment group and another one as control group.", "dis omy of a design theory", "sentences": "Design work and design knowledge in Information Systems (IS) is important for both research and practice. We identify eight separate components of design theories: (1) purpose and scope, (2) constructs, (3) principles of form and function, (4) artifact mutability, (5) testable propositions, (6) justificatory knowledge (kernel theories), (7) principles of implementation, and (8) an expository instantiation.", "paragraph_index": 0, "sentence_hash": "84f448f77736", "score": 19.5, "score_breakdown": {"total": 19.5, "term_overlap": 12.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design theory\"", "phrase match: \"design research\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we identify\""]}}, {"id": "E4", "paper_id": "c0efa7750b45", "paper_title": "Forms of reasoning in the design science research process", "sentences": "We argue that a more thorough investigation of these reasoning logics allows for a more comprehensive understanding of the DSR models and the building of information systems design theories (ISDTs). We present an idealized model of the hypothetico-deductive method, showing how progress is achieved in science.", "paragraph_index": 0, "sentence_hash": "e94b2c00e125", "score": 18.0, "score_breakdown": {"total": 18.0, "term_overlap": 8.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design knowledge\"", "own-claim marker: \"we present\"", "own-claim marker: \"we argue\""]}}, {"id": "E5", "paper_id": "ccc616a68c38", "paper_title": "Towards Creating a Body of Evidence-based Interactive Digital Narrative Design Knowledge: Approaches and Challenges", "sentences": "This paper proposes the use of empirical research methods as means to address this situation and examines specific challenges. On this foundation, we introduce a re 024", "paper_title": "Design knowledge for decision-making process in a DFX product design approach", "sentences": "The efficiency and effectiveness of these decisions depend on the provision of many kinds of related knowledge to designers from different sources throughout the product lifecycle. First, this paper makes a literature review about the related works on product design knowledge and classifies the product design knowledge into three categories, namely product, process and product support knowledge.", "paragraph_index": 0, "sentence_hash": "da5973fa381d", "score": 15.5, "score_breakdown": {"total": 15.5, "term_overlap": 10.0, "first_person": 0.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"product design\"", "phrase match: \"design knowledge\"", "action pattern (synthesizes): \"literature review\""]}}, {"id": "E5", "paper_id": "2a3139d14895", "paper_title": "What is design knowledge from the viewpoint of CPM/PDD?", "sentences": "Knowledge is a very common term in engineering design and also extensively discussed. The Characteristics-Properties Modelling / Property-Driven Development (CPM/PDD) approach is one possibility to illustrate the product development process.", "paragraph_index": 0, "sentence_hash": "a8f389eff0bd", "score": 14.5, "score_breakdown": {"total": 14.5, "term_overlap": 11.0, "first_person": 0.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"process knowledge\"", "phrase match: \"design knowledge\""]}}, {"id": "E6", "paper_id": "76d309f713b9", "paper_title": "How industrial design knowledge differs from engineering design knowledge", "sentences": "That knowledge plays a meaningful role in product development is largely undisputed. Obviously, there are differences between the knowledge required by industrial designers and by engineering designers.", "paragraph_index": 0, "sentence_hash": "01ab906d2e1a",   <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${Number(c) + 1}`;
    const clusterTopicLabel = value => String(value || '').replace(/\s*\[[^\]]+\]\s*$/, '').trim();
    const readableClusterLabel = c => { const label = clusterTopicLabel(c.label || c.theme); return `${label || clusterName(c.cluster)} · ${c.count} ${c.count === 1 ? 'paper' : 'papers'}`; };
    const clusterLegendLabel = c => readableClusterLabel(c);
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        opt.textContent = readableClusterLabel(c);
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Path 1 interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Topic Phrase</div>
          <div class="abstract">${escapeHtml(clusterTopicLabel(p.cluster_label_candidate))}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Key Phrases</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Prose Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Fine-Grained Form &amp; Review Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Status: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}

            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Review status: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>




          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Theory Move Candidate</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
