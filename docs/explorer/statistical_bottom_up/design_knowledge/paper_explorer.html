<html lang="en">
<head>

  <title>Design knowledge · Statistical bottom-up interpretation</title>
  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafd;
      --accent: #256fbd;
      --accent-soft: #eaf3ff;
      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }
    .controls {
      display: grid;
      grid-template-columns: 180px 210px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }
    .point { stroke: white; stroke-width: 1.8; cursor: pointer; opacity: 0.86; transition: opacity 120ms ease; }
    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }
    .legend { max-height: 150px; overflow-y: auto; background: #ffffff; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }

ation results in information overload and is thus counterproductive for establishing TIPP. We depart from the extant design logic of transparency artifacts and develop a theoretical foundation (TIPP theory) for transparency artifact designs useful for establishing TIPP from the perspective of privacy as a social value. We present TIPP theory in two parts to capture the sociotechnical interplay. The first part translates abstract knowledge on the IS artifact and privacy into a description of social subsystems of transparency artifacts, and the second part conveys prescriptive design knowledge in form of a corresponding IS design theory. TIPP theory establishes a bridge from the complexity of the privacy concept to a metadesign for transparency artifacts that is useful to establish TIPP in any IS. In essence, transparency artifacts must accomplish more than offering comprehensive information; they must also be adaptive to the current information needs of consumers. © 2023 The Author(s)", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2024", "venue": "Information Systems Research", "doi": "10.1287/isre.2019.0239", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of design: one that emphasizes both the construction-centered and human-centered aspects of design in IS. [E4] We discuss the applicability of our fashion design praxis. The purpose of this conceptual article is to conceptualise a philosophical framework for fashion design to be considered by fashion designers, researchers and curriculum developers when engaging in praxis. The relevant research questions are then: what are the underlying philosophical principles for fashion design within the current approach to praxis? What are the affordances of such a principle-based philosophical framework for fashion designers in their practice; researchers, scholars and curriculum developers? Within the current design praxis, this article proposes a principle-based philosophical framework including volition (mind-set), design knowledge (epistemology), design process (methodology) and objects (ontology). This framework may well create opportunities for fashion designers to consider these related principles and approach their praxis in alternative ways. Similarly, researchers wanting to strengthen scholarship for fashion design could use each of these different principles as units of analysis to explore and introduce new perspectives and research about the praxis. Alternative volition and new forms of design knowledge have the potential to change designers' choices, reasoning, cognition, and design processes and scholars may well write about this also. Finally, the framework offers the potential for scholars to question and research the ontological nature of objects and the relationship between designer, intentions and artefact function when sustainability and design for social good come into play. Furthermore, the framework for fashion design will also inform curriculum and programme development in fashion design education.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "International Journal of Technology and Design Education", "doi": "10.1007/s10798-022-09794-7", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_t tions": "Not applicable", "theory_move_key": "not_applicable", "theory_move": "", "theory_move_patterns": "", "theory_move_support": "", "facet_population_or_context": "", "facet_stakeholder_or_population": "", "facet_method_or_lens": "", "facet_artifact_or_domain": "", "facet_contribution_or_outcome": "", "umap_x": -3.10921311378479, "umap_y": 1.3946428298950195, "distance_to_centroid": 0.12211817502975464, "representative_rank": 30, "is_representative_top3": false, "medoid_rank": 30, "lda_topic": -1, "lda_topic_probability": 0.0, "lda_topic_words": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "nearest_papers": [{"paper_id": "5a716d80ac6b", "title": "Towards a Method for Design Principle Development in Information Systems", "cluster": 0, "distance": 0.16099047660827637}, {"paper_id": "03adadfa0ad4", "title": "Design Principles: Literature Review, Analysis, and Future Directions", "cluster": 0, "distance": 0.16756540536880493}, {"paper_id": "b3d7c30694e8", "title": "Software pre-patterns as architectural knowledge", "cluster": 0, "distance": 0.16870009899139404}, {"paper_id": "a8b318749f73", "title": "A conceptual framework for design science research", "cluster": 0, "distance": 0.18334180116653442}, {"paper_id": "ade78c466271", "title": "Revised set of usability heuristics for the evaluation of interactive systems", "cluster": 0, "distance": 0.184242844581604}], "hdbscan_peripheral": false}, {"paper_id": "2042efa7e455", "title": "The DSR grid: six core dimensions for effectively planning and communicating design science research projects", "authors": "J. Brocke; A. Maedche", "abstract": "The goal of design science research (DSR) is to generate prescriptive knowledge about the design of Information Systems (IS) artifacts like software, methods, models, and concepts (Hevner et al. 2004). In a wider sense, DSR intends to generate design knowledge, that is, knowledge about innovative solutions to real-world problems (vom Brocke et al. 2019). As such, DSR is considered particularly promising regarding its ability to contribute to practice through such means as digital innovation (Rai 2017) and to address our society’s (grand) challenges (Becker et al. 2015), such as that of ensuring environmental sustainability (Loos et al. 2011; Pernici et al. 2012; vom Brocke and Seidel 2012). Each DSR project is a complex matter with many aspects that must be considered. DSR is an iterative process, starting with the identification of a problem in the problem space and evaluating alternative solutions in the solution space. Through multiple iterations, a DSRproject seeks to contributemeans-end relationships between problem and solution spaces (Venable 2006). All DSR activities must be aligned to such intended contributions so modifications in such positioning lead to subsequent changes in how to scope and plan a DSR project. Multiple stakeholders are often involved in conducting DSR project, which makes it important to coordinate and communicate DSR research (vomBrocke and Lippe 2010). Stakeholders of DSR projects include researchers, industry partners, and editors. These roles should be considered in any DSR project e.g. in terms of their focus (e.g., domain expert or method expert) and seniority (e.g., Ph.D. student, Ph.D. supervisor). Such multi-stakeholder collaboration makes it important to communicate the manifold considerations of a DSR project in an efficient way. Based on our own experience as editors of DSR special issues, conferences and tracks, directors of many DSR projects and research programs, and mentors of Ph.D. students on DSR projects, we see great value in high-level representations of a DSR project that make it possible to capture on one page the project’s key aspects. Therefore, this article identifies six core dimensions of a DSR project that can lay the foundation for a high-level, one-page framework that describesDSRprojects. Similar approaches have been presented in other areas of research, including conceptual modeling (Frank et al. 2014) and reference modeling (vom Brocke 2007), where frameworks (specifically, process frameworks) provide a high-level conceptualization of various parts of more complex models (vom Brocke and Buddendick 2006; Legner et al. 2019), and business modeling, where the business model canvas (BMC) in particular provides a high-level conceptualization of the information needed to plan and communicate business models (Osterwalder and Pigneur 2010). Recently, we have seen an increase in contributions that have suggested canvas models, also referred to as visual inquiry tools, for many areas, and that have suggested principles for canvas design in general terms (Avdiji et al. 2019). In the DSR literature, too, This article is part of the Topical Collection on Science Research in the Networked Economy", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Electronic Markets", "doi": "", "url": "https://www.semanticscholar.org/paper/b4891a8c14bc74a60e95cce3915a3efae59ff889", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "cluster_label_candidate": "Design knowledge — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "We introduce the knowledge construction process through a case study in the context of creative cultural design. [E2] We believe that the work presented in this paper contributes to a better understanding of design knowledge and its transfer mechanisms, and it may serve as a basis for design educators to improve their teaching programs. [E3]", "design_knowledge_form": "Design knowledge — De t progress for the nascent field. However, PHI does not advocate or incorporate standard, domain-appropriate design methods for implementing public health information systems. Reusable design is generalized design advice that can be reused in a range of similar contexts. We propose that PHI create and reuse information design knowledge by taking a systems approach that incorporates design methods from the disciplines of Human-Computer Interaction, Interaction Design and other related disciplines.DiscussionAlthough PHI operates in a domain with unique characteristics, many design problems in public health correspond to classic design problems, suggesting that existing design methods and solution approaches are applicable to the design of public health information systems. Among the numerous methodological frameworks used in other disciplines, we identify scenario-based design and participatory design as two widely-employed methodologies that are appropriate for adoption as PHI standards. We make the case that these methods show promise to create reusable design knowledge in PHI.SummaryWe propose the formalization of a set of standard design methods within PHI that can be used to pursue a strategy of design knowledge creation and reuse for cost-effective, interoperable public health information systems. We suggest that all public health informaticians should be able to use these design methods and the methods should be incorporated into PHI training.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2011", "venue": "BMC Public Health", "doi": "", "url": "https://www.semanticscholar.org/paper/9c8b1c67ac970533f6aee74d608749c545113cdd", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "De eflections on Architecture Design Education: The Integrated Design Paradigm", "authors": "Fathi Bashier", "abstract": "Studies have recently discussed the failure of traditional design in the studio to develop a rational approach based on systematic methods and objective knowledge. They agree that such an approach is incompatible with the complexity of modern design problems and recognize the need to replace it with a disciplinary approach in order to meet the challenges of modern design. Most critics attribute the failure of the traditional approach to the lack of knowledge. This study, however, argues that the problem is more precisely a problem of the inadequacy of design knowledge conception, and suggests that the development of a discipline-based approach cannot be achieved unless the entire knowledge conception is properly understood and theorized. To achieve this end the study has introduced, in a previous article, the integrated design paradigm as a theoretical framework which describes the knowledge system within the design process. In this article the study reviews the integrated design paradigm and develops a new understanding of design knowledge conception based on systems theory. In the light of this holistic perception, the study proposes the design process systems approach , a disciplinary model based on the integrated conception of design knowledge. However, both ‘the design process systems model’ and ‘the (revised) integrated design paradigm’ upon which it is based will have to be empirically verified in a future article. Keywords: process, knowledge, systems theory, knowledge conception, process systems", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2016", "venue": "", "doi": "", "url": "https://www.semanticscholar.org/paper/7b6efbb5e3ade197692b0f77a1ca2024b8652090", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | edge as natural-language guidelines with semantically typed metadata. This allows experts to author knowledge that machines can query. An expert study (N = 18) indicates that practitioners routinely adapt heuristics to situational factors such as audience and communicative intent. To capture this reasoning, guideline sections specify not only advice but also the contexts where it applies, exceptions that invalidate it, and the sources from which it derives. We demonstrate the scheme’s expressiveness by cataloging 744 guidelines drawn from cognitive science, accessibility standards, data journalism, and research on rhetorical aspects of visual communication. We embed guideline sections in a vector space, opening the knowledge itself to structural analysis. This reveals conflicting advice across sources and transferable principles between domains. Rather than replacing constraint-based tools, our scheme provides what they lack: situated guidance that generative systems can retrieve to ground their reasoning, users can verify against cited sources, and experts can author as knowledge evolves. Copyright © 2026, The Authors. All rights reserved.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2026", "venue": "arXiv", "doi": "10.48550/arXiv.2512.20306", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of desi CI-EDPs, including an introduction; two development cycles; and presentation and assessment for each. Carry forward of the HCI-EDP progress is also identified. The book adopts a discipline approach framework for HCI and an HCI engineering discipline framework for HCI-EDPs. These approaches afford design knowledge that supports 'specify then implement' design practices. Acquisition of the initial EDPs apply current best-practice design knowledge in the form of 'specify, implement, test, and iterate' design practices. This can be used similarly to acquire new HCI-EDPs. Strategies for developing HCI-EDPs are proposed together with conceptions of human-computer systems, required for conceptualisation and operationalisation of their associated design problems and design solutions. This book is primarily for postgraduate students and young researchers wishing to develop further the idea of HCI-EDPs and other more reliable HCI design knowledge. It is structured to support both the understanding and the operationalisation of HCI-EDPs, as required for their acquisition, their long-term potential contribution to HCI design knowledge, and their ultimate application to design practice. © 2022 Morgan and Claypool Publishers. All rights reserved.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2022", "venue": "Synthesis Lectures on Human-Centered Informatics", "doi": "10.2200/s01172ed1v02y202202hci055", "url": "", "keyword": "Design knowledge", "cluster": 2, "cluster_theme_terms": "hci | hci design | design | knowledge | edps | hci edps | design knowledge | practice | design practice | declarative | procedural | principles | hci engineering | models methods | models", "cluster_label_candidate": "Design knowledge — HCI design and Design practice", "distinguishing_evidence_terms": "HCI design, Design practice", "cluster_summary_candidate": "The introduction, as one type of HCI design knowledge, is preceded i . These decisions are of many different types and made by different kinds of engineers and managers. This work illustrates decision-making in product design and some related works are reviewed. The decision-making during the product design process is analyzed and classified into two main categories, namely organizational and technical decisions, which are illustrated in a three dimensional figure. Finally, some conclusions and future works are discussed.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2008", "venue": "Global Design to Gain a Competitive Edge: An Holistic and Collaborative Design Approach Based on Computational Tools", "doi": "10.1007/978-1-84800-239-5_13", "url": "", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "cluster_label_candidate": "Design knowledge — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "We introduce the knowledge construction process through a case study in the context of creative cultural design. [E2] We believe that the work presented in this paper contributes to a better understanding of design knowledge and its transfer mechanisms, and it may serve as a basis for design educators to improve their teaching programs. [E3]", "design_knowledge_form": "Design knowledge — Design process and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribut e and in business communication digital platforms are categorized into different types including, but not limited to, multi-sided platform, digital marketplace, on-demand platform and sharing economy platform. Observing the substantial literature on these platform types, both in academia and professional contexts, there is lack of consensus on the definition of these digital platform types. On top of that, there is a lack of knowledge in the literature on the requirements and design of these digital platform types. We address the observed lack of shared conceptualizations by creating a taxonomy for digital platforms, by classifying digital platforms according to their distinctive features. Further, we address the lack of design knowledge with a digital platform reference ontology that describes the construction and operation of the different types of digital platform that are distinguished in the taxonomy. This reference ontology, developed using the Unified Foundational Ontology (UFO) and several of its core ontologies, is organized into different ontology modules, allowing to describe functionalities that are common to any digital platform and more specific functionalities that have their origin in the distinctive features that were used to construct the taxonomy. The taxonomy that we contribute helps to clearly define the different types of digital platform that can be observed today. It also helps analysing further evolutions in the platform domain. The contribution of a well-founded digital platform reference ontology is a step towards a better understanding of digital platform functionality, better communication between stakeholders, and eventually may facilitate future research and development of new types of digital platform. All rights reserved Elsevier.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Information Systems", "doi": "10.1016/j.is.2023.102293", "url": "", "k ork of Walls, Widemeyer and El Sawy (1992) on the specification of information systems design theories (ISDT), drawing on other streams of thought on design research and theory to provide a basis for a more systematic and useable formulation of these theories. We identify eight separate components of design theories: (1) purpose and scope, (2) constructs, (3) principles of form and function, (4) artifact mutability, (5) testable propositions, (6) justificatory knowledge (kernel theories), (7) principles of implementation, and (8) an expository instantiation. This specification includes components missing in the Walls et al. adaptation of Dubin (1978) and Simon (1969) and also addresses explicitly problems associated with the role of instantiations and the specification of design theories for methodologies and interventions as well as for products and applications. The essay is significant as the unambiguous establishment of design knowledge as theory gives a sounder base for arguments for the rigor and legitimacy of IS as an applied discipline and for its continuing progress. A craft can proceed with the copying of one example of a design artifact by one artisan after another. A discipline cannot. Copyright © 2007, by the Association for Information Systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2007", "venue": "Journal of the Association for Information Systems", "doi": "10.17705/1jais.00129", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS ose an updated map of the orders of design as a thinking tool and compass. I read the evolutions of design as it enters the Fifth Order of concerns, characterized by the centrality of data both as input and as output to a design process. Today, design deals with relationships and perceptions; it dialogues with people and all species ranging from machines to micro-organisms, all of which actively participate in reaching objectives. Here, design creates conversations to achieve several goals, including engagement, discovery, and decision making. Finally, I propose a shift in the traditional principles of designing, moving away from the idea of perfect solutions and toward learning systems that are good enough for now. © 2022 The MIT Press.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2022", "venue": "Design Issues", "doi": "10.1162/desi_a_00695", "url": "", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "cluster_label_candidate": "Design knowledge — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "We introduce the knowledge construction process through a case study in the context of creative cultural design. [E2] We believe that the work presented in this paper contributes to a better understanding of design knowledge and its transfer mechanisms, and it may serve as a basis for design educators to improve their teaching programs. [E3]", "design_knowledge_form": "Design knowledge — Design process and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contributio . Conversely, the dual attribute theory, which acknowledges the structural and functional attributes of artifacts, embraces intentionality but grapples with logical inconsistencies and potential mind-body dualism issues. Additionally, it fails to adequately explain artifacts lacking specific physical structures or functions, such as digital and artistic creations. To address these limitations, this study incorporates the concepts of Hawkes' \"plan\", Deng Bo's \"form\" dimension, and Alireza Mansouri's introduction of the \"World 3\" viewpoint, proposing a framework based on Popper's Three Worlds theory. Karl R. Popper posits that the universe consists of three interacting yet distinct realms: World 1 (the physical world), World 2 (the subjective psychological realm), and World 3 (the objective knowledge sphere). By mapping these realms onto artifacts, we conceptualize them as a triadic construct comprising \"matter\" \"intention\" and \"design knowledge\". This framework aims to provide a more holistic understanding of artifacts across technological, digital, artistic, and public domains. The study commences with an analysis of the inherent constraints in both material singularity and dual attribute theories. Material singularity's exclusive focus on physical attributes neglects the intentional and functional aspects of artifacts. On the other hand, while incorporating intentionality, the dual attribute theory struggles with logical discrepancies between structure and function, potentially leading to mind-body dualism challenges. Drawing upon Popper's theoretical insights, this research proposes a triadic framework that recognizes artifacts as complex entities composed of matter, intention, and design knowledge. In this framework, \"matter\" corresponds to tangible attributes, \"intention\" reflects subjective purposes embedded in their creation and utilization, and \"design knowledge\" encompasses objective knowledge universally accessible that guides their", "dis top3": false, "medoid_rank": 5, "lda_topic": -1, "lda_topic_probability": 0.0, "lda_topic_words": "hci | hci design | design | knowledge | edps | hci edps | design knowledge | practice | design practice | declarative | procedural | principles | hci engineering | models methods | models", "nearest_papers": [{"paper_id": "9eda131748eb", "title": "Engineering Design Principles for HCI as a Way Forward for HCI Design Knowledge", "cluster": 2, "distance": 0.003461122512817383}, {"paper_id": "2f7b1528d74d", "title": "HCI Design Knowledge as Principles, Rules, and Heuristics", "cluster": 2, "distance": 0.03567463159561157}, {"paper_id": "166efc8ac468", "title": "HCI Design Knowledge", "cluster": 2, "distance": 0.03649294376373291}, {"paper_id": "f9a132245837", "title": "HCI Knowledge", "cluster": 2, "distance": 0.040894269943237305}, {"paper_id": "ede2a92151d5", "title": "HCI Design Knowledge as Models and Methods", "cluster": 2, "distance": 0.041469693183898926}], "hdbscan_peripheral": false}, {"paper_id": "a1ccc16dab98", "title": "ANALYSIS OF DESIGN COMPETENCE OF FUTURE ENGINEER-TEACHERS", "authors": "N. Korolova; Y. Bilotserkivska; О. Y. Mukhin", "abstract": "Purpose. To analyze current scientific research on the problem of design competence of future engineer-teachers, and to conduct a terminological analysis of related and fundamental concepts, such as «competence,» «design activity,» «design competence,» and «design competence of engineer-teachers.» Methods. Methods of theoretical and methodological analysis of literature on the research topic, regulatory and legislative documents were applied, along with analysis, synthesis, generalization, and systematization to clarify the meanings of the studied concepts and formulate conclusions. Results. In modern conditions, ensuring a workforce that meets the real conditions and needs of the labor market and the demands for the quality of the country’s production potential is of paramount importance in Ukraine. A strategic role in solving this task is played by the system of vocational and technical education, which is closely linked to production and aims to train highly qualified specialists. This, in turn, requires teaching staff with a high level of current professional knowledge, skills, and competencies in both the psychological-pedagogical sphere and the field of production.Theoretical research allowed for the identification of related and fundamental concepts of the study. Based on an analysis of scientific works, the concept of competence was clarified as an integrative, dynamic quality of a person, characterizing their ability and readiness for successful activity in a specific field (including professional activity). Researchers view it from various perspectives, but its essential components are knowledge, skills, experience, values, and attitudes toward activity in a specific professional domain. It was found that in modern scientific literature, design activity is interpreted as an integrative process combining theoretical knowledge and practical actions of an educator aimed at developing and implementing educational projects to enhance the quality of education and develop professional competencies. It was determined that the specificity of training engineer-teachers in any field lies in the fact that their design activity is considered both in the psychological-pedagogical and professional training domains. Design competence should encompass both psychological-pedagogical and professional engineering-technical components of the training of future engineer-teachers in accordance with regulatory documentation: programs, plans, and innovative projects for the development of subject areas of the future specialist’s activity. In general, design competence is interpreted as an integrative quality of an educator that combines knowledge, skills, and personal qualities necessary for effective design and implementation of the educational process. The study also examined the specifics of the design competence of engineer-teachers as an integrative personal characteristic that accumulates interdisciplinary knowledge and skills enabling them to develop collaborative research activities with students, provide scientific guidance, and assist in the implementation of research projects. The analysis of scientific works on the issue of design competence of engineer-teachers revealed that there is currently no single interpretation of this concept. The essence of the term «design competence of an engineer-teacher» was clarified as the integrated result of the educational training of future engineer-teachers. It reflects the formation of relevant knowledge, skills, and professionally important qualities, representing the ability to engage in design activities in the fields of pedagogy and production through the development of pedagogical and production projects. The analysis of psychological-pedagogical literature also identified the structure of design competence, which includes the following components: motivational-value, cognitive, activity-based, and reflexive-evaluative. Conclusion. Based on an analysis of scientific and pedagogical literature, the essence of the concept of «design competence of an engineer-teacher» was clarified as an integrative, dynamic personal characteristic. It reflects a combination of design knowledge and skills, experience in design activities, orientation toward motivational-value attitudes, and reflexive-evaluative actions, enabling the development and evaluation of projects in the dual professional domains of pedagogy and technological expertise.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2024", "venue": "Problems of Engineering Pedagogic Education", "doi": "", "url": "https://www.semanticscholar.org/paper/15c3811ae940cd712a69146bed4bed2a119080d6", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | pri of design. The revised view extends the current perspectives of design in the IS literature to embrace broader conceptualizations of design, which are evident in many intellectual communities outside IS where design is viewed as a critical component of both research and practice - such as management, engineering, architecture and others. In addition to the fairly common conceptualizations of design as product and design as process or action, design is also conceived as: intention; planning - including modeling and representation; communication; user experience; value; professional practice; and as service. Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of design: one that emphasizes both the construction-centered and human-centered aspects of design in IS. Building from our broader view, we discuss some of the implications for design-oriented research in IS, and consider ways in which this human-centered perspective might impact on the context and content of design research in IS.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Journal of Information Technology", "doi": "10.1057/jit.2012.5", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more arman", "abstract": "The literature suggests that prevailing understandings of the makeup of design knowledge and agency in producing design knowledge in technology is not helpful for design processes and its practitioners. Tensions arise within processes of designing, when design knowledge is understood as objective, whilst subjectivity is experienced in the research methods employed. In the same time, knowledge production is pursued in an individualist manner, where the situated nature of knowing as an interplay of factors, likely reaching beyond personal traits and human intention, is not acknowledged. In this way, design processes are currently working against their inherent potential with likely effects on designers and subsequently design outcomes. The arising tensions cause issues for practitioners, who are stuck in between an objectivity demand and experienced subjectivity, without an alternative conception of their work. Practice-oriented conceptualisations of social dynamics, how things are, and come to be, as well as existing research in consumption practices and sustainable design, have shown that agency and knowing conceptualised as emerging from practice might reconcile this tension. It is therefore that we argue for a reconceptualization of the makeup of knowledge and agency in knowledge production, so that these advancements in conceptualising practices can be of service to the technology design discipline", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Conference Proceedings of the Academy for Design Innovation Management", "doi": "", "url": "https://www.semanticscholar.org/paper/4acc5b8aa733c7fa82f49703473735aeb54c7095", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "cluster_label_candid ocess", "authors": "Fischer, Christian (1, 2); Gregor, Shirley (2)", "abstract": "Several models for the conduct of design science research (DSR) in information systems (IS) have been suggested. There has, however, been little academic investigation of the basic forms of reasoning underlying these models, namely: deduction, induction and abduction. We argue that a more thorough investigation of these reasoning logics allows for a more comprehensive understanding of the DSR models and the building of information systems design theories (ISDTs). In particular, the question of whether prescriptive design knowledge can be ‘theory driven' by descriptive kernel theory can be addressed. First, we show that it is important to distinguish between a context of discovery and a context of justification in theory building and to consider the fundamental forms of reasoning in this light. We present an idealized model of the hypothetico-deductive method, showing how progress is achieved in science. This model includes the contexts of discovery and justification and the matching forms of reasoning. Second, we analyze frameworks for IS DSR and ISDT in comparison with this idealized model. This analysis suggests that few frameworks explicitly refer to the underlying forms of reasoning. Illustrative case studies with first-hand accounts of how IS DSR occurs in practice lend support to the conception of the idealized model. We conclude that work on methodological models for IS DSR and ISDT building would be given a firmer base and some differences in opinion resolved if there was explicit reflection on the underlying contexts of both discovery and justification and the forms of reasoning implicated, as in our idealized model. © Springer-Verlag Berlin Heidelberg 2011.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2011", "venue": "Lecture Notes in Computer Science (including subseries Lecture Notes in Artificial licit knowledge transfer, particularly when designing for users unable to articulate their needs. In this paper we present the theoretical underpinnings of requirement elicitation as a design knowledge transformation process. It requires a comprehensive understanding of the special needs of the users, critical domain knowledge, interdisciplinary expertise and engagement with multiple stakeholders, presently well supported by co-design approaches. However, engaging with certain user groups, such as, children with special needs is particularly harrowing as they are unable to articulate their needs or offer consistent feedback. This often renders their needs missed, ill understood or inaccurately captured. Additionally, designers struggle to gather clinical requirements and mitigate the demands and aspirations of other stakeholders beyond the beneficiaries, and above all, prioritizing the requirements to systematically undertake design. These findings are corroborated between literature and primary research, emphasizing the need for a knowledge support in requirement elicitation. Therefore, an existing support, the Master List of Requirements (MLoR) is further investigated in this paper and validation is sought, with respect to two key hypotheses; H1: The knowledge content of the MLoR, (i.e., Requirement and its corresponding ontological tagging) is ‘practically sound’; and H2: A Master List of Requirement is an appropriate (type of) knowledge support for designing for Children with special needs (DfC*). An empirical validation study is undertaken with design and clinical experts, with respect to the Validation Square, and the results indicate several disagreements on the practical soundness and interpretation of the requirements and their priority in the MLoR. The experts confirm that requirements tend to be context-specific, and hence, the proposition of a generic, standardized MLoR poses difficulties in adapting to apply to various use-cases, however, they commend t the re-use of design knowledge, as the knowledge involved in designing complex products can be huge. Developing methods for the retrieval of design rationale is very useful as part of the effective management of design knowledge, for the following reasons. Firstly, design engineers tend to want to consider issues and solutions before looking at solid models or process specifications in detail. Secondly, design rationale is mainly described using text, which often embodies much relevant design knowledge. Last but not least, design rationale is generally captured by identifying elements and their dependencies, i.e. in a structured way which opens the opportunity for going beyond simple keyword-based searching. In this paper, the management of design rationale for the re-use of design knowledge is presented. The retrieval of design rationale records in particular is discussed in detail. As evidenced in the development and evaluation, the methods proposed are useful for the re-use of design knowledge and can be generalised to be used for the retrieval of other kinds of structured design knowledge. [All rights reserved Elsevier].", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Advanced Engineering Informatics", "doi": "10.1016/j.aei.2012.02.003", "url": "", "keyword": "Design knowledge", "cluster": 1, "cluster_theme_terms": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "cluster_label_candidate": "Design knowledge — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "We introduce the knowledge construction process through a case study in the context of creative cultural design. [E2] We believe that the work presented in this paper contributes to a better understanding of design knowledge and its tran  be used for building a catalogue of plans/pattern and variables' roles encountered in CS1 practice, in CS1 assessment, and in the literature on introductory programming; this catalogue will be the basis for designing new instructional/learning material for fostering strategic knowledge. The developed material will be used in one of our introductory programming courses and in peer tutoring activities for the students. The effectiveness will be tested evaluating students programming skills with a pre-test and a post-test, using a group as a treatment group and another one as control group.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2020", "venue": "Proceedings of the 2020 ACM Conference on International Computing Education Research", "doi": "10.1145/3372782.3408115", "url": "https://doi.org/10.1145/3372782.3408115", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of design: one that emphasizes both the construction-centered and human-centered aspects of design in IS. [E4] We discuss the applicability of our findings using a case of formulation and application of design principles for data spaces in a transdisciplinary research consortium. [E1]", "design_knowledge_form": "Design knowledge — Design principles and Design science", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_cont gorisation of precedent, may act as a means to interpret this information and identify relationships between existing buildings and new design. This work explores the link between typology and the design process and asks how typological thinking may benefit novice designers in the context of the architectural design studio. The research conceptually synthesises theories of typology with design methods to provide a practical framework for the application of typology in design studio teaching. Adopting a stage-based model of design, underpinned by the critical method as a description of individual design cycles, the framework offers a means of guiding project decisions, encouraging ideation and accessing information embedded in design precedents. The research is exploratory in nature and adopts a participant observation approach to develop and test the proposed framework. This is supported by data gathered from case studies, structured interviews and questionnaires. The typological learning framework is supported by the results of the research and considers various interpretations of typology at each stage in the design process, analytical processes required and practical guidance for designers and educators.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "International Journal of Technology and Design Education", "doi": "10.1007/s10798-017-9421-4", "url": "", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two  its current state and the associated challenge. Models and methods constitute one form of HCI design knowledge. They are acquired and validated explicitly by case studies solving the general HCI problem of design. The latter having the particular scope of humans interacting with computers to do something as desired. Both general question and particular scope are viewed from a discipline perspective. The introduction, as one type of HCI design knowledge, is preceded in the previous chapter on craft artefacts and design practice experience and followed in the subsequent chapter by principles, rules and heuristics, as other types of HCI design knowledge.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "HCI Design Knowledge: Critique, Challenge, and a Way Forward. Synthesis Lectures on Human-Centered Informatics", "doi": "10.1007/978-3-031-79209-0_6", "url": "", "keyword": "Design knowledge", "cluster": 2, "cluster_theme_terms": "hci | hci design | design | knowledge | edps | hci edps | design knowledge | practice | design practice | declarative | procedural | principles | hci engineering | models methods | models", "cluster_label_candidate": "Design knowledge — HCI design and Design practice", "distinguishing_evidence_terms": "HCI design, Design practice", "cluster_summary_candidate": "The introduction, as one type of HCI design knowledge, is preceded in the previous chapter on craft artefacts and design practice experience and followed in the subsequent chapter by principles, rules and heuristics, as other types of HCI design knowledge. [E1] Together, both types of knowledge constitute HCI design knowledge, acquired by HCI research to support HCI design practice in solving the HCI general problem of design. [E2]", "design_knowledge_form": "Design knowledge — HCI design and Design practice", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": xtensively on three pivotal but often tacitly deployed epistemologies: the Platonic-Aristotelian, the pragmatic, and the postmodern. Platonic epistemology is latent in many commonplace design instruction texts. Pragmatic epistemology underscores the industrial-arts ethos of design. Postmodern epistemologies dominate in university programs—especially graduate and Ph.D. programs. The article considers how these competing epistemologies understand the role of imagination in the act of creation. The article then considers the role of explanation in the carrying out of research in creative design and arts fields. It addresses whether, and to what degree, design research ought to rely on explanatory words as its principal medium of research, or whether it is valid to substitute artifactual creation for intellectual explanation in the research process.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2017", "venue": "", "doi": "", "url": "https://www.semanticscholar.org/paper/b8368428524409fb5ce01bc510bb3e1c79eff1b9", "keyword": "Design knowledge", "cluster": 0, "cluster_theme_terms": "design | knowledge | principles | design principles | research | design knowledge | theory | science | design science | patterns | data | principle | et | et al | al", "cluster_label_candidate": "Design knowledge — Design principles and Design science", "distinguishing_evidence_terms": "Design principles, Design science", "cluster_summary_candidate": "Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of design: one that emphasizes both the construction-centered and human-centered aspects of design in IS. [E4] We discuss the applicability of our findings using a case of formulation and application of design principles for data spaces in a transdisciplinary _title": "Communicating nascent design theories on innovative information systems through multi-grounded design principles", "sentences": "In this paper, we contribute an extension of an existing publication scheme, tailored towards the publication of such intermediate, work in progress design knowledge in the form of prescriptive design principles. We argue that this publication scheme extension will help to communicate design knowledge in earlier project stages, which allows a faster feedback to the knowledge base that will enable a broader community to participate in the 'search process' for an optimal design solution. © 2014 Springer International Publishing.", "paragraph_index": 0, "sentence_hash": "b08fd230e700", "score": 23.0, "score_breakdown": {"total": 23.0, "term_overlap": 13.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "phrase match: \"design science\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we contribute\"", "own-claim marker: \"we argue\"", "own-claim marker: \"in this paper, we\""]}}, {"id": "E3", "paper_id": "e8f4a7417bf7", "paper_title": "Toward a Method for Design Science Research Meta-Studies to Improve the Reusability of Design Principles", "sentences": "In this methodology paper, we propose an approach to conduct meta-studies for design knowledge to tackle the issue of low DP reusability. We developed a process model for meta-studies based on DSR-specific terms, evaluated it in an expert workshop with DSR scholars, and demonstrated its application to the example of virtual reality literature.", "paragraph_index": 0, "sentence_hash": "df015071bc3b", "score": 22.0, "score_breakdown": {"total": 22.0, "term_overlap": 12.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "phrase match: \"design science\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we develop\""]}}, {"id": "E4", "paper_id": "a200b553056c", "paper_title": "The design construct in information systems design science", "sentences": "In this paper, we argue that current conceptualizations of design in IS are overly narrow, which necessarily limits what is viewed as acceptable DS research. Further, whereas the current conceptualization of design in IS views IS design knowledge as split across two paradigms, namely DS and behavioral science, in this paper we argue for a broader and more integrated view of design: one that emphasizes both the construction-centered and human-centered aspects of design in IS.", "paragraph_index": 0, "sentence_hash": "19249f5f8387", "score": 20.0, "score_breakdown": {"total": 20.0, "term_overlap": 8.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design science\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we argue\"", "own-claim marker: \"in this paper, we\"", "own-claim marker: \"in this paper we\"", "action pattern (translates): \"implications for design\""]}}, {"id": "E5", "paper_id": "df4ffdba87ae", "paper_title": "Reconciling theories with design choices in design science research", "sentences": "In this paper, we address one particularly murky issue in design science research: reconciling theoretical abstractness with practicality. We present a case study of real information system (IS) development where these issues become evident.", "paragraph_index": 0, "sentence_hash": "30635baba383", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design science\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we present\"", "own-claim marker: \"in this paper, we\""]}}, {"id": "E6", "paper_id": "c0efa7750b45", "paper_title": "Forms of reasoning in the design science research process", "sentences": "We argue that a more thorough investigation of these reasoning logics allows for a more comprehensive understanding of the DSR models and the building of information systems design theories (ISDTs). We present an idealized model of the hypothetico-deductive method, showing how progress is achieved in science.", "paragraph_index": 0, "sentence_hash": "e94b2c00e125", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design science\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we present\"", "own-claim marker: \"we argue\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "A conceptual framework for design science research", "year": "2011", "paper_id": "a8b318749f73"}, {"title": "Towards a Method for Design Principle Development in Information Systems", "year": "", "paper_id": "5a716d80ac6b"}, {"title": "Guidelines supporting the formulation of design principles", "year": "2018", "paper_id": "9d158233f041"}]}, {"cluster": 1, "count": 54, "theme": "design | knowledge | design knowledge | dsr | research | product | process | level | model | designers | design research | theory | et | object | al", "label": "Design knowledge — Design process and Design research", "summary": "We introduce the knowledge construction process through a case study in the context of creative cultural design. [E2] We believe that the work presented in this paper contributes to a better understanding of design knowledge and its transfer mechanisms, and it may serve as a basis for design educators to improve their teaching programs. [E3]", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": "", "contribution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical interpretation", "application_domain_definitions": "Not applicable", "theory_move": "", "theory_move_patterns": "", "theory_move_support": "", "source_evidence": [{"id": "E1", "paper_id": "5f810f61b926", "paper_title": "A typology of design knowledge: A theoretical framework", "sentences": "Based on this, we developed a typology, which consists of four different types of design knowledge and three interjacent transitions. To illustrate further we present examples for each knowledge type and transition and we suggest prototypical approaches for transferring these types of design knowledge in the context of design education.", "paragraph_index": 0, "sentence_hash": "0335179a1706", "score": 24.5, "score_breakdown": {"total": 24.5, "term_overlap": 11.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design process\"", "phrase match: \"design research\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we present\"", "own-claim marker: \"we develop\"", "own-claim marker: \"this paper contributes\"", "action pattern (synthesizes): \"literature review\""]}}, {"id": "E2", "paper_id": "f7668dd5c63f", "paper_title": "Construction of Intermediate Knowledge in Design: A Case Study of Cultural and Creative Product Design", "sentences": "This paper proposes a method for constructing intermediate knowledge to support team knowledge co-creation. We introduce the knowledge construction process through a case study in the context of creative cultural design.", "paragraph_index": 0, "sentence_hash": "1fb66349b747", "score": 22.0, "score_breakdown": {"total": 22.0, "term_overlap": 8.0, "first_person": 8.0, "action": 4.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design knowledge\"", "own-claim marker: \"we introduce\"", "own-claim marker: \"this paper proposes\"", "action pattern (evaluates): \"we evaluate\"", "action pattern (evaluates): \"we evaluated\""]}}, {"id": "E3", "paper_id": "0c63b5d36c1b", "paper_title": "A User-Oriented Design Knowledge Reuse Model", "sentences": "Following that, we identify three design knowledge reuse patterns which contribute to the understanding of how designers reuse knowledge during the design process. Based on that, we propose a design knowledge reuse model.", "paragraph_index": 0, "sentence_hash": "de6c28516323", "score": 21.0, "score_breakdown": {"total": 21.0, "term_overlap": 11.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "phrase match: \"design knowledge\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we identify\""]}}, {"id": "E4", "paper_id": "95eee570b8f1", "paper_title": "Accumulating design knowledge: A mechanisms-based approach", "sentences": "Drawing from theory on knowledge creation, we conceptualize accumulation along the goals and scope of knowledge in DSR as a distinct knowledge creation problem. We contribute a theoretical framework conducive to integrating knowledge produced through different methods by introducing the knowledge creation processes as a distinct unit of analysis in DSR and by pointing out that extant procedural models may need revision to account for the continuous knowledge creation occurring in potentially multiyear DSR projects. © 2020 by the Association for Information Systems.", "paragraph_index": 0, "sentence_hash": "ec44ce58489d", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 7.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design knowledge\"", "own-claim marker: \"we develop\"", "own-claim marker: \"we contribute\"", "own-claim marker: \"we conceptualize\"", "action pattern (defines): \"we conceptualize\""]}}, {"id": "E5", "paper_id": "3e4851eff856", "paper_title": "Knowledge transfer in design education: A framework of criteria for design exercises", "sentences": "This paper presents suggestions how to frame design educational exercises with the aim to transfer specific types of design knowledge to students, or to generate new design knowledge within students, respectively. We believe that the work presented in this paper contributes to a better understanding of design knowledge and its transfer mechanisms, and it may serve as a basis for design educators to improve their teaching programs.", "paragraph_index": 0, "sentence_hash": "22ecfcc8cb34", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 5.0, "first_person": 8.0, "action": 4.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design knowledge\"", "own-claim marker: \"this paper presents\"", "own-claim marker: \"this paper contributes\"", "action pattern (defines): \"refers to\"", "action pattern (organizes): \"a typology of\""]}}, {"id": "E6", "paper_id": "cc5e9fe45cc6", "paper_title": "A study of practice based design research models from knowledge integration perspective", "sentences": "The design research process in practice can be regarded as the process of knowledge production. Through the analysis, we define four typical practice based design research models from the viewpoint of knowledge integration.", "paragraph_index":
