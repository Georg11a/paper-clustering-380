<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Patterns · Statistical bottom-up interpretation</title>
  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafd;
      --accent: #256fbd;
      --accent-soft: #eaf3ff;
      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }
    .controls {
      display: grid;
      grid-template-columns: 180px 210px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }
    .point { stroke: white; stroke-width: 1.8; cursor: pointer; opacity: 0.86; transition: opacity 120ms ease; }
    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }
    .legend { max-height: 150px; overflow-y: auto; background: #ffffff; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }
  </style>
</head>

volves navigating a complex space of possible mechanics, which presents a significant challenge both for professional designers and for educators seeking to teach the discipline effectively. While existing theoretical models frequently offer high-level conceptual frameworks, these often lack the granularity necessary to support the practical needs of designers who must identify, understand, and apply specific mechanics in diverse game development contexts. This research addresses that gap by outlining the utility of a structured theoretical model that compiles and organises hundreds of individual game mechanics, not only describing them but also demonstrating a practice-oriented rationale. The model has two primary aims: to assist designers in conceptualising and navigating the broad array of mechanical possibilities, thereby supporting creative ideation and analytical problem-solving; and to provide a robust and pedagogically effective foundation for game design education. A theoretical model could bridge the gap between abstract theoretical models and the practical demands of game design practice. A model such as the one described here would enable a more direct and effective translation of theory into practice, equipping designers with a more precise vocabulary and educators with a clearer pedagogical structure for explaining complex gameplay systems. By refining the connection between gameplay theory and design implementation, this research contributes to the evolving body of knowledge in game studies and design education, offering a new perspective on how mechanical complexity can be better understood, taught, and applied in creative contexts. The framework also opens new avenues for further research into game design patterns, player experience, and curriculum development, reinforcing the central role of mechanics in shaping both game systems and player engagement.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_para , {"paper_id": "368e4036648e", "title": "From Directional Stimuli to Prompt Architectures: Documenting the Practice of Meta-Prompting", "authors": "D. Ligot", "abstract": "As large language models (LLMs) transition from experimental tools to core components of production systems, the limitations of ad-hoc, instance-specific prompting have become increasingly apparent. In response, practitioners and researchers have begun to adopt meta-prompting: a family of prompt engineering practices that operate at a higher level of abstraction by defining how prompts themselves should be structured, generated, and governed across classes of tasks. This paper documents and formalizes the practice of meta-prompting as a distinct design paradigm. We present a unified conceptual definition of meta-prompting, emphasizing its focus on reusable structures, task-level abstraction, and the separation of prompt logic from task content. Building on this definition, we introduce a layered model of prompt abstraction and a comprehensive taxonomy of meta-prompting practices, including framework based prompting, prompt-generation loops, structured prompt representations, reasoning templates, governance layers, and multi-agent orchestration. We further analyze the relationship between meta-prompting and directional stimulus prompting (DSP), positioning meta-prompting as an evolutionary generalization that extends instance-level steering into full prompt architectures.  Through concrete design patterns and real-world applications—ranging from enterprise standardization and compliance workflows to agent systems and orchestration frameworks—we demonstrate how meta-prompting enables scalable, consistent, and governable LLM deployments. We conclude by discussing key limitations, open challenges, and future research directions, including automated meta-prompt learning, formal evaluation metrics, and integration with LLM operations. Together, these contributions position meta-prompting as a foundational paradigm for the design and operation of modern AI systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2026", "venue": "Social Science Research Network", "doi": "", "url": "https://www.semanticscholar.org/paper/cc6622c7b5aec35fb3b4174aa730a28c6c5c0844", "keyword": "Design Patterns", "cluster": 1, "cluster_theme_terms": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "cluster_label_candidate": "Design Patterns — Software design and Software development", "distinguishing_evidence_terms": "Software design, Software development", "cluster_summary_candidate": "Seeking to ground this intuition in a well-defined vocabulary, we define two criteria of distinction in mathematical logic. [E1] In this paper, we propose a model that uses object-oriented design patterns to develop a core bitemporal conceptual model. [E2]", "design_knowledge_form": "Design Patterns — Software design and Software development", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": "", "contribution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical guish three abstraction strata in software design statements: (i) Strategic design statements (`architectural design') determine global constraints, such as programming paradigms, architectural styles, component-based software enginering standards, design principles, and law-governed regularities; (ii) Tactical design statements (`detailed design') determine local constraints, such as design patterns, programming idioms, and refactorings; (iii) Implementation statements determine specific properties of the implementation, such as a class diagrams and program documentation. Seeking to ground this intuition in a well-defined vocabulary, we define two criteria of distinction in mathematical logic. We present the Intension/Locality hypothesis, postulating that the spectrum of software design statements is divided into three well-defined `abstraction classes' as follows: (i) the class of non-local statements (N L) contains Strategic statements; (ii) the class of local and intensional statements (L I) contains Tactical statements; and (iii) the class of local and extensional statements (L E) contains Implementation statements. We demonstrate a broad range of software design statements that corroborate our hypothesis. We conclude with a proof of the architectural mismatch theorem, according to which architectural mismatch arises from attempting to combine components that assume conflicting non-local statements.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "IEE Proceedings-Software", "doi": "10.1049/ip-sen:20050075", "url": "", "keyword": "Design Patterns", "cluster": 1, "cluster_theme_terms": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "cluster_label_candidate": "Design Patterns — Software design and Software development", "distinguishing_evidence_terms": "Sof ults. Our searches identified 611 candidate papers. Applying our inclusion/exclusion criteria resulted in a final set of 10 papers that described 11 instances of “formal” experimental studies of object-oriented design patterns. We augmented our analysis by including seven “experience” reports that described application of patterns using less rigorous observational forms. We report and review the profiles of the empirical evidence for those patterns for which multiple studies exist. Conclusions. We could not identify firm support for any of the claims made for patterns in general, although there was some support for the usefulness of patterns in providing a framework for maintenance, and some qualitative indication that they do not help novices learn about design. For future studies we recommend that researchers use case studies that focus upon some key patterns, and seek to identify the impact that their use can have upon maintenance.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2012", "venue": "", "doi": "10.1109/TSE.2011.79", "url": "", "keyword": "Design Patterns", "cluster": 1, "cluster_theme_terms": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "cluster_label_candidate": "Design Patterns — Software design and Software development", "distinguishing_evidence_terms": "Software design, Software development", "cluster_summary_candidate": "Seeking to ground this intuition in a well-defined vocabulary, we define two criteria of distinction in mathematical logic. [E1] In this paper, we propose a model that uses object-oriented design patterns to develop a core bitemporal conceptual model. [E2]", "design_knowledge_form": "Design Patterns — Software design and Software development", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution ing and conveying lessons learned by experienced designers. There is a large gap, however, between the aesthetic and elegance of the patterns as intended and the reality of working with an ultimately mathematically expressible system such as code. We describe a step towards meaningful formal analysis of code within the language of patterns, and discuss potential uses. The major contributions include: a compendium of elemental design patterns (EDPs), a layer of seemingly simplistic relationships between objects that, on closer inspection, provide a critical link between the world of formal analysis and the realm of pattern design and implementation without reducing the patterns to merely syntactic constructs; an extension to the σ-calculus, termed ρ-calculus, a formal notation for expressing relationships between the elements of object oriented languages, and its use in expressing the EDPs directly. We discuss their use in composition and decomposition of existing patterns, identification of pattern use in existing code to aid comprehension, and future research directions, such as support for refactoring of designs, interaction with traditional code analysis systems, and the education of students of software architecture. © 2003 IEEE.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2003", "venue": "Proceedings - 27th Annual NASA Goddard / IEEE Software Engineering Workshop, SEW 2002", "doi": "10.1109/SEW.2002.1199472", "url": "", "keyword": "Design Patterns", "cluster": 1, "cluster_theme_terms": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "cluster_label_candidate": "Design Patterns — Software design and Software development", "distinguishing_evidence_terms": "Software design, Software development", "cluster_summary_candidate": "Seeking to ground this intuition in a wel ted Nations Sustainable Development Goals were analyzed using key performance indicators. Detailed analysis was used to explore their current development status. Scientific publication and citation network analyses were used to examine the historical developments and interrelationships between two disciplines. The review revealed that both disciplines are closely related to the United Nations Sustainable Development Goals, especially regenerative urban design, but they have developed independently in the field of urban design. Unlike the descriptions found in many of the identified papers, restorative urban design not only focuses on ecological aspects but also attempts to create a built environment that allows its users to thrive both physically and mentally. Regenerative urban design is more inclined to restore or create an “ability”. Further, both disciplines are in their infancy but have evolved from internal conceptual development to the stage of exploring external relationships and frameworks as well as mechanisms. This review found that although many frameworks and models are used to support and evaluate these two disciplines, almost all of them fail to integrate necessary aspects of the ecosystem, e.g., elements, relationships, processes, etc. Moreover, future work should examine the design patterns that are closely related to restorative and regenerative urban design to better guide the concrete practice.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2022", "venue": "Sustainability", "doi": "", "url": "https://www.semanticscholar.org/paper/74899d67d3abaa19a3ba03da3021d15a3aeeaebe", "keyword": "Design Patterns", "cluster": 1, "cluster_theme_terms": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "cluster_label_candidate": "Design Patterns — Software design and S  patterns.\" However, a description of a pattern is not the pattern itself. Consequently, it does not bring an imminent understanding of the pattern. On the other hand, when looking at patterns directly, it is difficult to see their essence in all the details of the context in which they are applied. Drama and a particular kind of organizational patterns called drama patterns have much to offer here. With drama patterns, it is easy to prepare involving drama plays in a very short time. Drama patterns let their participants see them from within and understand why the conflict of contradicting forces is the essence of a pattern and how patterns generate so diverse solutions depending on the context. Some drama patterns correspond to certain design patterns. Consequently, these design patterns can be played and experienced directly. Organizing people in software development is similar to creating drama plays. Although these drama plays will never be performed in front of the audience, they are important because they are reflected in the resulting software systems. Many lessons from drama can help in growing software development organizations with organizational patterns.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2024", "venue": "", "doi": "10.1109/Informatics62280.2024.10900778", "url": "", "keyword": "Design Patterns", "cluster": 0, "cluster_theme_terms": "patterns | design | pattern | design patterns | ai | systems | interaction | pattern language | language | dark | alexander | robot | legal | interactions | human", "cluster_label_candidate": "Design Patterns — Pattern language and Dark patterns", "distinguishing_evidence_terms": "Pattern language, Dark patterns", "cluster_summary_candidate": "This paper presents the E-AIP (Engineering–AI Pedagogy) Framework, which centers three pillars learning Outcomes, Process Evidence, and Integrity & Ethics Guardrails and links them to design lever bution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical interpretation", "application_domain_definitions": "Not applicable", "theory_move_key": "not_applicable", "theory_move": "", "theory_move_patterns": "", "theory_move_support": "", "facet_population_or_context": "", "facet_stakeholder_or_population": "", "facet_method_or_lens": "", "facet_artifact_or_domain": "", "facet_contribution_or_outcome": "", "umap_x": 19.01140022277832, "umap_y": 9.877585411071777, "distance_to_centroid": 0.2400275468826294, "representative_rank": 53, "is_representative_top3": false, "medoid_rank": 53, "lda_topic": -1, "lda_topic_probability": 0.0, "lda_topic_words": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "nearest_papers": [{"paper_id": "6c928237afcf", "title": "Micro patterns in Java code", "cluster": 1, "distance": 0.2544897198677063}, {"paper_id": "4000c6073b5d", "title": "Design Principles for Internal Domain-Specific Languages: A Pattern Catalog Illustrated by Ruby", "cluster": 1, "distance": 0.2693740725517273}, {"paper_id": "aea175ec1e11", "title": "Typed Design Patterns for the Functional Era", "cluster": 1, "distance": 0.269616961479187}, {"paper_id": "242644458c6e", "title": "A pattern approach to interaction design", "cluster": 0, "distance": 0.2724974751472473}, {"paper_id": "8393d36cff90", "title": "An overview of human-computer interaction patterns in pervasive systems", "cluster": 0, "distance": 0.2833516597747803}], "hdbscan_peripheral": false}, {"paper_id": "ce6761927633", "title": "Definition and use of software requirement patterns in requirements engineering", "authors": "Cristina Palomares", "abstract": "The final quality of software products and services depends on the requirements stated in the Software Requirements Specifications (SRSs). However, some problems like ambiguity, incompleteness and inconsistency have been reported in the writing of SRSs, especially when natural language is used. Requirements reuse has been proposed as a key asset for requirements engineers to efficiently elicit, validate and document software requirements and, as a consequence, obtain SRSs of better quality through more effective engineering processes. Among all the possible techniques to achieve reuse, patterns hold a prominent position. In their most classical form, patterns describe problems that occur over and over again, and then describe the core of the solution to these problems. Software engineering practitioners have adopted the notion of pattern in several contexts, remarkably related to software design (e.g., design patterns and software architectural patterns), but also in other software development phases, both earlier and later. Following this strategy, requirement patterns emerge as a natural way to reuse knowledge during the Requirements Engineering (RE) stage. Although there have been several techniques proposed to reuse requirements, it has been observed that no concrete proposal has achieved a wide acceptance, neither any covered all the necessary elements to encourage organizations to adopt requirements reuse. As a consequence, this thesis proposes the use of Software Requirement Patterns (SRPs) as a means to capture and reuse requirements knowledge in the context of information technology projects. Following the typical context-problem-solution structure of patterns, an SRP mainly consists of: a template (solution) that may generate one or more requirements when applied in a certain project, and some information (context-problem) to identify its applicability in that project. To facilitate their use, SRPs are encapsulated inside the PABRE (PAttern-Based Requirements Elicitation) framework. The framework covers all the elements that could be critical for the adoption of a requirements reuse technique. Specifically, the framework includes: - A metamodel that describes the structure and semantics of SRPs and their organization inside a catalogue. - An SRP catalogue composed by non-functional, non-technical and functional SRPs, the functional ones being specific for the content management system domain. - A method for guiding the use of an SRP catalogue during requirements elicitation and specification, as well as another one for constructing and updating it. - An economic model to perform cost-benefit analysis on the adoption of SRPs based on return-on-investment. - The PABRE system as technological support. In order to analyse the benefits and drawbacks of the SRPs proposed in this thesis, two empirical studies have been carried out to investigate the perception of participants about requirement patterns in general and SRPs in particular. The first one is an exploratory survey addressed to information technology people with industrial experience in RE, which analyses the current state of the practice of requirement patterns approaches. The second one corresponds to a set of semi-structured interviews, focussed on the SRP approach, conducted to requirements engineers of Swedish organizations. Moreover, as it has been discovered that there are few empirical studies showing the state of the practice of requirements reuse in industry, the first study also explores the current situation of requirements reuse practices in organizations. La qualitat final dels productes i serveis de software depèn del requisits definits en l’especificació de Requisits Software (ERS). Tot i així, alguns problemes com la ambigüitat, incompletesa i inconsistència han sigut detectats en la escriptura dels ERS, especialment quan el llenguatge natural és usat per escriure’ls. La reutilització de requisits ha sigut proposada com un recurs clau pels enginyers de requisits per tal d’obtenir, validar i documentar requisits software i, com a conseqüència, obtenir ERS de millor qualitat usant processos d’enginyeria més efectius. Entre totes les tècniques possibles per aconseguir la reutilització, els patrons tenen una posició destacada. En la seva forma més clàssica, els patrons descriuen problemes que ocorren sovint, i després descriuen la part central de la solució a aquests problemes. Els professionals de la enginyeria del software han adoptat la noció de patró en diferents àmbits, especialment en els relacionats amb el disseny del software (per exemple, els patrons de disseny i els patrons d’arquitectura del software), però també en altres etapes del desenvolupament del software, tant abans com després del seu disseny. Seguint aquesta estratègia, els patrons de requisits emergeixen com una manera natural de reutilitzar coneixement durant l’etapa d’enginyeria de requisits. Tot i que hi ha hagut varies tècniques proposades per reutilitzar requisits, s’ha observat que no hi ha cap proposta concreta que hagi aconseguit una àmplia acceptació, ni cap proposta completa que cobreixi tots els elements necessaris per animar a les organitzacions a adoptar la reutilització de requisits. Com a conseqüència, aquesta tesis proposa l’ús de Patrons de Requisits Software (en anglès Software Requirement Patterns o SRPs) com un medi per capturar i reutilitzar coneixement de requisits en l’àmbit de projectes de tecnologia de la informació. Seguint la estructura típica dels patrons de context-problema-solució, un SRP consisteix en: una plantilla (solució) que pot generar un o més requisits quan és aplicat en un projecte específic, i informació relacionada (context-problema) per identificar la seva aplicabilitat en un projecte. Per facilitar el seu ús, els SRP han sigut encapsulats dintre del framework PABRE (de l’anglès PAttern-Based Requirements Elicitation). El framework cobreix tots els elements que podrien ser crítics per adoptar una tècnica de reutilització de requisits. Més aviour and describes its impact on swarm performance. In this paper, we explore information exchange design patterns for robot swarm foraging. First, a method for the specification of design patterns for robot swarms is proposed that builds on previous work in this field and emphasises modular behaviour design, as well as information-centric micro-macro link analysis. Next, design pattern application rules that can facilitate the pattern usage in robot control algorithms are given. A catalogue of six design patterns is then presented. The patterns are derived from an extensive list of experiments reported in the swarm robotics literature, demonstrating the capability of the proposed method to identify distinguishing features of robot behaviour and their impact on swarm performance in a wide range of swarm implementations and experimental scenarios. Each pattern features a detailed description of robot behaviour and its associated parameters, facilitated by the usage of a multi-agent modeling language, BDRML, and an account of feedback loops and forces that affect the pattern’s applicability. Scenarios in which the pattern has been used are described. The consequences of each design pattern on overall swarm performance are characterised within the Information-Cost-Reward framework, that makes it possible to formally relate the way in which robots acquire, share and utilise information. Finally, the patterns are validated by demonstrating how they improved the performance of foraging e-puck swarms and how they could guide algorithm design in other scenarios.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2018", "venue": "Frontiers in Robotics and AI", "doi": "", "url": "https://www.semanticscholar.org/paper/c0e4bf9fdb915af3d209f1f463cadfcdcfd3d445", "keyword": "Design Patterns", "cluster": 0, "cluster_theme_terms": "patterns | design | pattern | design patterns | ai | systems | interaction | p  "Design patterns for sociality in human-robot interaction", "sentences": "We propose that Christopher Alexander's idea of design patterns can benefit the emerging field of HRI. Then, after describing our method for generating patterns, we offer and describe eight possible design patterns for sociality in human robot interaction: initial introduction, didactic communication, in motion together, personal interests and history, recovering from mistakes, reciprocal turn-taking in game context, physical intimacy, and claiming unfair treatment or wrongful harms.", "paragraph_index": 0, "sentence_hash": "b3357bdc9656", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we propose\"", "own-claim marker: \"our method\""]}}, {"id": "E3", "paper_id": "e4c9f86a6933", "paper_title": "Design patterns for exploring and prototyping human-robot interactions", "sentences": "In this paper, we explore how such building blocks might serve as interaction design patterns that enable design exploration and prototyping for human-robot interaction. Design sessions with designers and developers demonstrated the promise of using a pattern language for designing robot interactions, confirmed the usability of our authoring environment, and provided insights into future research on tools for human-robot interaction design.", "paragraph_index": 0, "sentence_hash": "3d048eeddc1d", "score": 18.0, "score_breakdown": {"total": 18.0, "term_overlap": 12.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"pattern language\"", "phrase match: \"design patterns\"", "own-claim marker: \"in this paper, we\""]}}, {"id": "E4", "paper_id": "3269f651fd9c", "paper_title": "Designing AI-Enabled Engineering Courses: E-AIP Framework for Learning Outcomes, Process Evidence, and Integrity", "sentences": "This paper presents the E-AIP (Engineering–AI Pedagogy) Framework, which centers three pillars learning Outcomes, Process Evidence, and Integrity & Ethics Guardrails and links them to design levers (AI function, task authenticity, feedback granularity, locus of agency). We define seven constructs, state eight propositions about alignment, validity moderation, authenticity, and agency, and operationalize E-AIP through a compact matrix (AI function × outcome type with required process evidence and guardrails).", "paragraph_index": 0, "sentence_hash": "0e72b95415e6", "score": 18.0, "score_breakdown": {"total": 18.0, "term_overlap": 6.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "own-claim marker: \"this paper presents\"", "action pattern (defines): \"we define\""]}}, {"id": "E5", "paper_id": "242644458c6e", "paper_title": "A pattern approach to interaction design", "sentences": "This paper presents an approach that uses pattern languages to capture this knowledge in software development, human-computer interaction (HCI) and the application domain. As an example, experience from building an award-winning interactive music exhibit was turned into a pattern language, which was then used to inform follow-up projects and support HCI education. © 2001 Springer-Verlag London Limited.", "paragraph_index": 0, "sentence_hash": "b7ef538afef1", "score": 17.5, "score_breakdown": {"total": 17.5, "term_overlap": 10.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"pattern language\"", "phrase match: \"design patterns\"", "own-claim marker: \"this paper presents\""]}}, {"id": "E6", "paper_id": "388e4cf73d9e", "paper_title": "Team Design Patterns", "sentences": "This paper introduces the concept of team design patterns and proposes an intuitive graphical language for describing the design choices that influence how intelligent systems (e.g. artificial intelligence, robotics, etc.) collaborate with humans. Having such a language has the potential to improve the collaborative interaction among a variety of stakeholders such as end users, project managers, policy makers and programmers that may not be human-agent teamwork experts themselves.", "paragraph_index": 0, "sentence_hash": "1a038182f4e3", "score": 17.5, "score_breakdown": {"total": 17.5, "term_overlap": 10.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"this paper introduces\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "A pattern approach to interaction design", "year": "2001", "paper_id": "242644458c6e"}, {"title": "Team Design Patterns", "year": "2019", "paper_id": "388e4cf73d9e"}, {"title": "Development and evaluation of emerging design patterns for ubiquitous computing", "year": "2004", "paper_id": "be51adc4b7cc"}]}, {"cluster": 1, "count": 53, "theme": "patterns | design | pattern | design patterns | software | knowledge | architecture | model | security | design pattern | problem | use | architectural | used | object", "label": "Design Patterns — Software design and Software development", "summary": "Seeking to ground this intuition in a well-defined vocabulary, we define two criteria of distinction in mathematical logic. [E1] In this paper, we propose a model that uses object-oriented design patterns to develop a core bitemporal conceptual model. [E2]", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": "", "contribution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical interpretation", "application_domain_definitions": "Not applicable", "theory_move": "", "theory_move_patterns": "", "theory_move_support": "", "source_evidence": [{"id": "E1", "paper_id": "ca4fa896aabc", "paper_title": "A design pattern approach to bitemporal data modeling", "sentences": "In this paper, we propose a model that uses object-oriented design patterns to develop a core bitemporal conceptual model. We define three core design patterns that form a core bitemporal conceptual model of a typical bitemporal object.", "paragraph_index": 0, "sentence_hash": "51141980f016", "score": 23.0, "score_breakdown": {"total": 23.0, "term_overlap": 11.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "own-claim marker: \"we propose\"", "own-claim marker: \"our framework\"", "own-claim marker: \"in this paper, we\"", "action pattern (defines): \"we define\""]}}, {"id": "E2", "paper_id": "f8c905d3c779", "paper_title": "Structures to effectively share architectural knowledge", "sentences": "In this paper we explore the idea to raise patterns one level higher, to include the forces and tensions that play a role in shaping the design. We define a template for causal patterns and show its feasibility by working through an example and linking it to an existing ontology of architectural knowledge.", "paragraph_index": 0, "sentence_hash": "c6b6dd855965", "score": 22.0, "score_breakdown": {"total": 22.0, "term_overlap": 10.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "own-claim marker: \"in this paper we\"", "action pattern (defines): \"we define\""]}}, {"id": "E3", "paper_id": "631c79d1cbc5", "paper_title": "Abstraction classes in software design", "sentences": "Seeking to ground this intuition in a well-defined vocabulary, we define two criteria of distinction in mathematical logic. We present the Intension/Locality hypothesis, postulating that the spectrum of software design statements is divided into three well-defined `abstraction classes' as follows: (i) the class of non-local statements (N L) contains Strategic statements; (ii) the class of local and intensional statements (L I) contains Tactical statements; and (iii) the class of local and extensional statements (L E) contains Implementation statements.", "paragraph_index": 0, "sentence_hash": "3ceef72c10db", "score": 22.0, "score_breakdown": {"total": 22.0, "term_overlap": 10.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"software design\"", "phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "own-claim marker: \"we present\"", "action pattern (defines): \"we define\""]}}, {"id": "E4", "paper_id": "63e3bdac7fab", "paper_title": "What Do We Know about the Effectiveness of Software Design Patterns?", "sentences": "Although research in software engineering largely seeks to improve the practices and products of software development, many practices are based upon codification of expert knowledge, often with little or no underpinning from objective empirical evidence. We augmented our analysis by including seven “experience” reports that described application of patterns using less rigorous observational forms.", "paragraph_index": 0, "sentence_hash": "297f6163394e", "score": 20.0, "score_breakdown": {"total": 20.0, "term_overlap": 12.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"software design\"", "phrase match: \"software development\"", "phrase match: \"design patterns\"", "own-claim marker: \"our analysis\"", "action pattern (synthesizes): \"literature review\""]}}, {"id": "E5", "paper_id": "bf1ef2949b3c", "paper_title": "Design patterns: Abstraction and reuse of object-oriented design", "sentences": "We propose design patterns as a new mechanism for expressing object-oriented design experience. We describe how to express and organize design patterns and introduce a catalog of design patterns.", "paragraph_index": 0, "sentence_hash": "3fd301213c62", "score": 20.0, "score_breakdown": {"total": 20.0, "term_overlap": 10.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we describe\""]}}, {"id": "E6", "paper_id": "287b2d823523", "paper_title": "Architecture pattern organization", "sentences": "The successful adoption of design patterns in the software industry has had an important follow up by an effort towards a pattern based approach to architecture. In this paper we propose a comprehensive architecture pattern organization scheme that extends the Pattern Oriented System Architecture pattern categories to encompass end to end architecture concerns.", "paragraph_index": 0, "sentence_hash": "e3f7376a30cf", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we propose\"", "own-claim marker: \"in this paper we\""]}}], "source_faithfulness_score": 1.0, "representatives r_id": "506a676cb17b", "paper_title": "Toward Visualization for Games: Theory, Design Space, and Patterns", "sentences": "In this paper, we use examples from both old and new games of different genres to explore the theory and design space of visualization for games. Drawing on these examples, we define a design space for this novel research topic and use it to formulate design patterns for how to best apply visualization technology to games.", "paragraph_index": 0, "sentence_hash": "59c11df46124", "score": 25.5, "score_breakdown": {"total": 25.5, "term_overlap": 12.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design space\"", "phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "own-claim marker: \"in this paper, we\"", "action pattern (defines): \"we define\""]}}, {"id": "E2", "paper_id": "f7a213ef52da", "paper_title": "Dark patterns in the design of games", "sentences": "Game designers are typically regarded as advocates for players. In this paper, we develop the concept of dark design patterns in games, present examples of such patterns, explore some of the subtleties involved in identifying them, and provide questions that can be asked to help guide in the specification and identification of future Dark Patterns.", "paragraph_index": 0, "sentence_hash": "65043ee71714", "score": 20.0, "score_breakdown": {"total": 20.0, "term_overlap": 10.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"game design\"", "phrase match: \"design patterns\"", "own-claim marker: \"we develop\"", "own-claim marker: \"in this paper, we\""]}}, {"id": "E3", "paper_id": "462782b1c89b", "paper_title": "A taxonomy of 3D occlusion management techniques", "sentences": "In this paper, we build on previous work on mapping out the problem space of 3D occlusion by defining a taxonomy of the design space of occlusion management techniques in an effort to formalize a common terminology and theoretical framework for this class of interactions. We classify a total of 25 different techniques for occlusion management using our taxonomy and then go on to analyze the results, deriving a set of five orthogonal design patterns for effective reduction of 3D occlusion.", "paragraph_index": 0, "sentence_hash": "b504ee06d21f", "score": 20.0, "score_breakdown": {"total": 20.0, "term_overlap": 8.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design space\"", "phrase match: \"design patterns\"", "own-claim marker: \"our taxonomy\"", "own-claim marker: \"in this paper, we\"", "action pattern (organizes): \"a taxonomy of\""]}}, {"id": "E4", "paper_id": "c7ed46400a28", "paper_title": "Exploring the design space of composite visualization", "sentences": "We propose the notion of composite visualization views (CVVs) as a theoretical model that unifies the existing coordinated multiple views (CMV) paradigm with other strategies for combining visual representations in the same geometrical space. We identify five such strategies - called CVV design patterns - based on an extensive review of the literature in composite visualization.", "paragraph_index": 0, "sentence_hash": "0919b488b3df", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design space\"", "phrase match: \"design patterns\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we identify\""]}}, {"id": "E5", "paper_id": "fd29fa6c3eca", "paper_title": "The Conceptual Relationship Model: Understanding Patterns and Mechanics in Game Design", "sentences": "This paper revisits the concepts of game design patterns and game mechanics, arguing that refactoring these concepts is needed to clarify their relationships and motivations. Using this, we define and reflect upon what we refer to as the conceptual relationship model.", "paragraph_index": 0, "sentence_hash": "b52c63a608dc", "score": 18.5, "score_breakdown": {"total": 18.5, "term_overlap": 9.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"game design\"", "phrase match: \"design patterns\"", "own-claim marker: \"we define\"", "action pattern (defines): \"we define\""]}}, {"id": "E6", "paper_id": "ded38f6c2ce8", "paper_title": "Design Patterns for Situated Visualization in Augmented Reality", "sentences": "In this work, we leverage the richness of AR research and apply it to situated visualization. We derive design patterns which summarize common approaches of visualizing data in situ.", "paragraph_index": 0, "sentence_hash": "4159af17084f", "score": 17.0, "score_breakdown": {"total": 17.0, "term_overlap": 5.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design patterns\"", "own-claim marker: \"we derive\"", "own-claim marker: \"in this work, we\"", "action pattern (synthesizes): \"survey of\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "Toward Visualization for Games: Theory, Design Space, and Patterns", "year": "2012", "paper_id": "506a676cb17b"}, {"title": "The Conceptual Relationship Model: Understanding Patterns and Mechanics in Game Design", "year": "2014", "paper_id": "fd29fa6c3eca"}, {"title": "Revisiting the Design Patterns of Composite Visualizations", "year": "2023", "paper_id": "d14d96f15e60"}]}], "keywords": ["Design Patterns"]}</script>
  <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${Number(c) + 1}`;
    const clusterTopicLabel = value => String(value || '').replace(/\s*\[[^\]]+\]\s*$/, '').trim();
    const readableClusterLabel = c => { const label = clusterTopicLabel(c.label || c.theme); return `${label || clusterName(c.cluster)} · ${c.count} ${c.count === 1 ? 'paper' : 'papers'}`; };
    const clusterLegendLabel = c => readableClusterLabel(c);
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        opt.textContent = readableClusterLabel(c);
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Path 1 interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Topic Phrase</div>
          <div class="abstract">${escapeHtml(clusterTopicLabel(p.cluster_label_candidate))}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Key Phrases</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Prose Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Fine-Grained Form &amp; Review Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Status: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}

            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Review status: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>




          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Theory Move Candidate</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
