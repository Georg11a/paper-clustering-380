    :root {

      line-height: 1.35;
      background: var(--panel-soft);

      position: sticky;

      border-bottom: 1px solid var(--line);

      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);

      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;

      font-size: 13px;

 of multiple perspectives, or pluralism, in knowledge management, and to describe theoretical frameworks that support pluralism. Pluralism is defined as support for all three of the systems perspectives - hard, soft, and critical - that are implicit in the popular Davenport and Prusak (1998) definition of knowledge. These perspectives are associated with research paradigms (positivist, interpretivist, pluralist) and knowledge perspectives (application, normalization, creation). A case study of coordinating work in a hospital is reviewed to illustrate the role played by pluralistic approaches in knowledge management. A literature search is conducted to find frameworks that support pluralism. The findings are as follow. In the hospital case study the introduction of a patient record system (hard system) was the occasion for changes to both coordination (soft systems) and power relations (critical systems). Facts, norms and feelings are intertwined. While the electronic tool by itself is neutral in the face of power relations, its use in organisations is not. In this case at least, a holistic and pluralistic approach to knowledge management is required. In the search for frameworks to support pluralism, more than 50 frameworks from the general knowledge management literature are identified. Of the eight selected for further study, three are found to be pluralistic. These three - critical systems, scientific discourses, and Habermasian inquiry - share common characteristics. All three recognise that conflict is the precondition to knowledge creation, and that power relations, value commitments, and ethics are central to knowledge management. It is concluded that the knowledge management literature as a whole favours a single systems perspective (hard systems); a single research paradigm (positivism, focusing on objective facts); and a single knowledge management domain (knowledge application). This singular (non-pluralistic) approach produces theories about knowledge that has already emerged. Yet the Davenport and Prusak (1998) definition of knowledge and the hospital case study include two other perspectives - soft systems and critical systems - that focus on the organizational and individual aspects of emergence, respectively. In practice, knowledge management must address the need to simultaneously solve technical problems, resolve interpersonal issues, and dissolve personal conflict. The contribution of the paper is the comparison of knowledge management frameworks on the basis of underlying system perspectives, and the identification, description, and application of some pluralistic frameworks. Each systems perspective constitutes a different discourse on the purposes served by knowledge management, and pluralisms are required to integrate them. Pluralisms constitute both a framework for inquiry in knowledge management and a design theory for collaborative technologies. The review is not exhaustive. It is beyond the scope of this paper to examine the link between the purposes served by knowledge management and the methodology required for development. The paper contributes to the literature that seeks to understand the complexity of knowledge management practice via 'awareness of the potential and the implications of the different discourses in the study of knowledge and knowledge management'.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Electronic Journal of Knowledge Management", "doi": "", "url": "", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is ign Theory in Information Systems", "cluster": 1, "distance": 0.16950303316116333}], "hdbscan_peripheral": false}, {"paper_id": "12a0faff1d0d", "title": "A new approach of innovative design: An introduction to C-K theory", "authors": "Hatchuel, Armand (1); Weil, Benoît (1)", "abstract": "In this paper we introduce the main notions and first applications of a unified design theory. We call it 'C-K theory' because it stands that a formal distinction between spaces of 'Concepts' (C) and space of 'Knowledge' (K) is a condition for design. This distinction has key properties: i) it identifies the oddness of 'Design' when compared to problem solving approaches; ii) it distinguishes C-K theory from existing design theories like German systematic as C-K theory offers a precise definition of design and builds creativity within such definition. It does not require the too restrictive assumptions of General Design Theory [1] or Universal Design Theory [2]. It establishes that design reasoning is linked to a fundamental issue in set theory: the 'choice' axiom. It models the dynamics of design as a joint-expansion of a space of concepts and a space of Knowledge needing four operators C!K, K!C, C!C, K!K. They compose what can be imaged as a 'design square'. These operators capture the variety of design situations and the dynamics of innovative design.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2003", "venue": "Proceedings of the Design Society: International Conference on Engineering Design", "doi": "", "url": "", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candi ucted in the field of health science", "authors": "C. Nielsen; C. Jensen; B. Trettin", "abstract": "Abstract Aim(s) To discuss the methodological aspects of participatory design, arguing for a three‐phase approach and the suitability of situating participatory design within a phenomenological–hermeneutical tradition in health science. Design and methods Methodological discussion based on participatory design theory, epistemology and research studies. Results The epistemological and methodological discussions show how the core values and key elements of participatory design align with the phenomenological–hermeneutical approach. In addition, examples of participatory design studies are provided to illustrate how it can be conducted in health science. Conclusion Participatory design is a flexible framework based on genuine participation, defined by three core values: having a say, mutual learning and democratization. The iterative processes allow for adjustments in alignment with the core values and the scientific stance that defines the choice of methods, tools and techniques. A phenomenological–hermeneutic approach in participatory design studies is relevant and aligned with the core values of participatory design. Thus, this paper argues for a close integration between the participatory design methodology and the phenomenological–hermeneutic scientific approach within health science. Implications for the profession Participatory design is a powerful methodology with core values that can co‐design sustainable health technologies with potential to impact patient care and the clinical practice of nurses. When combined with qualitative research methods, patients' lived experiences serve as the foundation for improving clinical nursing practice. Discussing the epistemological aspects of participatory design provides nurse researchers with a coherent methodological understanding, essential for the continual development of nursing research. Impact This paper discusses the research methodology of participatory design within health sciences. It aims to address the lack of understanding of the methodology, particularly within a specific scientific stance. The main finding is the elaboration on participatory design and the relevance of a phenomenological–hermeneutical approach. The paper has the potential to impact researchers, master's and PhD students, as well as others engaged in participatory design or other methodologies related to user involvement within health science. Reporting method No available EQUATOR guidelines were applicable to this methodological paper, as no new data were created or analysed. Patient or public contribution There was no direct patient or public contribution, as this is a methodological paper.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2024", "venue": "Journal of Advanced Nursing", "doi": "", "url": "https://www.semanticscholar.org/paper/2bdecad1b5932fe0776bcaa97d6d76fd7694d1e6", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete. [E1] On the basis of these process knowledge types, we derive three theoretically grounded design principles for process guidance systems to support employees’ process execution. [E2]", "design_knowledge_form": "Design theory — Design process and Design science", "design_knowledge_action": "", "design_knowledge_role 0.15799075365066528}], "hdbscan_peripheral": false}, {"paper_id": "288676f720a1", "title": "A design theory for digital platforms supporting online communities: a multiple case study", "authors": "P. Spagnoletti; A. Resca; Gwanhoo Lee", "abstract": "This research proposes and validates a design theory for digital platforms that support online communities (DPsOC). It addresses ways in which digital platforms can effectively support social interactions in online communities. Drawing upon prior literature on IS design theory, online communities, and platforms, we derive an initial set of propositions for designing effective DPsOC. Our overarching proposition is that three components of digital platform architecture (core, interface, and complements) should collectively support the mix of the three distinct types of social interaction structures of online community (information sharing, collaboration, and collective action). We validate the initial propositions and generate additional insights by conducting an in-depth analysis of an European digital platform for elderly care assistance. We further validate the propositions by analyzing three widely used digital platforms, including Twitter, Wikipedia, and Liquidfeedback, and we derive additional propositions and insights that can guide DPsOC design. We discuss the implications of this research for research and practice.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2015", "venue": "Journal of Information and Technology", "doi": "", "url": "https://www.semanticscholar.org/paper/e0e64fb553b44ffc85c79f32f7fa53c7f7583af4", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "design | theory | information | design theory | service | theories | systems | instructional | learning | information systems | isdt | research | et al | principles | al", "cluster_label_candidate": "Design theory — Information systems and Design principles", "dis o-prescriptive guidelines for third-party practice. To exploit this connection between practical knowledge and prescriptive knowledge, however, we first need to overcome the problem that “know-how” is largely tacit in the moment of real-time forward-looking practice. In other words, the practitioner is not directly aware of their tacit “know-how”, or “tacit knowledge”, at the time of practice. In this article, we explore the contribution design theory can make to empirically eliciting, and conceptually inferring, the real-time “tacit knowledge” of entrepreneurial practice as a precursor to producing micro-prescriptive knowledge.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Journal of Business Venturing Insights", "doi": "", "url": "https://www.semanticscholar.org/paper/befeef12bbd0366a0c81034c7f964b82b76b220f", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. [E2]", "design_knowledge_form": "Design theory — C-K theory and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subty ": "Management design theories", "cluster": 0, "distance": 0.21400153636932373}, {"paper_id": "c2c57ac5453e", "title": "Theory construction in design research. Criteria, approaches, and methods.", "cluster": 1, "distance": 0.21562063694000244}], "hdbscan_peripheral": false}, {"paper_id": "2faef10b819d", "title": "A design theory for software engineering", "authors": "Jon G. Hall; L. Rapanotti", "abstract": "Context: Software Engineering is a discipline that has been shaped by over 50 years of practice. Many have argued that its theoretical basis has been slow to develop and that, in fact, a substantial theory of Software Engineering is still lacking.Objective: We propose a design theory for Software Engineering as a contribution to the debate. Having done this, we extend it to a design theory for socio-technical systems.Method: We elaborate our theory based on Gregors influential meta-theoretical exploration of the structural nature of a theory in the discipline of Information Systems, with particular attention to ontological and epistemological arguments.Results: We argue how, from an ontological perspective, our theory embodies a view of Software Engineering as the practice of framing, representing and transforming Software Engineering problems. As such, theory statements concern the characterisation of individual problems and how problems relate and transform to other problems as part of an iterative, potentially backtracking, problem solving process, accounting for the way Software Engineering transforms the physical world to meet a recognised need. From an epistemological perspective, we argue how the theory has developed through research cycles including both theory-then-(empirical-)research and (empirical-)research-then-theory strategies spanning over a decade; both theoretical statements and related empirical evidence are included.Conclusion: The resulting theory provides descriptions and explanations for many phenomena observed in Software Engineering and i ign", "authors": "Germonprez, Matt (1); Hovorka, Dirk (2); Collopy, Fred (3)", "abstract": "Tailorable technologies are a class of information systems designed with the intention that users modify and redesign the technology in the context of use. Tailorable technologies support user goals, intentions, metaphor, and use patterns in the selection and integration of technology functions in the creation of new and unique information systems. We propose a theory of tailorable technology design and identify principles necessary for the initial design. Following a Kantian style of inquiry, we identified four definitional characteristics of tailorable technology: a dual design perspective, user engagement, recognizable environments, and component architectures. From these characteristics, we propose nine design principles that will support the phenomenon of tailoring. Through a year-long case study, we refined and evidenced the principles, finding found that designers of tailorable technologies build environments in which users can both interact and engage with the technology, supporting the proposed design principles. The findings highlight a distinction between a reflective environment, where users recognize and imagine uses for the technology, and an active environment in which users tailor the technology in accordance with the imagined uses. This research contributes to the clarification of the role of theory in design science, expands the concept of 'possibilities for action' to IS design, and proposes a design theory of a class of information systems for testing and refinement. Copyright © 2007, by the Association for Information Systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2007", "venue": "Journal of the Association for Information Systems", "doi": "10.17705/1jais.00131", "url": "", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "design | theory | information | d y did not exist. In contrast, cognitive load theory emphasised that all novel information first is processed by a capacity and duration limited working memory and then stored in an unlimited long-term memory for later use. Once information is stored in long-term memory, the capacity and duration limits of working memory disappear transforming our ability to function. By the late 1990s, sufficient data had been collected using the theory to warrant an extended analysis resulting in the publication of Sweller et al. (Educational Psychology Review, 10, 251–296, 1998). Extensive further theoretical and empirical work have been carried out since that time and this paper is an attempt to summarise the last 20 years of cognitive load theory and to sketch directions for future research.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Educational Psychology Review", "doi": "", "url": "https://www.semanticscholar.org/paper/e28d73214751d51c3f46a867920be41c49c45130", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete. [E1] On the basis of these process knowledge types, we derive three theoretically grounded design principles for process guidance systems to support employees’ process execution. [E2]", "design_knowledge_form": "Design theory — Design process and Design science", "design_knowledge_action": s a methodological innovation, as it allows us to analyse both the inquiry process and the design process as interdependent when dealing with practical problems of a social and cultural nature. This approach allows us to analyse how human actions determine changes in the theoretical framework from which we make our inquiry. In short, the world is an open-ended project that humans design through our daily inquiry.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Philosophies", "doi": "", "url": "https://www.semanticscholar.org/paper/7e135cc8cc3f2977f008136b33bf88e38576edcc", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. [E2]", "design_knowledge_form": "Design theory — C-K theory and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": {"paper_id": "4025e28730c1", "title": "Conceptual foundations of design problem solving", "authors": "Smith, G.F. (1); Browne, G.J.", "abstract": "Design problems, processes, and methods are topics of longstanding interest in fields such as architecture and engineering. Design tasks are also common in domains addressed by systems and management scientists. However, much scientific work in these fields indicates little awareness of design theories and research. This paper introduces systems and management scientists to the extensive design theory literature. More importantly, it consolidates and extends that literature by developing a deep conceptual analysis of design problems and problem solving. The analysis is built around five elements of design problems: goals, constraints, alternatives, representations, and solutions. These elements define the basic tasks or functional demands posed by design problem solving. The paper also identifies special difficulties faced by designers in systems and management science domains.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "IEEE Transactions on Systems, Man and Cybernetics", "doi": "10.1109/21.260655", "url": "", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete. [E1] On the basis of these process knowledge types, we derive three theoretically groun  decision‐making heuristics. In contrast, decision‐making heuristics for (re)designing the world are rarer. This paper develops a heuristic combining the exploratory power of chimeras with a design logic. Chimeras have long been used to foster imagination and build initially unknown futures. And recent advances in design theory show that in decision‐making situations, chimeras can be generated as nonfalsifiable existential statements about desirable alternatives and events. Moreover, design theory offers learning operations that handle nonfalsifiable statements to generate new real objects. This paper uses these operations to build a rational heuristic that may or may not transform initial chimeras into reality. Its main effect is to ensure that stimulated learning leads to decision alternatives (whether pre‐existing or novel) that surpass the initial optimal one. This paves the way for a class of design‐based heuristics extending the main functions of Bayesian learning to a non‐Bayesian world.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "European Management Review", "doi": "", "url": "https://www.semanticscholar.org/paper/046e1e9a9fc6dc38b07293cd91dbc526b1db8743", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. [E2]", "design_knowledge_form": "Design theory — C-K theory and Design research", "design_knowledge_  a dilemma: grand challenges require rule breaking, but they also require the preservation, as much as possible, of existing resources, systems, know-how and societal values. Design for transition calls not for ‘creative destruction’, but for ‘creative preservation’. How do we model a design process that involves ‘creative preservation’? Today, it is recognized that category/topos theory provides a solid foundation for modelling complex systems and their evolution in design processes. Category theory can account for a design process inside a given ‘theory of the object’, while topos theory and design theory can account for the phenomena whereby a design process is innovative to preserve the knowledge structure. At the heart of this creative preservation is sheafification. In this study, we analyse the sheafification process using design theory. First, we characterize sheafification from a design perspective. Next, we propose a very simple illustration involving the sheafification of an ordinal 2 category presheaf. Finally, we show how sheafification can be used to enable ‘creative preservation’ in specific complex systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Proceedings of the Design Society", "doi": "", "url": "https://www.semanticscholar.org/paper/d28da3cd68003e5f171ae5f7535602430cfc0ad5", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate 3875", "title": "Design epistemology as innovation in public health research", "authors": "A. Estany", "abstract": "The idea of design has reached our theories of epistemology: a field that, at first glance, seems to be quite far removed from the analysis of practical situations. However, we should bear in mind that epistemology has shifted from an a priori perspective to a naturalized one, in the sense that we cannot engage in epistemology without taking into account the empirical results of science when it comes to configuring methodological models. The objective is to explore just how far design epistemology (DE) can be adopted as a methodological framework for research in biomedical sciences and in some of their applications as public health. To this end, we will analyze different approaches to DE and related terms and expressions such as “design thinking”, “design theory” and “designedly ways of knowing”. One of the issues that we need to address is precisely the polysemy that exists in the field of design, related to many different concepts. Thus, it seems impossible not to engage in a certain amount of conceptual analysis before we can embark on the study of the role of DE in public health research. Another of the questions that we will consider here is where to place biomedical sciences within the field of academic knowledge and research. The disciplines involved in this field of research range from biology to medicine and also to the applications of these knowledges, as in the case of public health. We will examine some of the definitions provided by international organizations and we will locate public health within the framework of healthcare services and their organization. Finally, we will see how DE can offer proposals and solutions to the challenges that a phenomenon as complex as public health currently faces. That is, we will measure up DE proposals against public health research needs.", "discussion_summary": "", "discussion_excerpt": "", "discussi eories from the Philosophy of Science to help reflect on the nature of design theory, concluding that research through design is likely to produce theories that are provisional, contingent, and aspirational. In the second part, I discuss three possible interpretations for the diversity of approaches to research through design, and suggest that this variation need not be seen as a sign of inadequate standards or a lack of cumulative progress in the field, but may be natural for a generative endeavour. In the final section, I suggest that, rather than aiming to develop increasingly comprehensive theories of design, practice based research might better view theory as annotation of realised design examples, and particularly portfolios of related pieces. Overall, I suggest that the design research community should be wary of impulses towards convergence and standardisation, and instead take pride in its aptitude for exploring and speculating, particularising and diversifying, and - especially - its ability to manifest the results in the form of new, conceptually rich artefacts.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2012", "venue": "Proceedings of the SIGCHI Conference on Human Factors in Computing Systems", "doi": "10.1145/2207676.2208538", "url": "https://doi.org/10.1145/2207676.2208538", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two fie ct numerous design theories with alternative solutions. It thereby offers a unique problem-solving approach that is particularly useful for addressing ill-structured or wicked problems. For each alternative solution in a design theory nexus one or more unique criteria are established to formulate a specific design theory. We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. One develops and applies an organizational change nexus. The other develops and applies a user involvement nexus. Each is a specific instantiation of the general design theory nexus constructs. Using these illustrations, we provide examples of how to evaluate such instantiations. We then discuss our findings as well as the validity of our approach. We conclude that the design theory nexus provides a viable conceptualization that enables the construction of effective problem-solving artifacts.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2008", "venue": "MIS Quarterly: Management Information Systems", "doi": "10.2307/25148870", "url": "", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. [E2]", "design_knowledge_form": "Design theory — C-K theory and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "con ntribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": "", "contribution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical interpretation", "application_domain_definitions": "Not applicable", "theory_move_key": "building", "theory_move": "Building New Theory", "theory_move_patterns": "proposes a new theory/framework (5); explicit theory building/development (2)", "theory_move_support": "5/17 papers; weighted score 30", "facet_population_or_context": "", "facet_stakeholder_or_population": "", "facet_method_or_lens": "", "facet_artifact_or_domain": "", "facet_contribution_or_outcome": "", "umap_x": 10.60265064239502, "umap_y": 12.407241821289062, "distance_to_centroid": 0.15043127536773682, "representative_rank": 16, "is_representative_top3": false, "medoid_rank": 16, "lda_topic": -1, "lda_topic_probability": 0.0, "lda_topic_words": "design | theory | information | design theory | service | theories | systems | instructional | learning | information systems | isdt | research | et al | principles | al", "nearest_papers": [{"paper_id": "92fd41483399", "title": "Design exemplars for synchronous e-learning: A design theory approach", "cluster": 2, "distance": 0.1927105188369751}, {"paper_id": "97b253588409", "title": "An information systems design theory for web-based education", "cluster": 2, "distance": 0.21185123920440674}, {"paper_id": "bf31dda38b9e", "title": "Instructional transaction theory: instructional design based on knowledge objects", "cluster": 2, "distance": 0.21207302808761597}, {"paper_id": "8107b8d7a099", "title": "Analyzing Initial Design Theory Components for Developing Information Security Laboratories", "cluster": 2, "distance": 0.22556495666503906}, {"paper_id": "c0372ed4d123", "title": "Web-based information systems: Developing a design theory", "cluster": 2, "distance": 0.22792065143585205}], "hdbscan_peripheral": false}, {"paper_id": "91ac41f73380", "title": "Knowing the Unknowable: Understanding and Measuring Design Impact Across Disciplines and Scale", "authors": "Ashreya M. Venkatesh; Arianne X. Collopy; G. Loo; K. Sng; Daniel D. Jensen; Kris Wood", "abstract": "According to Simon (1988) [1], design is “devis[ing] courses of action aimed at changing existing situations into preferred ones.” In this context, “Good Design” is, on the one hand, subject to the eye of the beholder (the art or craft), and, on the other hand, an indisputable outcome (the science). In either case, “Good Design” comes about through inter-disciplinary Design Innovation, and comprises the integration of people, process, methods, and principles (Camburn, et al., 2017; Tushar, et al., 2020; Sng, et al., 2017) [2-9]. Products, services, systems, or a combination are the result of good design, creating a transformative design impact on community, society, and people’s lives. Design impact can take several forms. Some of these may be quantitative, such as an increase in economic value after a rebranding campaign, improved sustainability, or a greater employee satisfaction after re-designing a workspace. Other forms of impact may be qualitative, such as increased positive sentiments, judgements in ethical sensitivities, and sense of well-being. In the end, Good Design emerges from the designers’ wellarticulated ethos, and creates a “Wow” through its impact. Taking our understanding and application of Design Impact to the next level, we worked with Singapore and the DesignSingapore (Dsg) Council [10] to explore, define and test design impact evaluation strategies as part of Singapore’s most prestigious national design award program, the President’s Design Award (P*DA; https://www.designsingapore.org/presidents-design-award) [11]. Through interviews with expert designers, a careful study of the design disciplines, and an understanding of design award programs across the world, the concept of a Design Impact framework was developed. This framework, as a unification of the concept of Design Impact across disciplines and scales, places emphasis on outcome-based design impact alongside recognition of excellence in design craftsmanship. Designers who bring together diverse skills and work collaboratively across disciplines to address complex issues are given significant recognition. This approach celebrates future-forward designs, designers and design processes that anticipate, envision and shape the world of tomorrow. 1 Sponsored by the DesignSingapore (Dsg) Council, as part of the President’s Design Award (P*DA). SUTD-MIT International Design Center (IDC) served as the official Knowledge Partner for the P*DA program. 2 SUTD-MIT International Design Center (IDC), Design Innovation (DI) Program, Singapore University of Technology and Design 3 Comcast Media and Technology Center (CMTC), College of Engineering, Design, and Computing, University of Colorado Denver 4 DesignSingapore (Dsg) Council, Singapore 5 McKinsey and Company, Singapore ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 2 As a tangible and extended idea of Design Impact, four Impact Areas were identified to constitute the framework, initially tested and utilized as part of the P*DA (Fig. 1): A. Enabling Economic Transformation B. Raising Quality of Life C. Advancing Brand, Culture and Community at Any Scale D. Making Ground-breaking Achievements in Design Figure 1. Design Impact Framework: Design Impact Areas (4), Outcomes (13), and DemonstratorsMetrics (57). Outcomes and demonstrators were developed to help define and assess each impact area. Examples include enhancing employee experience, enhancing living experience, empowering and facilitating positive user learning, increasing revenue, simplifying usage and increasing efficiency & effectiveness, increasing identity and bonds with community, and innovating processes and functionality. People are at the center of this understanding of Design Impact, and it is supported by a repeatable process to assess design impact across industry and government sectors. Using the Design Impact framework, we hypothesized that we may answer questions such as, “What could a hotel, a toolkit for non-profit organizations, and one of the largest 3D-printed structures have in common?” They are all examples of impactful designs, beautifully conceptualized and executed. The Design Impact framework considers different types of impact and shows that while certain types of “impact” can be quantified, we also now have other ways for measuring impact and widening its definition. To test the developed Design Impact framework, a submission portal was developed, through the DesignSingapore Council’s website, for designers and organizations, across disciplines and across project scales, to submit their designs as part of the Singapore President’s Design Award. Over a three-year ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 3 period, and across two cycles of submissions for the P*DA, hundreds of designs were submitted and juries of design experts shortlisted the submissions [12]. We then assessed the shortlisted designs using our developed Design Impact framework and assessment methodology, and reported Design Impact results back to the juries. Through these engagements, data were collected on all design submissions; coverage of the impact areas, outcomes and demonstrators; the level of impact of the submitted designs; and survey results of the members of the national award juries. These data were then analyzed across multiple factors, resulting in a number of insights about Design Impact and conclusions concerning the Design Impact framework. Overall, these insights and conclusions include: the Design Impact framework was effective and comprehensive in representing, understanding and measuring design impact; the Design Impact framework provided a basis and common language for discussing designs across disciplines and scale; and there is value in representing Design Impact for not only assessing designs, but for proactively planning impact in future designs. We believe that being able to do so will enable companies and designers to forecast project outcomes and drive teams more effectively. In this presentation, we motivate the need to investigate the area of Design Impact and develop a deeper understanding, representation, and method for measuring impact, across disciplines and scale. We then present our Design Impact framework and assessment methodology, along with our research methodology, data collection approach, results, analyses, and conclusions. Figure 2 provides exemplar research findings. Today design is at our fingertips, for all of us, for our organizations, and for our communities. We all can invest in learning and extending our skill sets in designerly ways. We can apply design and gaze through the lens of what constitutes good design and even design excellence, as we strive to make our lives and our world better. And ultimately we can know and embrace the unknowable – Design Impact, applying it in all facets of our government, business and private lives. This is our challenge as a world community; let’s proceed forth and realize it every moment of every day. In the words of Dr Jeffrey Chan (2018), “Today, design is increasingly harnessed in the creation of new environments within already existing artificial environments and systems. In doing this, humanity has evolved from being merely a biological actor to a geological agent – one that is equipped with an agency for creating successive layers of new design, which are rapidly accreting on prior layers of already existing artificial systems. Consequentially in the Anthroprocene, the focus has also shifted from the protection of the environment to the production of environments. And it is [through] the power of design that the Anthroprocene can be properly understood.” ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 4 Figure 2. Exemplar research findings: Design Impact Framework. References [1] Simon, H. A. (1988). The science of design: Creating the artificial. Design Issues, 67-82.. [2] Camburn, B. A., Auernhammer, J. M., Sng, K. H. E., Mignone, P. J., Arlitt, R. M., Perez, K. B., ..., & Wood, K. L. (2017, August). Design innovation: A study of integrated practice. In International Design Engineering Technical Conferences and Computers and Information in Engineering Conference (Vol. 58219, p. V007T06A031). American Society of Mechanical Engineers. [3] Tushar, W., Lan, L., Withanage, C., Sng, H. E. K., Yuen, C., Wood, K. L., & Saha, T. K. (2020). Exploiting design thinking to improve energy efficiency of buildings. Energy, 197, 117141. [4] Sng, K. H. E., Raviselvam, S., Anderson, D., ..., Camburn, B. A., & Wood, K. (2017). A design case study: Transferring design processes and prototyping principles into industry for rapid response and user impact. In DS 87-1 Proceedings of the 21st International Conference on Engineering Design (ICED 17) Vol 1: Resource Sensitive Design, Design Research Applications and Case Studies, Vancouver . Such a relational theory should mirror those currently developed in mathematics, physics, computer science, and even philosophy. We develop a relational theory for design based on the concept of affordances from perceptual psychology. Affordances help to explain the entanglement between designers, users, and artifacts—relationships that are not currently handled by function based approaches to design. Affordance based design, as developed in this paper, does not offer a radical new approach to doing design, but rather a shift in design thinking. Our focus in this paper is therefore on the explanatory power and potential innovation fostered by this change in design thinking, as illustrated through several examples, and not on specific methods.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Research in Engineering Design", "doi": "10.1007/s00163-008-0060-3", "url": "", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete. [E1] On the basis of these process knowledge types, we derive three theoretically grounded design principles for process guidance systems to support employees’ process execution. [E2]", "design_knowledge_form": "Design theory — Design process and Design science", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_k  "hdbscan_peripheral": false}, {"paper_id": "a47956c54fb0", "title": "Limits of intelligence in design", "authors": "Papamichael, K.; Protzen, J. P.", "abstract": "A new, comprehensive design theory is presented, applicable to all design domains such as engineering and industrial design, architecture, city and regional planning, and, in general, any goal-oriented activity that involves decision making. The design process is analyzed into fundamental activities that are characterized with respect to the nature of knowledge requirements and the degree to which they can be specified and delegated to others, in general, and to computers in particular. The characterization of design problems as ''wicked,'' or ''ill-defined,'' design has been understood as a rational activity, that is ''thinking before acting.'' The new theory presented in this paper suggests that design is ''thinking and feeling while acting,'' supporting the position that design is only partially rational. Intelligence, ''natural'' or ''artificial,'' is only one of two requirements for design, the other being emotions. Design decisions are only partially inferred, that is, they are not entirely the product of reasoning. Rather, design decisions are based on judgment that requires the notion of ''good'' and ''bad,'' which is attributed to feelings, rather than thoughts. The presentation of the design theory extends to the implications associated with the limits of intelligence in design, which, in turn, become constraints on the potential role of computers in design. Many of the current development efforts in computer-aided design violate these constraints, especially in the implementation of expert systems and multi-criterion evaluation models. These violations are identified and discussed in detail. Finally, specific areas for further research and development in computer-aided design are presented and discussed.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussio  other key terms. To this end, this paper provides an overview of definition, borrowing largely from philosophy, which includes a survey of the types and methods of definition and issues related to each. It will also explore methods and criteria by which one can evaluate various competing definitions. From this survey, I propose that designers use a stipulative and pragmatic approach to definition outlined by Edward Schiappa (2003). Schiappa's approach is useful because of these two key underlying assumptions: first, defining design (and related terms) is not a search for the record of past usage but an act to persuade others of how to use the word in the future, therefore the person defining must provide a compelling argument for why others' usage should be modified; second, defining design is not a search for the 'true' or 'real' meaning of a word but instead a goal-oriented process and, therefore, dependent on the context and purpose of those defining the word.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2010", "venue": "Proceedings of DRS", "doi": "", "url": "https://www.semanticscholar.org/paper/66340bc794b9f491a7459ed19271054c66ec0735", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studies. [E2]", "design_knowledge_form": "Design theory — C-K theory and Design research", "design_knowledge_action": "", "design_knowledge_role": " ledge commons for IT service management (ITSM) practitioners. To obtain guidance to design the knowledge commons, we critically reviewed commons design principles (DPs) that were based on a well-established economics theory. We observed that the commons DPs had significant gaps when applied to IS practice. Hence, we developed an alternate set of DPs that we refer to as platform-enabled knowledge commons (PEKC) DPs that are relevant to IS practice. This paper discusses the development of PEKC DPs and applies them in instantiating an IS artifact, Service-Symphony. Service-Symphony is a purpose-built, public-facing knowledge repository developed for the benefit of ITSM practitioners and students. Our research followed the design science research (DSR) paradigm and contributes to the body of knowledge by establishing a multigrounded design theory comprising meta-requirements and DPs. To bridge theory and practice, we assessed the reusability of PEKC DPs through focus group interviews with IS architects. Our case study illustrates the complete life cycle of DPs covering conceptualization, initial formulation, iterative refinement, application to an important real-world instantiation, and evaluation by a group of independent IS practitioners.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Journal of the AIS", "doi": "", "url": "https://www.semanticscholar.org/paper/3e67cd0d0c79603b5118e7a44b1153b4cd7553ad", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "design | theory | information | design theory | service | theories | systems | instructional | learning | information systems | isdt | research | et al | principles | al", "cluster_label_candidate": "Design theory — Information systems and Design principles", "distinguishing_evidence_terms": "Information systems, Design principles", "cluster_summary_candidate": "We further validate the propositions by analyzing t ents to the framework. Patents are a legally viable means for defending an invention, and therefore the patents must logically contain a description of the concept underlying the invention. For this small N study, we chose eight US patents that represent a broad spectrum of engineering systems and methods. The success of this mapping from patents to the proposed concept framework is a necessary condition to demonstrating the completeness and utility of the framework.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2018", "venue": "INCOSE International Symposium", "doi": "", "url": "https://www.semanticscholar.org/paper/b0d4e44dbdbc6000fbf69224ac21c0e3157313b7", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "design | theory | knowledge | systems | process | research | product | management | problem | health | model | concept | engineering | software | design theory", "cluster_label_candidate": "Design theory — Design process and Design science", "distinguishing_evidence_terms": "Design process, Design science", "cluster_summary_candidate": "The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete. [E1] On the basis of these process knowledge types, we derive three theoretically grounded design principles for process guidance systems to support employees’ process execution. [E2]", "design_knowledge_form": "Design theory — Design process and Design science", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least lem solving", "cluster": 0, "distance": 0.17505019903182983}, {"paper_id": "d250dc6eb9d9", "title": "Systems Thinking and Design Thinking: The Search for Principles in the World We Are Making", "cluster": 0, "distance": 0.18854081630706787}], "hdbscan_peripheral": false}, {"paper_id": "dbc7c9876d1a", "title": "The Creativity Passdown Effect: Sharing Design Thinking Processes with Design Theory", "authors": "J. S. Lee; R. Baskerville; J. Pries-Heje", "abstract": "Design theory lies at the heart of information systems design science research. One concern in this area is the potential to limit the designer's creativity by over-specifying the meta-design or the design process. This paper explains how design research encapsulates a two-person design team consisting of the design theorist and the artifact instance designer. Design theory embodies a creativity pass down effect in which the creative design thinking is partly executed by the design theorist and the completion of this thinking is deferred to the artifact instance designer. In fact, rather than limiting the instance designer's creativity, the design theorist may create an opportunity for the instance designer to be creative by passing down a design theory. Further, the artifact instance designer operates within the problem domain defined by design theorist, and engages in design thinking to achieve an innovative design by merging theoretical knowledge with experiential knowledge of a design artifact that is being built. The creativity pass down effect was examined through a case that involved developing a tool for multi-outsourcing decision making. The case provides empirical support for the creativity pass down effect.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2012", "venue": "", "doi": "10.1109/HICSS.2012.558", "url": "", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | d turity model", "authors": "X. Luo; Fang-Kai Chang", "abstract": "PurposeThe purpose of this study is to demonstrate that Strategic Enterprise Management (SEM) and Business Intelligence (BI) have the potential to integrate management decisions vertically through an organization’s hierarchy. This study also aims to present a design theory framework and build a model dimension using eight principles serving as mid-range theories.Design/methodology/approachThis study uses a design science perspective to posit how organizations can successfully implement SEMBI (a union of SEM and BI). This study then completes the design theory by building the method dimension using two principles. Finally, the study presents testable hypotheses for the theory and an evaluation using stakeholder attitudes and judgments as proxies for objective measures.FindingsIn the search for a prescription for SEMBI success, this study finds that the notion of the Capability Maturity Model (CMM) is a good artifact with which to organize the principles the authors are seeking. CMM has since been adapted to suit different contexts by incorporating relevant principles from those domains. Hereafter, this study refers to SEMBI–CMM as the adapted solution for SEMBI's success.Originality/valueThis study coins and uses the term SEMBI to represent the union of SEM and BI. This term retains its distinct identities and principles and forms a holistic and integrated view of SEM and BI implementation strategies. In an effort to advance this line of research, this study employs a design science perspective to address the question of how an organization can successfully implement SEMBI.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Journal of Electronic Business &amp; Digital Economics", "doi": "", "url": "https://www.semanticscholar.org/paper/fd5b0d221b29d73fcc3b280b0b40943ee25dd98b", "keyword": "Design theory", "cluster": e": "Four Criteria for Design Theories", "authors": "P. Hodges; Stan Ruecker; C. Scaletsky; Jaime Rivera; R. Faller; A. Geppert", "abstract": "Abstract The goal of this paper is to demonstrate that the adoption of the four criteria we outline will strengthen future design theories and encourage existing design theories to expand or reconfigure in useful directions. We propose four criteria for design theory creation and evaluation. These are (1) the theory should have substantial design applications, and be applicable to any topic; (2) the theory should use propositions—if-then language—as a way of describing, explaining, and predicting actual and existing aspects of designing; (3) where appropriate, a new theory should accept and adopt propositions and language contained in other design theories; and (4) the theory should accommodate, or at least acknowledge, generative activity. We are not proposing a new general design theory—this paper outlines a strong approach to studying and building theory. Please also note that this essay does not pretend to exhaust a topic that has been discussed for at least the last 50 years.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2017", "venue": "", "doi": "", "url": "https://www.semanticscholar.org/paper/4c0eb75439b4fdadc1743f7ff41d8e9adb2c7eb8", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "design | theory | theories | knowledge | design theory | research | theoretical | practice | sonification | game | al | et | et al | design theories | soniﬁcation", "cluster_label_candidate": "Design theory — C-K theory and Design research", "distinguishing_evidence_terms": "C-K theory, Design research", "cluster_summary_candidate": "In this paper we introduce the main notions and first applications of a unified design theory. [E1] We develop a general method for constructing a design theory nexus and illustrate its utility using two field studie lication_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluated in this statistical interpretation", "application_domain_definitions": "Not applicable", "theory_move": "Building New Theory", "theory_move_patterns": "proposes a new theory/framework (2); new theoretical constructs/propositions (1); explicit theory building/development (1)", "theory_move_support": "4/30 papers; weighted score 16", "source_evidence": [{"id": "E1", "paper_id": "2faef10b819d", "paper_title": "A design theory for software engineering", "sentences": "Many have argued that its theoretical basis has been slow to develop and that, in fact, a substantial theory of Software Engineering is still lacking.Objective: We propose a design theory for Software Engineering as a contribution to the debate. Having done this, we extend it to a design theory for socio-technical systems.Method: We elaborate our theory based on Gregors influential meta-theoretical exploration of the structural nature of a theory in the discipline of Information Systems, with particular attention to ontological and epistemological arguments.Results: We argue how, from an ontological perspective, our theory embodies a view of Software Engineering as the practice of framing, representing and transforming Software Engineering problems.", "paragraph_index": 0, "sentence_hash": "edb921fd8853", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design theory\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we argue\""]}}, {"id": "E2", "paper_id": "85c3a6761bcc", "paper_title": "Designing Process Guidance Systems", "sentences": "Inspired by research on spatial knowledge and navigation, we conceptualize three process knowledge types addressing the needs of employees during their process execution. On the basis of these process knowledge types, we derive three theoretically grounded design principles for process guidance systems to support employees’ process execution.", "paragraph_index": 0, "sentence_hash": "a36d949402a0", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 7.0, "first_person": 8.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design theory\"", "own-claim marker: \"we derive\"", "own-claim marker: \"we conceptualize\"", "action pattern (defines): \"we conceptualize\""]}}, {"id": "E3", "paper_id": "8bb42e8202f8", "paper_title": "A mathematical theory of design: modeling the design process (Part II)", "sentences": "This study presents a formal general design theory (FGDT), a mathematical theory of design. The concept of a generating set for the design solution space is also introduced, and its relation with the axiomatic model of the design process is explored.", "paragraph_index": 0, "sentence_hash": "025e10952b69", "score": 18.0, "score_breakdown": {"total": 18.0, "term_overlap": 10.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "phrase match: \"design theory\"", "own-claim marker: \"this study presents\"", "action pattern (translates): \"guidelines for\""]}}, {"id": "E4", "paper_id": "9f9f7295ec8c", "paper_title": "Affordance based design: a relational theory for design", "sentences": "After reviewing current approaches to design theory, which are based on the transformative concept of function, we argue that this basis in function limits the scope of design problems and explanatory power of current design theories. As an alternative with greater potential for explanatory power and a framework for solving a wider array of design problems, we propose that a relational theory of design is needed.", "paragraph_index": 0, "sentence_hash": "658d4f53e469", "score": 17.0, "score_breakdown": {"total": 17.0, "term_overlap": 7.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design theory\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we develop\"", "own-claim marker: \"we argue\""]}}, {"id": "E5", "paper_id": "c3005cf4cf75", "paper_title": "Design as interactions of problem framing and problem solving", "sentences": "We introduce a model of framing in design. We argue that the interpretation of design problems lacks a similar rigorous investigation as problem solving received in both design theory and methodology.", "paragraph_index": 0, "sentence_hash": "8f9872c2cb9c", "score": 17.0, "score_breakdown": {"total": 17.0, "term_overlap": 7.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design theory\"", "own-claim marker: \"we introduce\"", "own-claim marker: \"we argue\""]}}, {"id": "E6", "paper_id": "7624ada60ef5", "paper_title": "A systematic approach for the development of porous concrete based on axiomatic design theory", "sentences": "This paper presents a design framework developed using axiomatic design (AD) theory that can be applied in the design process of porous concrete. The advantage of the AD approach is that it systemizes the way to decouple design parameters and makes designers to think rationally between what we want to achieve and how we propose to satisfy the functional requirements of porous concrete.", "paragraph_index": 0, "sentence_hash": "7d8a62f2e12d", "score": 17.0, "score_breakdown": {"total": 17.0, "term_overlap": 6.0, "first_person": 8.0, "action": 2.0, "keyword": 1.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "own-claim marker: \"we propose\"", "own-claim marker: \"this paper presents\"", "action pattern (translates
