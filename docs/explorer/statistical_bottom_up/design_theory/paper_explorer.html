  <style>
    :root {
      --ink: #1f2a44;

      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;

      --accent: #256fbd;

    * { box-sizing: border-box; }
    body {

      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }

      align-items: center;
    }
    input, select, button {

      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }

      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }

    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }

      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }

    }

 a Review", "authors": "Sheffield, J. (1)", "abstract": "The purpose of this article is to review the role of simultaneous application of multiple perspectives, or pluralism, in knowledge management, and to describe theoretical frameworks that support pluralism. Pluralism is defined as support for all three of the systems perspectives - hard, soft, and critical - that are implicit in the popular Davenport and Prusak (1998) definition of knowledge. These perspectives are associated with research paradigms (positivist, interpretivist, pluralist) and knowledge perspectives (application, normalization, creation). A case study of coordinating work in a hospital is reviewed to illustrate the role played by pluralistic approaches in knowledge management. A literature search is conducted to find frameworks that support pluralism. The findings are as follow. In the hospital case study the introduction of a patient record system (hard system) was the occasion for changes to both coordination (soft systems) and power relations (critical systems). Facts, norms and feelings are intertwined. While the electronic tool by itself is neutral in the face of power relations, its use in organisations is not. In this case at least, a holistic and pluralistic approach to knowledge management is required. In the search for frameworks to support pluralism, more than 50 frameworks from the general knowledge management literature are identified. Of the eight selected for further study, three are found to be pluralistic. These three - critical systems, scientific discourses, and Habermasian inquiry - share common characteristics. All three recognise that conflict is the precondition to knowledge creation, and that power relations, value commitments, and ethics are central to knowledge management. It is concluded that the knowledge management literature as a whole favours a single systems perspective (hard systems); a single research paradigm (positivism, focusing on objective facts); and a single knowledge management domain (knowledge application). This singular (non-pluralistic) approach produces theories about knowledge that has already emerged. Yet the Davenport and Prusak (1998) definition of knowledge and the hospital case study include two other perspectives - soft systems and critical systems - that focus on the organizational and individual aspects of emergence, respectively. In practice, knowledge management must address the need to simultaneously solve technical problems, resolve interpersonal issues, and dissolve personal conflict. The contribution of the paper is the comparison of knowledge management frameworks on the basis of underlying system perspectives, and the identification, description, and application of some pluralistic frameworks. Each systems perspective constitutes a different discourse on the purposes served by knowledge management, and pluralisms are required to integrate them. Pluralisms constitute both a framework for inquiry in knowledge management and a design theory for collaborative technologies. The review is not exhaustive. It is beyond the scope of this paper to examine the link between the purposes served by knowledge management and the methodology required for development. The paper contributes to the literature that seeks to understand the complexity of knowledge management practice via 'awareness of the potential and the implications of the different discourses in the study of knowledge and knowledge management'.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Electronic Journal of Knowledge Management", "doi": "", "url": "", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_label_candidate": "DT-C03: management; service; learning sed to test or validate the contributing kernel theories. Second, the philosophical grounding of evaluation may inadvertently shift from functionally based measures of utility and efficiency, to evaluation based on the pragmatic fulfillment of multidimensional human actions as people encounter information systems, resulting in evaluation errors. Although design and evaluation from a single paradigm is not desirable, sufficient, or representative of design science research, multi-paradigm grounding of design and evaluation must be realized and used consciously by the research community if the design science approach is to remain a legitimate approach to knowledge creation. © IFIP International Federation for Information Processing 2010.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2010", "venue": "IFIP Advances in Information and Communication Technology", "doi": "10.1007/978-3-642-12113-5_2", "url": "", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "theoretical | practice | sonification | type | value | kernel | science | example | development | artifact | definition | understanding | constructs | space | structure", "cluster_label_candidate": "DT-C02: theoretical; practice; sonification", "distinguishing_evidence_terms": "theoretical | practice | sonification | type | value | kernel | science | example | development | artifact | definition | understanding | constructs | space | structure", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C02 is statistically distinguished by theoretical, practice, sonification. Additional contrastive terms include type, value, kernel, science, example. Representative papers include Theory construction in design research. Criteria, approaches, and methods.; Four Criteria for Design Theories. This is an analysis-frozen statistical interpretation, not a final editorial topic label.", "design_knowledge_form": "Des ning effective DPsOC. Our overarching proposition is that three components of digital platform architecture (core, interface, and complements) should collectively support the mix of the three distinct types of social interaction structures of online community (information sharing, collaboration, and collective action). We validate the initial propositions and generate additional insights by conducting an in-depth analysis of an European digital platform for elderly care assistance. We further validate the propositions by analyzing three widely used digital platforms, including Twitter, Wikipedia, and Liquidfeedback, and we derive additional propositions and insights that can guide DPsOC design. We discuss the implications of this research for research and practice.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2015", "venue": "Journal of Information and Technology", "doi": "", "url": "https://www.semanticscholar.org/paper/e0e64fb553b44ffc85c79f32f7fa53c7f7583af4", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_label_candidate": "DT-C03: management; service; learning", "distinguishing_evidence_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C03 is statistically distinguished by management, service, learning. Additional contrastive terms include social, support, theoretical, development, literature. Representative papers include Web-based information systems: Developing a design theory; Management design theories. This is an analysis-frozen statistical interpretation, not a final edi ], "hdbscan_peripheral": false}, {"paper_id": "2faef10b819d", "title": "A design theory for software engineering", "authors": "Jon G. Hall; L. Rapanotti", "abstract": "Context: Software Engineering is a discipline that has been shaped by over 50 years of practice. Many have argued that its theoretical basis has been slow to develop and that, in fact, a substantial theory of Software Engineering is still lacking.Objective: We propose a design theory for Software Engineering as a contribution to the debate. Having done this, we extend it to a design theory for socio-technical systems.Method: We elaborate our theory based on Gregors influential meta-theoretical exploration of the structural nature of a theory in the discipline of Information Systems, with particular attention to ontological and epistemological arguments.Results: We argue how, from an ontological perspective, our theory embodies a view of Software Engineering as the practice of framing, representing and transforming Software Engineering problems. As such, theory statements concern the characterisation of individual problems and how problems relate and transform to other problems as part of an iterative, potentially backtracking, problem solving process, accounting for the way Software Engineering transforms the physical world to meet a recognised need. From an epistemological perspective, we argue how the theory has developed through research cycles including both theory-then-(empirical-)research and (empirical-)research-then-theory strategies spanning over a decade; both theoretical statements and related empirical evidence are included.Conclusion: The resulting theory provides descriptions and explanations for many phenomena observed in Software Engineering and in the combination of software with other technologies, and embodies analytic, explanatory and predictive properties. There are however acknowledged limitations and current research to overcome them is outlined.", "discussion_summary": "", "dis design theory based on several uncontroversial aspects of human cognitive architecture. Our knowledge of many of the characteristics of working memory, long-term memory and the relations between them had been well-established for many decades prior to the introduction of the theory. Curiously, this knowledge had had a limited impact on the field of instructional design with most instructional design recommendations proceeding as though working memory and long-term memory did not exist. In contrast, cognitive load theory emphasised that all novel information first is processed by a capacity and duration limited working memory and then stored in an unlimited long-term memory for later use. Once information is stored in long-term memory, the capacity and duration limits of working memory disappear transforming our ability to function. By the late 1990s, sufficient data had been collected using the theory to warrant an extended analysis resulting in the publication of Sweller et al. (Educational Psychology Review, 10, 251–296, 1998). Extensive further theoretical and empirical work have been carried out since that time and this paper is an attempt to summarise the last 20 years of cognitive load theory and to sketch directions for future research.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2019", "venue": "Educational Psychology Review", "doi": "", "url": "https://www.semanticscholar.org/paper/e28d73214751d51c3f46a867920be41c49c45130", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "product | cognitive | impact | load | cognitive load | human | technology | science | understanding | designers | function | conceptual | engineering | methodology | theoretical", "cluster_label_candidate": "DT-C01: product; cognitive; impact", "distinguishing_evidence_terms": "product | cognitive | impact | load | cognitive load | human | technology | science | understanding | designers | funct irst shows the main features of abduction and pragmatism, describes their evolution and considers their mutual implications. Second, the epistemology of design is analysed considering its most relevant characteristics. Third, the connection between abduction and, on the one hand, pragmatism and, on the other, design epistemology is addressed. Finally, the role of abductive inference in grounding a real epistemology for design theory from the naturalised cognitive perspective of abduction is outlined. The central proposition is that this approach is essential as a methodological innovation, as it allows us to analyse both the inquiry process and the design process as interdependent when dealing with practical problems of a social and cultural nature. This approach allows us to analyse how human actions determine changes in the theoretical framework from which we make our inquiry. In short, the world is an open-ended project that humans design through our daily inquiry.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Philosophies", "doi": "", "url": "https://www.semanticscholar.org/paper/7e135cc8cc3f2977f008136b33bf88e38576edcc", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "product | cognitive | impact | load | cognitive load | human | technology | science | understanding | designers | function | conceptual | engineering | methodology | theoretical", "cluster_label_candidate": "DT-C01: product; cognitive; impact", "distinguishing_evidence_terms": "product | cognitive | impact | load | cognitive load | human | technology | science | understanding | designers | function | conceptual | engineering | methodology | theoretical", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C01 is statistically distinguished by product, cognitive, impact. Additional contrastive terms include load, cognitive load, human, technology, science. Represen Dadgar; K. D. Joshi", "abstract": "Increasing number of older population and patients with chronic diseases, demand a new healthcare model in which patients take more responsibility in their disease management and actively collaborate with their health professionals, known as self-management (SM). SM is defined as a patient's ability to manage the symptoms, treatment, physical and psychosocial consequences, and life style changes that are germane to living with a chronic disease. The use of ICTenabled SM systems have shown promising benefits for the patients with chronic diseases. However it is not clear in the literature if the human values important to the patients are implicated in the SM systems. In this paper, building on Value-Sensitive Design (VSD) perspective and Information Systems Design Theory (ISDT), we have conducted a literature review and analysis to uncover SM human values, to explicate the extent to which those values are implicated in the SM systems, and to illustrate the ways values can be supported in the SM systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2015", "venue": "", "doi": "10.1109/HICSS.2015.388", "url": "", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_label_candidate": "DT-C03: management; service; learning", "distinguishing_evidence_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C03 is statistically distinguished by management, service, learning. Additional contrastive terms include social, support, theoretical, development, literature. Rep gn, creating a transformative design impact on community, society, and people’s lives. Design impact can take several forms. Some of these may be quantitative, such as an increase in economic value after a rebranding campaign, improved sustainability, or a greater employee satisfaction after re-designing a workspace. Other forms of impact may be qualitative, such as increased positive sentiments, judgements in ethical sensitivities, and sense of well-being. In the end, Good Design emerges from the designers’ wellarticulated ethos, and creates a “Wow” through its impact. Taking our understanding and application of Design Impact to the next level, we worked with Singapore and the DesignSingapore (Dsg) Council [10] to explore, define and test design impact evaluation strategies as part of Singapore’s most prestigious national design award program, the President’s Design Award (P*DA; https://www.designsingapore.org/presidents-design-award) [11]. Through interviews with expert designers, a careful study of the design disciplines, and an understanding of design award programs across the world, the concept of a Design Impact framework was developed. This framework, as a unification of the concept of Design Impact across disciplines and scales, places emphasis on outcome-based design impact alongside recognition of excellence in design craftsmanship. Designers who bring together diverse skills and work collaboratively across disciplines to address complex issues are given significant recognition. This approach celebrates future-forward designs, designers and design processes that anticipate, envision and shape the world of tomorrow. 1 Sponsored by the DesignSingapore (Dsg) Council, as part of the President’s Design Award (P*DA). SUTD-MIT International Design Center (IDC) served as the official Knowledge Partner for the P*DA program. 2 SUTD-MIT International Design Center (IDC), Design Innovation (DI) Program, Singapore University of Technology and Design 3 Comcast Media and Technology Center (CMTC), College of Engineering, Design, and Computing, University of Colorado Denver 4 DesignSingapore (Dsg) Council, Singapore 5 McKinsey and Company, Singapore ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 2 As a tangible and extended idea of Design Impact, four Impact Areas were identified to constitute the framework, initially tested and utilized as part of the P*DA (Fig. 1): A. Enabling Economic Transformation B. Raising Quality of Life C. Advancing Brand, Culture and Community at Any Scale D. Making Ground-breaking Achievements in Design Figure 1. Design Impact Framework: Design Impact Areas (4), Outcomes (13), and DemonstratorsMetrics (57). Outcomes and demonstrators were developed to help define and assess each impact area. Examples include enhancing employee experience, enhancing living experience, empowering and facilitating positive user learning, increasing revenue, simplifying usage and increasing efficiency & effectiveness, increasing identity and bonds with community, and innovating processes and functionality. People are at the center of this understanding of Design Impact, and it is supported by a repeatable process to assess design impact across industry and government sectors. Using the Design Impact framework, we hypothesized that we may answer questions such as, “What could a hotel, a toolkit for non-profit organizations, and one of the largest 3D-printed structures have in common?” They are all examples of impactful designs, beautifully conceptualized and executed. The Design Impact framework considers different types of impact and shows that while certain types of “impact” can be quantified, we also now have other ways for measuring impact and widening its definition. To test the developed Design Impact framework, a submission portal was developed, through the DesignSingapore Council’s website, for designers and organizations, across disciplines and across project scales, to submit their designs as part of the Singapore President’s Design Award. Over a three-year ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 3 period, and across two cycles of submissions for the P*DA, hundreds of designs were submitted and juries of design experts shortlisted the submissions [12]. We then assessed the shortlisted designs using our developed Design Impact framework and assessment methodology, and reported Design Impact results back to the juries. Through these engagements, data were collected on all design submissions; coverage of the impact areas, outcomes and demonstrators; the level of impact of the submitted designs; and survey results of the members of the national award juries. These data were then analyzed across multiple factors, resulting in a number of insights about Design Impact and conclusions concerning the Design Impact framework. Overall, these insights and conclusions include: the Design Impact framework was effective and comprehensive in representing, understanding and measuring design impact; the Design Impact framework provided a basis and common language for discussing designs across disciplines and scale; and there is value in representing Design Impact for not only assessing designs, but for proactively planning impact in future designs. We believe that being able to do so will enable companies and designers to forecast project outcomes and drive teams more effectively. In this presentation, we motivate the need to investigate the area of Design Impact and develop a deeper understanding, representation, and method for measuring impact, across disciplines and scale. We then present our Design Impact framework and assessment methodology, along with our research methodology, data collection approach, results, analyses, and conclusions. Figure 2 provides exemplar research findings. Today design is at our fingertips, for all of us, for our organizations, and for our communities. We all can invest in learning and extending our skill sets in designerly ways. We can apply design and gaze through the lens of what constitutes good design and even design excellence, as we strive to make our lives and our world better. And ultimately we can know and embrace the unknowable – Design Impact, applying it in all facets of our government, business and private lives. This is our challenge as a world community; let’s proceed forth and realize it every moment of every day. In the words of Dr Jeffrey Chan (2018), “Today, design is increasingly harnessed in the creation of new environments within already existing artificial environments and systems. In doing this, humanity has evolved from being merely a biological actor to a geological agent – one that is equipped with an agency for creating successive layers of new design, which are rapidly accreting on prior layers of already existing artificial systems. Consequentially in the Anthroprocene, the focus has also shifted from the protection of the environment to the production of environments. And it is [through] the power of design that the Anthroprocene can be properly understood.” ASME International Design Engineering Technical Conference, Design Theory and Methodology (DTM) Conference, Presentation and Extended Abstract, 52944, August 2020. 4 Figure 2. Exemplar research findings: Design Impact Framework. References [1] Simon, H. A. (1988). The science of design: Creating the artificial. Design Issues, 67-82.. [2] Camburn, B. A., Auernhammer, J. M., Sng, K. H. E., Mignone, P. J., Arlitt, R. M., Perez, K. B., ..., & Wood, K. L. (2017, August). Design innovation: A study of integrated practice. In International Design Engineering Technical Conferences and Computers and Information in Engineering Conference (Vol. 58219, p. V007T06A031). American Society of Mechanical Engineers. [3] 49c4d2bbec", "title": "Towards a design theory of blended learning curriculum", "cluster": 2, "distance": 0.1927105188369751}], "hdbscan_peripheral": false}, {"paper_id": "9f9f7295ec8c", "title": "Affordance based design: a relational theory for design", "authors": "Maier, J. (1); Fadel, G. (1)", "abstract": "After reviewing current approaches to design theory, which are based on the transformative concept of function, we argue that this basis in function limits the scope of design problems and explanatory power of current design theories. As an alternative with greater potential for explanatory power and a framework for solving a wider array of design problems, we propose that a relational theory of design is needed. Such a relational theory should mirror those currently developed in mathematics, physics, computer science, and even philosophy. We develop a relational theory for design based on the concept of affordances from perceptual psychology. Affordances help to explain the entanglement between designers, users, and artifacts—relationships that are not currently handled by function based approaches to design. Affordance based design, as developed in this paper, does not offer a radical new approach to doing design, but rather a shift in design thinking. Our focus in this paper is therefore on the explanatory power and potential innovation fostered by this change in design thinking, as illustrated through several examples, and not on specific methods.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Research in Engineering Design", "doi": "10.1007/s00163-008-0060-3", "url": "", "keyword": "Design theory", "cluster": 0, "cluster_theme_terms": "product | cognitive | impact | load | cognitive load | human | technology | science | understanding | designers | function | conceptual | engineering | methodology | theoretical", "cluster_label_candidate": "DT-C01: product; cognitive; i s, along with a drive to ensure data security and streamline workflows. Many employees perceive such practices as a breach of privacy, signifying employer distrust. The framework predicts that surveillance creates varying degrees of contextual integrity violation based on job autonomy: high-autonomy knowledge workers experience severe violations through trust erosion, procedural injustice, and temporal autonomy loss, while low-autonomy workers evaluate surveillance primarily through fairness criteria. This paper addresses a critical gap in existing research, which has focused on low-autonomy roles. By examining which roles are most impacted by digital surveillance, this paper seeks to highlight transparency and autonomy-sensitive policies to maximize the associated benefits of digital surveillance, while calling attention to employee well-being, trust, and organizational performance.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2026", "venue": "Businesses", "doi": "", "url": "https://www.semanticscholar.org/paper/dcae6e93cb73b5532913f20f88311ba7d2aabcc4", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_label_candidate": "DT-C03: management; service; learning", "distinguishing_evidence_terms": "management | service | learning | social | support | theoretical | development | literature | evaluation | practice | analysis | gregor | practitioners | empirical | digital", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C03 is statistically distinguished by management, service, learning. Additional contrastive terms include social, support, theoretical, development, literature. Representative papers include Web-based information systems: Developing a design theory; Mana : first, defining design (and related terms) is not a search for the record of past usage but an act to persuade others of how to use the word in the future, therefore the person defining must provide a compelling argument for why others' usage should be modified; second, defining design is not a search for the 'true' or 'real' meaning of a word but instead a goal-oriented process and, therefore, dependent on the context and purpose of those defining the word.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2010", "venue": "Proceedings of DRS", "doi": "", "url": "https://www.semanticscholar.org/paper/66340bc794b9f491a7459ed19271054c66ec0735", "keyword": "Design theory", "cluster": 1, "cluster_theme_terms": "theoretical | practice | sonification | type | value | kernel | science | example | development | artifact | definition | understanding | constructs | space | structure", "cluster_label_candidate": "DT-C02: theoretical; practice; sonification", "distinguishing_evidence_terms": "theoretical | practice | sonification | type | value | kernel | science | example | development | artifact | definition | understanding | constructs | space | structure", "cluster_summary_candidate": "Within the predefined Design theory group, DT-C02 is statistically distinguished by theoretical, practice, sonification. Additional contrastive terms include type, value, kernel, science, example. Representative papers include Theory construction in design research. Criteria, approaches, and methods.; Four Criteria for Design Theories. This is an analysis-frozen statistical interpretation, not a final editorial topic label.", "design_knowledge_form": "Design theory", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Statistical bottom-up interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "",  this study is to demonstrate that Strategic Enterprise Management (SEM) and Business Intelligence (BI) have the potential to integrate management decisions vertically through an organization’s hierarchy. This study also aims to present a design theory framework and build a model dimension using eight principles serving as mid-range theories.Design/methodology/approachThis study uses a design science perspective to posit how organizations can successfully implement SEMBI (a union of SEM and BI). This study then completes the design theory by building the method dimension using two principles. Finally, the study presents testable hypotheses for the theory and an evaluation using stakeholder attitudes and judgments as proxies for objective measures.FindingsIn the search for a prescription for SEMBI success, this study finds that the notion of the Capability Maturity Model (CMM) is a good artifact with which to organize the principles the authors are seeking. CMM has since been adapted to suit different contexts by incorporating relevant principles from those domains. Hereafter, this study refers to SEMBI–CMM as the adapted solution for SEMBI's success.Originality/valueThis study coins and uses the term SEMBI to represent the union of SEM and BI. This term retains its distinct identities and principles and forms a holistic and integrated view of SEM and BI implementation strategies. In an effort to advance this line of research, this study employs a design science perspective to address the question of how an organization can successfully implement SEMBI.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2023", "venue": "Journal of Electronic Business &amp; Digital Economics", "doi": "", "url": "https://www.semanticscholar.org/paper/fd5b0d221b29d73fcc3b280b0b40943ee25dd98b", "keyword": "Design theory", "cluster": 2, "cluster_theme_terms": "management | service | learning | social | support | theor   <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${c}`;
    const clusterLegendLabel = c => {
      const label = String(c.label || c.theme || '').trim();
      if (!label) return clusterName(c.cluster);
      return /^Cluster\s+-?\d+:/i.test(label) ? label : `${clusterName(c.cluster)}: ${label}`;
    };
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        const stableId = String(c.label || '').split(':')[0].trim(); opt.textContent = `${stableId || clusterName(c.cluster)} (${c.count})`;
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Statistical bottom-up interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Cluster Descriptor</div>
          <div class="abstract">${escapeHtml(p.cluster_label_candidate)}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Distinguishing Evidence</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Statistical Bottom-Up Cluster Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Interpretation Method &amp; Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Primary: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}
            <span class="pill">Primary domain: ${escapeHtml(p.primary_application_domain || p.application_domains || 'n/a')}</span>
            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Contribution support: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>
          <div class="meta">Subtype support: ${escapeHtml(p.contribution_subtype_support || 'n/a')}</div>
          <div class="meta">Contribution patterns: ${escapeHtml(p.contribution_type_patterns || 'n/a')}</div>
          <div class="meta">Domain support: ${escapeHtml(p.application_domain_support || 'n/a')}</div>
          <div class="meta">Domain definition: ${escapeHtml(p.application_domain_definitions || 'n/a')}</div>
          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Path 1 Theory Move</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <div class="insight-card">
          <div class="section-title">Pipeline Context</div>
          <div class="pill-row">
            <span class="pill">Context/Domain: ${escapeHtml(p.facet_population_or_context || 'n/a')}</span>
            <span class="pill">Population/Stakeholder: ${escapeHtml(p.facet_stakeholder_or_population || 'n/a')}</span>
            <span class="pill">Method/Lens: ${escapeHtml(p.facet_method_or_lens || 'n/a')}</span>
            <span class="pill">Artifact/System: ${escapeHtml(p.facet_artifact_or_domain || 'n/a')}</span>
            <span class="pill">Contribution Type: ${escapeHtml(p.facet_contribution_or_outcome || 'n/a')}</span>
          </div>
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
