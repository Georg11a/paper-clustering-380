<html lang="en">

  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;

      --accent: #256fbd;

      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);

    * { box-sizing: border-box; }
    body {

      background: var(--bg);

    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }

      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }

    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }

      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }

d and encompassing of diverse phenomena, making it difficult to quantify. We suggest improving such a situation by introducing a definition of empathy based on psychology literature, which provides structure and guidance for studying the role of empathy in design. We first break empathy to components. Then, we review empathy as used in design. Finally, we synthetize the reviewed material. From this synthesis, we conclude that empathy in design shares several key components of empathy in psychology; particularly with state influences, top-down control process and emotional stimuli. These are present in design methods although they have not been studied using such terms. Incorporating psychological components of empathy into design can help conceptualising empathy from a different angle, thus opening interesting new avenues for future research. We hope that our treatment provides present and future designers with some useful guidance.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "", "venue": "Design Science", "doi": "10.1017/dsj.2022.13", "url": "", "keyword": "Design methods", "cluster": 1, "cluster_theme_terms": "design | methods | human | empathy | ll | children | autobiographical | autobiographical design | users | embodied | user | method | ai | designers | role playing", "cluster_label_candidate": "Design methods — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "Subsequently, we described the extracted key know-how as 'patterns' by using the pattern language framework, and we developed a booklet listing the 30 patterns in an easy-to-reuse manner. [E1] Embodied, co-design and children-specific methods have been gaining traction in Interaction Design for Children, and their potential and benefits are well-established. [E2]", "design_knowledge_form": "Design methods — Design process and Design research", perts. Secondly, we develop a method for gamification design, based on the gathered knowledge. Finally, we conduct an evaluation of the method via interviews of 10 gamification experts. The results indicate that the developed method is comprehensive, complete and provides practical utility. We deliver a comprehensive overview of gamification guidelines and shed novel insights into the overall nature of the gamification development and design discourse. © 2017 Proceedings of the Annual Hawaii International Conference on System Sciences. All rights reserved.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2017", "venue": "Proceedings of the Annual Hawaii International Conference on System Sciences", "doi": "", "url": "", "keyword": "Design methods", "cluster": 0, "cluster_theme_terms": "design | methods | method | design methods | knowledge | value | research | gamification | visualization | use | process | commissioning | systemic | business models | business", "cluster_label_candidate": "Design methods — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "First, we propose a ‘chain of evidence’, from motivation to claims, operationalising this in a systematic assessment framework. [E1] In this conceptual paper, we argue that there is a need for 'method corroboration'-the deliberate and reflected use and possible validation of a design method. [E3]", "design_knowledge_form": "Design methods — Design process and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "" ": 0, "distance": 0.22514575719833374}], "hdbscan_peripheral": false}, {"paper_id": "87713959435f", "title": "Know-about, Know-that, Know-how: A Model for Moving Between Theory and Design Practice", "authors": "Ballard, Stephanie (1)", "abstract": "Everything is designed. From the fork you hold in your hand, to the car you drive, to the public transportation you use, to the mechanisms for justice within a society, to the process of designing itself. Embedded in these designs are the assumptions that underlie the design methods and toolkits used in the design process. In practice, design happens through the application of methods (processes that result in design outcomes), toolkits (materials that support the implementation of methods), and heuristics (the skillful application of methods and toolkits) (Friedman & Hendry, 2019; Hendry, Friedman & Ballard, 2021; Nelson & Stolterman, 2012). Methods and toolkits originate within particular worldviews (Ansari, 2019) and carry with them the assumptions of those worldviews. For example, journey maps, a design method that originated and is used in industry, assume linear time and often ignore the material aspects of the experience at hand. Conversely, traditional methods for making coconut milk developed in Papua New Guinea, outside the dominant Western interpretations of time, allow for spending time together but take longer to enact (Wajcman, 2015). But there are always different ways of doing things, different worldviews, and different assumptions to bring to bear in a design situation. Designers can bring those different assumptions into a design situation by adapting design methods to account for new theoretical constructs. But in what ways does theory inform design methods and toolkits? How can this relationship be modeled? Can a model of the relationship between theory and design methods and toolkits be used to help translate specific theoretical constructs into established design methods and toolkits? If so, then could this model and the associated skills be taught to novice designers as they adapt design methods?In this dissertation, to gain traction on these questions, I begin by developing a bi-directional model of knowledge types – know-about, know-that, know-how – in design to describe how theory informs design practice and vice versa. While the model of knowledge types in design is bi-directional, to contain the scope of this dissertation I focus the remaining work on only one direction: from theory to practice. To demonstrate how the model of knowledge types in design could be used to guide the adaptation of design methods, I apply it to eight theoretical constructs (four about materiality and four about temporality) to translate theory-to-practice commitments for each construct and then use those commitments to adapt one established method, journey maps, and one established toolkit, Envisioning Cards. Then, I report on a brief educational case study, demonstrating how novice designers can use the model to adapt established design methods. Then, drawing on the above, I offer heuristics to guide others as they adapt design methods and toolkits. Finally, I reflect on the work of adapting design methods and toolkits as a design process and the flexibility of design methods and toolkits as a lever for incorporating theoretical constructs into design practice. This dissertation makes the following contributions: 1) a bi-directional model of knowledge types in design to describe how theory can inform design practice and vice versa; 2) one adapted design method; 3) one adapted design toolkit; 4) an educational case study exploring the use of the model of knowledge types in design as a tool for teaching method adaptation; and 5) heuristics that novice designers, design researchers, and practitioners can use to adapt other design methods and toolkits. ProQuest Subject Headings: Information science, Design, Computer science, Information technology. © Citation reproduced with permi  purposes”. Here, I extend and examine this duality paying close attention to the methods used in these two professional practices. I argue that ‘the same’ techniques, tools, and methods are used by individuals when they engage in design activity and when they ‘change hats’ to engage in research activity. Whilst it is certainly true that individuals integrate and blend these activities within the same project, I make the argument that how they use these methods can be clearly distinguished by the purposes for which they use them. Individuals who are in the position to execute roles as different as designers and researchers are ‘ambidextrous’ and they cultivate creative synergies between these worlds. However, switching membership between such different communities is not without its challenges (Gold, 2007). The paper addresses the opportunities, risks, and ethical tensions that come from ‘changing hats’ and it draws from earlier work on the creative adaptation of design methods for crossdisciplinary research (Sosa & Grocott, 2020). The paper concludes with recommendations and generative questions for those who embark on the advanced practices of design and research.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2020", "venue": "", "doi": "", "url": "https://www.semanticscholar.org/paper/3c1e79eab204a59ccd27f91f5c60a8bc77fd660a", "keyword": "Design methods", "cluster": 0, "cluster_theme_terms": "design | methods | method | design methods | knowledge | value | research | gamification | visualization | use | process | commissioning | systemic | business models | business", "cluster_label_candidate": "Design methods — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "First, we propose a ‘chain of evidence’, from motivation to claims, operationalising this in a systematic assessment framework. [E1] In this conce e analysis of what constitutes engineering knowledge (what rock engineers know and how they know it) should always precede the integration of new technologies into empirical disciplines such as rock engineering. We propose a new conceptual model of engineering knowledge that combines experience (practical knowledge) and a priori knowledge (knowledge that is not based on experience). Our arguments are not a critique of actual engineering systems, but rather a critique of the (subjective) reasons that are invoked when using those systems, or to defend conclusions achieved using those systems. Our analysis identifies that rock engineering knowledge is shaped by cognitive biases, which over the years have created a sort of dogmatic barrier to innovation. It therefore becomes vital to initiate a discussion on the subject of engineering knowledge that can explain the challenges we face in rock engineering design at a time when digitalisation includes the introduction of machine algorithms that are supposed to learn from conditions of limited information.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2022", "venue": "Géosciences", "doi": "", "url": "https://www.semanticscholar.org/paper/96c627da585dc9846308a76414e6afb8c16122f3", "keyword": "Design methods", "cluster": 2, "cluster_theme_terms": "design | theory | knowledge | methods | rock | architecture | complexity | engineering | research | systems | rock engineering | design theory | building | interactive | process", "cluster_label_candidate": "Design methods — Design process and Design theory", "distinguishing_evidence_terms": "Design process, Design theory", "cluster_summary_candidate": "Our findings identify a broader range than previously described, additional sources and heuristics supporting their development as well some important evaluation criteria. [E1] This paper presents a survey on complexity theory inclusive of work from the disc ience. Therefore, to support LL practitioners, it is essential to extract key knowhow on how to achieve successful LL projects from experienced practitioners, and to describe such knowhow. This would allow us to share and reuse knowhow in planning and running an LL project. Hence, the purpose of this study is to extract such key knowhow for LL practice and describe it in an easy-to-reuse manner. We first developed a workshop to extract key know-how for LL practice. In this study, we held the workshop twice and could extract 30 items of key know-how. Subsequently, we described the extracted key know-how as 'patterns' by using the pattern language framework, and we developed a booklet listing the 30 patterns in an easy-to-reuse manner. The booklet can be used by LL practitioners to refer to and reuse the key know-how for LL practice. Through an evaluation, we confirmed that the developed booklet is useful for LL practitioners for referring to and using LL know-how. © 2020, Fuji Technology Press. All rights reserved.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2020", "venue": "International Journal of Automation Technology", "doi": "10.20965/ijat.2020.p0769", "url": "", "keyword": "Design methods", "cluster": 1, "cluster_theme_terms": "design | methods | human | empathy | ll | children | autobiographical | autobiographical design | users | embodied | user | method | ai | designers | role playing", "cluster_label_candidate": "Design methods — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "Subsequently, we described the extracted key know-how as 'patterns' by using the pattern language framework, and we developed a booklet listing the 30 patterns in an easy-to-reuse manner. [E1] Embodied, co-design and children-specific methods have been gaining traction in Interaction Design for Children, and their potenti ation design models commonly used in the field of data visualization. In summary, the design activity framework breaks down the visualization design process into a series of four design activities: understand, ideate, make, and deploy. For each activity, the framework prescribes a descriptive motivation, list of design methods, and expected visualization artifacts.To elucidate the framework, two case studies for visualization design illustrate these concepts, methods, and artifacts in real-world projects in the field of cybersecurity. For example, these projects employ user-centered design methods, such as personas and data sketches, which emphasize our teams' motivations and visualization artifacts with respect to the design activity framework. These case studies also serve as examples for novice visualization designers, and we hypothesized that the framework could serve as a pedagogical tool for teaching and guiding novices through their own design process to create a visualization tool.To externally evaluate the efficacy of this framework, we created worksheets for each design activity, outlining a series of concrete, tangible steps for novices. In order to validate the design worksheets, we conducted 13 student observations over the course of two months, received 32 online survey responses, and performed a qualitative analysis of 11 in-depth interviews. Students found the worksheets both useful and effective for framing the visualization design process. Next, by applying the design activity framework to technique-driven and evaluation-based research projects, we brainstormed possible extensions to the design model. Lastly, we examined implications of the design activity framework and present future work in this space. The visualization community is challenged to consider how to more effectively describe, capture, and communicate the complex, iterative nature of data visualization design throughout research, design, development, and deployment of visualization systems and tools. ProQuest Subject Headings: Computer science, Design. © Citation reproduced with permission of ProQuest LLC.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2017", "venue": "ProQuest Dissertations and Theses Global", "doi": "", "url": "", "keyword": "Design methods", "cluster": 0, "cluster_theme_terms": "design | methods | method | design methods | knowledge | value | research | gamification | visualization | use | process | commissioning | systemic | business models | business", "cluster_label_candidate": "Design methods — Design process and Design research", "distinguishing_evidence_terms": "Design process, Design research", "cluster_summary_candidate": "First, we propose a ‘chain of evidence’, from motivation to claims, operationalising this in a systematic assessment framework. [E1] In this conceptual paper, we argue that there is a need for 'method corroboration'-the deliberate and reflected use and possible validation of a design method. [E3]", "design_knowledge_form": "Design methods — Design process and Design research", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Provisional interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Assignment frozen; interpretation requires confirmation by at least two reviewers", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive phrase label with source-grounded extractive summary.", "contribution_summary_fields": "", "contribution_summary_template": "", "application_domains": "", "primary_application_domain": "Not assigned by Path 1", "additional_application_domains": "", "application_domain_patterns": "", "application_domain_support": "Not evaluat ing, reflecting, inquiring, and facilitating.", "paragraph_index": 0, "sentence_hash": "276f943e86f6", "score": 15.0, "score_breakdown": {"total": 15.0, "term_overlap": 5.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design methods\"", "own-claim marker: \"we propose\"", "own-claim marker: \"this paper presents\""]}}, {"id": "E5", "paper_id": "5661de15ea0f", "paper_title": "A Typology of Design Ideas", "sentences": "Design ideas are commonly used as an indicator of success of design methods and processes. This paper presents an examination of design idea definitions based on a thorough study of 75 research contributions.", "paragraph_index": 0, "sentence_hash": "6e82efbd7ebf", "score": 14.0, "score_breakdown": {"total": 14.0, "term_overlap": 6.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "phrase match: \"design methods\"", "own-claim marker: \"this paper presents\"", "action pattern (organizes): \"a typology of\""]}}, {"id": "E6", "paper_id": "bee7b59885fa", "paper_title": "Adapting the FBS Model of Designing for Usage-Driven Innovation Processes", "sentences": "We present a short practical case study to illustrate the relevance of these concepts. Our findings join those of others who have investigated the use of FBS to illustrate innovative projects, where requirements are unclear.", "paragraph_index": 0, "sentence_hash": "77b058c0fd6b", "score": 14.0, "score_breakdown": {"total": 14.0, "term_overlap": 4.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design methods\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we present\"", "own-claim marker: \"our findings\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "Elements of a design method "Patterns for living lab practice: describing key know-how to promote service co-creation with users", "sentences": "Living Lab (LL) is a co-creative service design methodology in which designers and users collaboratively design services. Subsequently, we described the extracted key know-how as 'patterns' by using the pattern language framework, and we developed a booklet listing the 30 patterns in an easy-to-reuse manner.", "paragraph_index": 0, "sentence_hash": "fa664bd66a74", "score": 17.0, "score_breakdown": {"total": 17.0, "term_overlap": 7.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "phrase match: \"design methods\"", "own-claim marker: \"we develop\"", "own-claim marker: \"we describe\""]}}, {"id": "E2", "paper_id": "7e095752d24c", "paper_title": "Think-4-EmCoDe framework: Highlighting key qualities in embodied co-design techniques for children", "sentences": "Embodied, co-design and children-specific methods have been gaining traction in Interaction Design for Children, and their potential and benefits are well-established. Here, we present theThink-4-EmCoDe frameworkfor the design and analysis of embodied co-design methods and techniques for children, which foregrounds key qualities in embodied interaction design research:(1) embodied awareness; (2) reflective imaginary; (3) emergence; (4) embodied memory; (5) situated relationality; (6) contingency; (7) playful engagement; (8) play practice; (9) developmental scaffolds; and (10) social dialogue.The framework has been developed drawing from several theories, methods, and frameworks in the areas of co-design and embodied design approaches.", "paragraph_index": 0, "sentence_hash": "e106a1240eda", "score": 15.0, "score_breakdown": {"total": 15.0, "term_overlap": 9.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design research\"", "phrase match: \"design methods\"", "own-claim marker: \"we present\""]}}, {"id": "E3", "paper_id": "b8c02b0994bd", "paper_title": "The Designer's Body as Resource in Design: Exploring Combinations of Point-of-view and Tense", "sentences": "Although best practice in user-centered design (such as iterative design, prototyping, user testing) also applies for this new type of product, the designer's skill set needs to be supplemented with design methods and practices that utilize bodily intelligence and empathy with the user. We present a framework for categorizing such body-centered design practices based on two dimensions: point-of-view (1st, 2nd, 3rd person) and tense (past, present, future).", "paragraph_index": 0, "sentence_hash": "5dc99f703895", "score": 12.5, "score_breakdown": {"total": 12.5, "term_overlap": 5.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design methods\"", "own-claim marker: \"we present\""]}}, {"id": "E4", "paper_id": "b2234ef79a5a", "paper_title": "Tracing situated effects of innovative design methods: inexperienced designers' practices", "sentences": "In recent years the design research community has been active in developing new methods for user involvement and collaboration in the design process. We also found that the innovative design methods in fact supported the students for empathic learning and design inspiration from the making process of the methods.", "paragraph_index": 0, "sentence_hash": "0366b41168de", "score": 11.0, "score_breakdown": {"total": 11.0, "term_overlap": 9.0, "first_person": 0.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design process\"", "phrase match: \"design research\"", "phrase match: \"design methods\""]}}, {"id": "E5", "paper_id": "7ebbe03ea0d8", "paper_title": "Autobiographical design in HCI research: designing and learning through use-it-yourself", "sentences": "Our goal in this paper is to bring these hidden practices to light and offer guidelines for how HCI researchers can usefully engage in what we term 'autobiographical design'---design research drawing on extensive, genuine usage by those creating or building a system. Through interviews with HCI experts who have engaged in variations of autobiographical design, we draw out the possibilities and limitations of autobiographical design methods and lay out best practices for its use as an HCI research method.", "paragraph_index": 0, "sentence_hash": "31a2c92db46b", "score": 11.0, "score_breakdown": {"total": 11.0, "term_overlap": 7.0, "first_person": 0.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design research\"", "phrase match: \"design methods\"", "action pattern (translates): \"guidelines for\""]}}, {"id": "E6", "paper_id": "234ec11212b7", "paper_title": "Under the umbrella: components of empathy in psychology and design", "sentences": "We suggest improving such a situation by introducing a definition of empathy based on psychology literature, which provides structure and guidance for studying the role of empathy in design. From this synthesis, we conclude that empathy in design shares several key components of empathy in psychology; particularly with state influences, top-down control process and emotional stimuli.", "paragraph_index": 0, "sentence_hash": "d3b4b71f1437", "score": 10.5, "score_breakdown": {"total": 10.5, "term_overlap": 7.0, "first_person": 0.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design methods\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "The Designer's Body as Resource in Design: Exploring Combinations of Point-of-view and Tense", "year": "2020", "paper_id": "b8c02b0994bd"}, {"title": "The Human-Centredness Metric: Early Asses , "own-claim marker: \"this article presents\""]}}, {"id": "E6", "paper_id": "d54cc84186ed", "paper_title": "Examining Rock Engineering Knowledge through a Philosophical Lens", "sentences": "This paper presents a philosophical examination of classical rock engineering problems as the basis to move from traditional knowledge to radical (innovative) knowledge. Our analysis identifies that rock engineering knowledge is shaped by cognitive biases, which over the years have created a sort of dogmatic barrier to innovation.", "paragraph_index": 0, "sentence_hash": "cc4f3aba81e9", "score": 16.0, "score_breakdown": {"total": 16.0, "term_overlap": 6.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design methods\"", "own-claim marker: \"we propose\"", "own-claim marker: \"our analysis\"", "own-claim marker: \"this paper presents\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "Design as Research in Landscape Architecture", "year": "2020", "paper_id": "6e06768bb26b"}, {"title": "Beyond geometric complexity: a critical review of complexity theory and how it relates to architecture engineering and construction", "year": "2019", "paper_id": "ac2f5510db32"}, {"title": "Generating implications for design through design research", "year": "2014", "paper_id": "5611cdb5c33a"}]}], "keywords": ["Design methods"]}</script>
  <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${Number(c) + 1}`;
    const clusterTopicLabel = value => String(value || '').replace(/\s*\[[^\]]+\]\s*$/, '').trim();
    const readableClusterLabel = c => { const label = clusterTopicLabel(c.label || c.theme); return `${label || clusterName(c.cluster)} · ${c.count} ${c.count === 1 ? 'paper' : 'papers'}`; };
    const clusterLegendLabel = c => readableClusterLabel(c);
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        opt.textContent = readableClusterLabel(c);
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Path 1 interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Topic Phrase</div>
          <div class="abstract">${escapeHtml(clusterTopicLabel(p.cluster_label_candidate))}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Key Phrases</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Prose Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Fine-Grained Form &amp; Review Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Status: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}

            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Review status: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>




          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Theory Move Candidate</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
