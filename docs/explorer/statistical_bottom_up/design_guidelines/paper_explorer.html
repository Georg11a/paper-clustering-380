<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Guidelines · Statistical bottom-up interpretation</title>
  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafd;
      --accent: #256fbd;
      --accent-soft: #eaf3ff;
      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }
    .controls {
      display: grid;
      grid-template-columns: 180px 210px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }
    .point { stroke: white; stroke-width: 1.8; cursor: pointer; opacity: 0.86; transition: opacity 120ms ease; }
    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }
    .legend { max-height: 150px; overflow-y: auto; background: #ffffff; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }
  </style>
</head>

ned", "facet_contribution_or_outcome": "Adapted class-based TF-IDF interpretation", "umap_x": 15.685918807983398, "umap_y": 6.310380458831787, "distance_to_centroid": 0.12448751926422119, "representative_rank": 2, "is_representative_top3": true, "medoid_rank": 2, "lda_topic": -1, "lda_topic_probability": 0.0, "lda_topic_words": "experience | visualization | HCI | interaction | users | gratifications | immersive | media | data | aesthetics | participants | techniques | digital | context | theory", "nearest_papers": [{"paper_id": "b14f85b19a87", "title": "Design Study Methodology: Reflections from the Trenches and the Stacks", "cluster": 3, "distance": 0.21526455879211426}, {"paper_id": "ee0a5b26f6dc", "title": "Formalizing Visualization Design Knowledge as Constraints: Actionable and Extensible Models in Draco", "cluster": 0, "distance": 0.2180503010749817}, {"paper_id": "615169de6f0e", "title": "From interaction to trajectories: designing coherent journeys through user experiences", "cluster": 2, "distance": 0.2299025058746338}, {"paper_id": "00d7fbafe65f", "title": "Demystifying Tacit Knowledge in Graphic Design: Characteristics, Instances, Approaches, and Guidelines", "cluster": 0, "distance": 0.23878008127212524}, {"paper_id": "b357bc5a3d3b", "title": "Towards Canonical Task Types for User Interface Design", "cluster": 3, "distance": 0.26307225227355957}], "hdbscan_peripheral": false}, {"paper_id": "85ba95ab4fa0", "title": "Six Guidelines for Trustworthy, Ethical and Responsible Automation Design", "authors": "Jelínek, Matouš ; Schlicker, Nadine ; de Visser, Ewart", "abstract": "Calibrated trust in automated systems (Lee and See 2004) is critical for their safe and seamless integration into society. The common goal of the various definitions of calibrated trust1 is to optimize outcomes in human-automation interaction. In other words, users should only rely on a system recommendation when it is actually correct and reject it when it is factually wrong. One requirement to achieve this goal is an accurate trustworthiness assessment, ensuring that the user's perception of the system's trustworthiness aligns with its actual trustworthiness, allowing users to make informed decisions about the extent to which they can rely on the system (Schlicker et al. 2022). The field of pragmatics offers valuable insights into the communication processes essential for developing accurate trustworthiness assessments by helping to find strategies to bridging the gap between user expectations and system capabilities, emphasizing the importance of context and mutual understanding in communication. We propose six design guidelines to help designers to optimize for accurate trustworthiness assessments, thus fostering ethical, and responsible human-automation interactions. The proposed guidelines are derived from existing literature in various fields, such as human-computer interaction, cognitive psychology, automation research, user-experience design, and ethics. We are incorporating key principles from the field of pragmatics, specifically the cultivation of common ground (H. H. Clark 1996) and Gricean communication maxims (Grice 1975). These principles are essential for the design of automated systems because the user’s perception of the system’s trustworthiness is shaped by both environmental contexts, such as organizational culture or societal norms, and by situational context, including the specific circumstances or scenarios in which the interaction occurs (Hoff and Bashir 2015). Pragmatics principles provide valuable insights into these contexts, thus enhancing our understanding and design of trustworthy systems. Our proposed guidelines provide actionable insights for designers to create automated systems that make relevant trustworthiness cues available. This would ideally foster calibrated trust and more satisfactory, productive, and safe interactions between humans and automated systems. Furthermore, the proposed heuristics might work as a tool for evaluating to what extent existing systems enable users to accurately assess a system’s trustworthiness. © 2025, CC BY-NC-ND.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2025", "venue": "arXiv", "doi": "10.48550/arXiv.2508.02371", "url": "", "keyword": "Design Guidelines", "cluster": 3, "cluster_theme_terms": "task | language | software | architecture | domain | specific | tools | user interface | types | modeling | proposed | elements | definitions | principles | provide", "cluster_label_candidate": "DG-C04: task; language; software", "distinguishing_evidence_terms": "task | language | software | architecture | domain | specific | tools | user interface | types | modeling | proposed | elements | definitions | principles | provide", "cluster_summary_candidate": "Within the predefined Design Guidelines group, DG-C04 is statistically distinguished by task, language, software. Additional contrastive terms include architecture, domain, specific, tools, user interface. Representative papers include Separation of Modeling Principles and Design Principles in Enterprise Engineering; A Preliminary Proposal Towards Unambiguous Definitions for Modular Interfaces and Interactions. This is an analysis-frozen statistical interpretation, not a final editorial topic label.", "design_knowledge_form": "Design Guidelines", "design_knowledge_action": "", "design_knowledge_role": "", "design_knowledge_contribution": "", "contribution_type_key": "", "contribution_type": "Statistical bottom-up interpretation", "contribution_type_secondary": "", "contribution_type_patterns": "", "contribution_type_support": "Analysis frozen; confirmation by at least two reviewers pending", "contribution_subtype_key": "", "contribution_subtype": "", "contribution_subtype_patterns": "", "contribution_subtype_support": "", "contribution_type_definition": "Contrastive cluster explanation using adapted class-based TF-IDF; n  Service as part of a cloud-enabled workSPACE (TSPACE). The framework is based on the state of the art results from literature and our experiences with designing software architectures for cloud-based systems. We have applied RADeF SRA design two types of TSPACE: software architecting TSPACE and software implementation TSPACE. The presented framework emphasizes on keeping the conceptual meta-model of the domain under investigation at the core of SRA design strategy and use it as a guiding tool for design, evaluation, implementation and evolution of the SRA. The framework also emphasizes to consider the nature of the tools to be provisioned and underlying cloud platforms to be used while designing SRA. The framework recommends adoption of the multi-faceted approach for evaluation of SRA and quantifiable measurement scheme to evaluate quality of the SRA. We foresee that RADeF can facilitate software architects and researchers during design, application and evaluation of a SRA and its instantiations into concrete software systems.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2016", "venue": "International Conference on Product Focused Software Process Improvement", "doi": "", "url": "https://www.semanticscholar.org/paper/67ea5b36bfc4ea94e7fb7aa36c54bef831deb69e", "keyword": "Design Guidelines", "cluster": 3, "cluster_theme_terms": "task | language | software | architecture | domain | specific | tools | user interface | types | modeling | proposed | elements | definitions | principles | provide", "cluster_label_candidate": "DG-C04: task; language; software", "distinguishing_evidence_terms": "task | language | software | architecture | domain | specific | tools | user interface | types | modeling | proposed | elements | definitions | principles | provide", "cluster_summary_candidate": "Within the predefined Design Guidelines group, DG-C04 is statistically distinguished by task, language, softwa "139a1e71d8dc", "title": "Separation of Modeling Principles and Design Principles in Enterprise Engineering", "cluster": 3, "distance": 0.24172228574752808}, {"paper_id": "b077c606da41", "title": "Classification approach for hybrid components in mechanical engineering with a focus on additive manufacturing", "cluster": 3, "distance": 0.2419871687889099}], "hdbscan_peripheral": false}, {"paper_id": "ca185d91b684", "title": "Embracing Non-Natural Design in Human-Computer Interaction", "authors": "Vatavu, Radu-Daniel", "abstract": "Decades ago, the natural interaction design paradigm has brought about a revolutionary shift in perspective regarding how interactions with computer systems could and should take place. By promoting intuition, familiarity, and context matching, natural interactions leverage users’ best capabilities to engage in effective dialogue with their computer interlocutors. Natural interaction has prevailed and transpires today in the way we use gestures, voice, or eye gaze to interact with mobile and wearable devices, communicate with personal assistants, play video games through whole-body movements, and engage with public ambient displays. However, recent contexts of use, represented by novel extended reality environments, computer systems designed to augment the human body, and creative designs of assistive technology, have resulted in interactions that can no longer be characterized as “natural.” In fact, the opposite of natural is true for them. An interaction technique for retrieving digital files from thin air, without any feedback other than within users’ own imagination, does not follow natural design guidelines, but can nevertheless prove effective. Alternating between normal and whispered voices is not a natural speech behavior, yet it enables effective discrimination between commands addressed to the system and actual speech to be transformed into text input. Eyelid gestures, reproducing movement patterns, are not natural for how we normally close and open our eyes, but are effective input for users with motor impairments. In this context, I will discuss non-natural interaction design&nbsp;[5], a transformative and creative process in Human-Computer Interaction research and practice that leads to highly usable and effective interactions with computer systems by deliberately deviating from users’ expectations and their experience of engaging with the natural, physical world. Non-natural interactions are surprising, unexpected, thought-provoking and, by design, non natural. Yet, they foster usability, accessibility, and efficiency for users. In my talk, I will exemplify the paradigm of non-natural interaction design through practical use cases developed and examined in my lab, spanning from wearable devices that challenge user agency&nbsp;[1] to smart buildings featuring invisible layers of digital content anchored in thin air&nbsp;[3], augmenting and extending the human body with virtual limbs&nbsp;[4], and computer-supported worlds that enable switching between different reality augmentations&nbsp;[2].", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2024", "venue": "Proceedings of the 2024 International Conference on Advanced Visual Interfaces", "doi": "10.1145/3656650.3660545", "url": "https://doi.org/10.1145/3656650.3660545", "keyword": "Design Guidelines", "cluster": 2, "cluster_theme_terms": "experience | visualization | HCI | interaction | users | gratifications | immersive | media | data | aesthetics | participants | techniques | digital | context | theory", "cluster_label_candidate": "DG-C03: experience; visualization; HCI", "distinguishing_evidence_terms": "experience | visualization | HCI | interaction | users | gratifications | immersive | media | data | aesthetics | participants | techniques | digital | context | theory", "cluster_summary_candidate": "Within the predefined Design Guidelines group, DG-C03 is statist perience design for map-based geo-portals by defining the functional requirements of a geo-portal, by analyzing previous geo-portal developments, by distilling the results of our empirical user study to perform practically-oriented user requirements, and finally by establishing a set of user experience design guidelines for the creation of map-based geo-portals. These design guidelines have been extracted for each of the main components of a geo-portal, i.e., the map, the search dialogue, the presentation of the search results, symbologies, and other aspects. These guidelines shall constitute the basis for future geo-portal developments to achieve standardization in the user-experience design of map-based geo-portals.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2013", "venue": "ISPRS Int. J. Geo Inf.", "doi": "", "url": "https://www.semanticscholar.org/paper/f2125c2a28765c33506f17f80c8f8098c4408196", "keyword": "Design Guidelines", "cluster": 1, "cluster_theme_terms": "rural | user | geo-portals | development | sidewalks | user experience | planning | rural development | map-based | requirements | people | experience | map-based geo-portals | village | factors", "cluster_label_candidate": "DG-C02: rural; user; geo-portals", "distinguishing_evidence_terms": "rural | user | geo-portals | development | sidewalks | user experience | planning | rural development | map-based | requirements | people | experience | map-based geo-portals | village | factors", "cluster_summary_candidate": "Within the predefined Design Guidelines group, DG-C02 is statistically distinguished by rural, user, geo-portals. Additional contrastive terms include development, sidewalks, user experience, planning, rural development. Representative papers include The equitable use concept in sidewalk design; A Comparative Study of Chinese and American Rural Design Guidelines. This is an analysis-frozen statistical interpretat ping", "abstract": "Just like code smells in source code, UI design has visual design smells. We study 93 don't-do-that guidelines in the Material Design, a complex design system created by Google. We find that these don't-guidelines go far beyond UI aesthetics, and involve seven general design dimensions (layout, typography, iconography, navigation, communication, color, and shape) and four component design aspects (anatomy, placement, behavior, and usage). Violating these guidelines results in visual design smells in UIs (or UI design smells). In a study of 60,756 UIs of 9,286 Android apps, we find that 7,497 UIs of 2,587 apps have at least one violation of some Material Design guidelines. This reveals the lack of developer training and tool support to avoid UI design smells. To fill this gap, we design an automated UI design smell detector (UIS-Hunter) that extracts and validates multi-modal UI information (component metadata, typography, iconography, color, and edge) for detecting the violation of diverse don't-guidelines in Material Design. The detection accuracy of UIS-Hunter is high (precision=0.81, recall=0.90) on the 60,756 UIs of 9,286 apps. We build a guideline gallery with real-world UI design smells that UIS-Hunter detects for developers to learn the best Material Design practices. Our user studies show that UIS-Hunter is more effective than manual detection of UI design smells, and the UI design smells that are detected by UIS-Hunter have severely negative impacts on app users.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2021", "venue": "Proceedings of the 43rd International Conference on Software Engineering", "doi": "10.1109/icse43902.2021.00075", "url": "https://doi.org/10.1109/ICSE43902.2021.00075", "keyword": "Design Guidelines", "cluster": 0, "cluster_theme_terms": "user interface | tacit | visualization | component | instances | constraints | characteristics | support .0, "representatives": [{"title": "Separation of Modeling Principles and Design Principles in Enterprise Engineering", "year": "2016", "paper_id": "139a1e71d8dc"}, {"title": "A Preliminary Proposal Towards Unambiguous Definitions for Modular Interfaces and Interactions", "year": "2019", "paper_id": "c216cc01fe23"}, {"title": "Design Study Methodology: Reflections from the Trenches and the Stacks", "year": "2012", "paper_id": "b14f85b19a87"}]}], "keywords": ["Design Guidelines"]}</script>
  <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${c}`;
    const clusterLegendLabel = c => {
      const label = String(c.label || c.theme || '').trim();
      if (!label) return clusterName(c.cluster);
      return /^Cluster\s+-?\d+:/i.test(label) ? label : `${clusterName(c.cluster)}: ${label}`;
    };
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        const stableId = String(c.label || '').split(':')[0].trim(); opt.textContent = `${stableId || clusterName(c.cluster)} (${c.count})`;
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Statistical bottom-up interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Cluster Descriptor</div>
          <div class="abstract">${escapeHtml(p.cluster_label_candidate)}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Distinguishing Evidence</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Statistical Bottom-Up Cluster Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Interpretation Method &amp; Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Primary: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}
            <span class="pill">Primary domain: ${escapeHtml(p.primary_application_domain || p.application_domains || 'n/a')}</span>
            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Contribution support: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>
          <div class="meta">Subtype support: ${escapeHtml(p.contribution_subtype_support || 'n/a')}</div>
          <div class="meta">Contribution patterns: ${escapeHtml(p.contribution_type_patterns || 'n/a')}</div>
          <div class="meta">Domain support: ${escapeHtml(p.application_domain_support || 'n/a')}</div>
          <div class="meta">Domain definition: ${escapeHtml(p.application_domain_definitions || 'n/a')}</div>
          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Path 1 Theory Move</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <div class="insight-card">
          <div class="section-title">Pipeline Context</div>
          <div class="pill-row">
            <span class="pill">Context/Domain: ${escapeHtml(p.facet_population_or_context || 'n/a')}</span>
            <span class="pill">Population/Stakeholder: ${escapeHtml(p.facet_stakeholder_or_population || 'n/a')}</span>
            <span class="pill">Method/Lens: ${escapeHtml(p.facet_method_or_lens || 'n/a')}</span>
            <span class="pill">Artifact/System: ${escapeHtml(p.facet_artifact_or_domain || 'n/a')}</span>
            <span class="pill">Contribution Type: ${escapeHtml(p.facet_contribution_or_outcome || 'n/a')}</span>
          </div>
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
