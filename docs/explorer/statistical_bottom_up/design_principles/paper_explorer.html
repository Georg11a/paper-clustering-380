<html lang="en">
<head>

  <style>
    :root {
      --ink: #1f2a44;
      --muted: #6b7a90;
      --soft: #8b9bb0;
      --line: #dde6f0;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafd;
      --accent: #256fbd;
      --accent-soft: #eaf3ff;
      --shadow: 0 18px 45px rgba(31, 42, 68, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 16px 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; min-width: 0; font-weight: 750; }
    .controls {
      display: grid;
      grid-template-columns: 180px 210px;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }
    button { background: var(--accent); color: white; border-color: var(--accent); cursor: pointer; }
    label.toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }
    label.toggle input { width: 16px; height: 16px; }
    main {
      display: grid;
      grid-template-columns: minmax(600px, 1fr) minmax(420px, 470px);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 92px);
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .plot-panel { display: grid; grid-template-rows: auto 1fr auto; height: calc(100vh - 116px); min-height: 690px; }
    .status {
      padding: 11px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      background: var(--panel-soft);
    }
    svg { width: 100%; height: 100%; min-height: 560px; background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%); }
    .axis { stroke: #e7edf5; stroke-width: 1; }
    .point { stroke: white; stroke-width: 1.8; cursor: pointer; opacity: 0.86; transition: opacity 120ms ease; }
    .point:hover { opacity: 1; stroke: #1f2a44; stroke-width: 2.6; }
    .point.dim { opacity: 0.14; }
    .point.selected { stroke: #111827; stroke-width: 3; opacity: 1; }
    .legend, .cluster-list { padding: 10px 12px; border-top: 1px solid var(--line); }
    .legend { max-height: 150px; overflow-y: auto; background: #ffffff; }
    .legend-items { display: flex; flex-wrap: wrap; gap: 7px 10px; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #e7edf5;
      border-radius: 999px;
      background: var(--panel-soft);
      font-size: 12px;
      color: var(--muted);
      max-width: 100%;
    }
    .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .details { padding: 0; overflow: auto; height: calc(100vh - 116px); min-height: 690px; align-self: stretch; }
    .details-inner { padding: 18px 18px 22px; }
    .paper-heading {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px 18px 14px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .paper-heading h2 { font-size: 19px; margin: 0 0 8px; line-height: 1.22; font-weight: 760; }
    .details h2 { font-size: 18px; margin: 0 0 8px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .pill {
      display: inline-flex;
      align-items: center;
      margin: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #31577f;
      font-size: 12px;
      line-height: 1.25;
    }
    .abstract { line-height: 1.55; font-size: 14px; color: #2f3b52; }
    .insight-card {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid #e4ebf4;
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .insight-card.primary {
      background: #ffffff;
      border-left: 4px solid var(--accent);
    }
    details.discussion-full,
    details.lexical-evidence {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      background: #fbfcfe;
    }
    details.discussion-full summary,
    details.lexical-evidence summary {
      cursor: pointer;
      color: #31577f;
      font-weight: 700;
      font-size: 13px;
    }
    .evidence-block { margin-top: 8px; }
    .source-evidence-item {
      border-top: 1px solid var(--line);
      padding: 10px 0;
    }
    .source-evidence-item:first-child { border-top: 0; padding-top: 0; }
    .source-evidence-quote {
      line-height: 1.45;
      font-size: 13px;
      color: #2f3b52;
      margin: 6px 0;
    }
    .source-evidence-reasons {
      margin: 6px 0 0;
      padding-left: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .discussion-list {
      margin: 6px 0 0;
      padding-left: 18px;
      line-height: 1.45;
      font-size: 14px;
      color: #2f3b52;
    }
    .discussion-list li { margin: 0 0 7px; }
    .section-title { margin: 0 0 7px; font-weight: 760; font-size: 12px; text-transform: uppercase; color: var(--soft); letter-spacing: 0.02em; }
    .paper-link { display: block; color: var(--accent); text-decoration: none; margin: 7px 0; font-size: 13px; line-height: 1.35; }
    .cluster-card { border-top: 1px solid var(--line); padding: 10px 12px; }
    .cluster-card button { height: 28px; padding: 0 8px; margin-top: 6px; font-size: 12px; }
    @media (max-width: 980px) {
      header { display: block; }
      h1 { margin-bottom: 12px; }
      .controls, main { grid-template-columns: 1fr; }
      .plot-panel { min-height: 560px; }
    }

 analysis, is challenging due to the limited access to end users. This dilemma is further exacerbated by the high knowledge imbalance between ML designers and end users. To investigate the state of transparent ML in medical image analysis, we conducted a systematic review of the literature by screening titles, abstracts, and keywords of all available records from January 2012 through July 2021 in PubMed, EMBASE, and Compendex databases. We identified 2508 records and 68 articles met the inclusion criteria. We found that current techniques in transparent ML are dominated by computational feasibility, and barely consider end users, during neither development nor evaluation. Despite the considerable difference between the roles and knowledge of ML developers and clinical stakeholders, no study reported formative user research to inform the design and development of transparent ML models. Only a few studies validated transparency claims through empirical user evaluations. These shortcomings put contemporary research on transparent ML at risk of being incomprehensible to users, and thus, clinically irrelevant. To alleviate these shortcomings in forthcoming research while acknowledging the challenges of human-centered design in healthcare, we introduce the INTRPRT guideline, a systematic design directive for transparent ML systems in medical image analysis. The INTRPRT guideline suggests human-centered design principles and highly recommends formative user research as the first step of transparent model design to understand user needs and domain requirements. It further provides alternatives to empirical user evaluation to support transparent ML design choices to facilitate the adoption of human-centered design principles. Following these guidelines and a human-centered design process increases the likelihood that the algorithms afford transparency and enables stakeholders to capitalize on the benefits of transparent ML. © 2021, CC BY.", "discussion_summary": "", "discuss ese learners by importing the meta-cognitive skills, algorithmic structures, and multiple sensory modalities that are both proven successful in their remediation and uniquely suited to technological design adaptation.We draw from our main author's experience as a heavily remediated Dyslexic, a lifelong user of modified, adaptable and assistive technology, and a self-aware learner taught to understand why the methods behind her remediation worked. We additionally draw on our cumulative experience as users, teachers and developers of technology and on interviews with participants from a wide variety of sociocultural functions and pedagogical practices involved with special education. Based upon these and existing methods and applications, we present our insights in the form of guidelines for universal design that have the potential to not only embrace the differences of all learners but to maximize the potential of underserved neurodiverse learners so they can become self-sufficient masters of their own skills and interests across their lifetime.", "discussion_summary": "", "discussion_excerpt": "", "discussion_found": false, "discussion_paragraph_count": 0, "year": "2013", "venue": "Proceedings of the 12th International Conference on Interaction Design and Children", "doi": "10.1145/2485760.2485848", "url": "https://doi.org/10.1145/2485760.2485848", "keyword": "Design principles", "cluster": 1, "cluster_theme_terms": "design | vr | games | learning | identity | cyberbullying | principles | learners | social | game | disclaimers | player | multisensory | artificial | llm", "cluster_label_candidate": "Design principles — Design lenses and Social interaction", "distinguishing_evidence_terms": "Design lenses, Social interaction", "cluster_summary_candidate": "In this paper, we define this genre as “design-based games” and identify evaluating player designs as a major challenge these games face. [E1] To address urgent challenges in artificial identity design, including ha data analysis", "sentences": "For a given problem, there can be significant or subtle differences in how a data analyst (or producer of a data analysis) constructs, creates, or designs a data analysis, including differences in the choice of methods, tooling, and workflow. Here, we introduce design principles for data analysis and describe how they can be mapped to data analyses in a quantitative, objective and informative manner.", "paragraph_index": 0, "sentence_hash": "2fcf5e66ee51", "score": 15.5, "score_breakdown": {"total": 15.5, "term_overlap": 8.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we introduce\""]}}, {"id": "E2", "paper_id": "90b3e6bb765d", "paper_title": "Towards Phenomenon-driven Design Science Research", "sentences": "We propose a research approach that extends phenomenon-driven research – which is primarily aimed at producing descriptive and explanatory knowledge about novel phenomena – with a design-oriented focus. We illustrate our approach with two examples to understand and produce design principles for the novel phenomena of organising the IT setups in Scaled Agile organisations and Digital Innovation Units, respectively.", "paragraph_index": 0, "sentence_hash": "80bbb39f5856", "score": 15.0, "score_breakdown": {"total": 15.0, "term_overlap": 5.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we propose\"", "own-claim marker: \"our approach\""]}}, {"id": "E3", "paper_id": "31bdafb1fc73", "paper_title": "Explainable Medical Imaging AI Needs Human-Centered Design: Guidelines and Evidence from a Systematic Review", "sentences": "Following human-centered design principles in highly specialized and high stakes domains, such as medical image analysis, is challenging due to the limited access to end users. To alleviate these shortcomings in forthcoming research while acknowledging the challenges of human-centered design in healthcare, we introduce the INTRPRT guideline, a systematic design directive for transparent ML systems in medical image analysis.", "paragraph_index": 0, "sentence_hash": "c30b5f24197b", "score": 14.0, "score_breakdown": {"total": 14.0, "term_overlap": 6.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we introduce\"", "action pattern (synthesizes): \"systematic review\""]}}, {"id": "E4", "paper_id": "3382d6461f40", "paper_title": "The Principles of the Flix Programming Language", "sentences": "We present the design values and design principles of the Flix programming language, a functional-first, imperative, and logic programming language. We present each principle in detail, including its origin, rationale, and how it has shaped Flix.", "paragraph_index": 0, "sentence_hash": "acc450be3874", "score": 14.0, "score_breakdown": {"total": 14.0, "term_overlap": 8.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"programming language\"", "phrase match: \"design principles\"", "own-claim marker: \"we present\""]}}, {"id": "E5", "paper_id": "1445730be68b", "paper_title": "A problem-based approach to the advancement of heuristics for socio-technical evaluation", "sentences": "Hence, our goal was to develop socio-technical heuristics, in short ST-heuristics, that can be applied by individuals to detect issues. Drawing inspiration from the success of usability heuristics in the field of human-computer interaction, we first applied a literature review to develop an initial set of ST-heuristics derived from six domains comprising groupware/computer-support cooperative work, job design, usability, socio-technical design principles, privacy, and process design.", "paragraph_index": 0, "sentence_hash": "59f809845ad1", "score": 12.0, "score_breakdown": {"total": 12.0, "term_overlap": 8.0, "first_person": 0.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "action pattern (synthesizes): \"literature review\""]}}, {"id": "E6", "paper_id": "b77e7d67555e", "paper_title": "USSF: A Unified Framework for Screen Standardization in Software Systems", "sentences": "This paper introduces the Unified Screen Standardization Framework (USSF), a methodological model that consolidates the heterogeneous principles (such as Nielsen’s heuristics, ISO 9241 principles, WCAG accessibility recommendations, Shneiderman’s Eight Golden Rules, Norman’s design principles, etc.) into a coherent, hierarchical structure. USSF employs two novel mechanisms: (1) artifact-based indexing (APP, SCR, DIA, FRM, CMP, WID) to represent application elements in hierarchical form and (2) inheritance with override rules for systematically applying and adapting standards across different levels of user interface elements.", "paragraph_index": 0, "sentence_hash": "bc0a81d3ec4b", "score": 12.0, "score_breakdown": {"total": 12.0, "term_overlap": 6.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"this paper introduces\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "Design principles for human-computer interfaces", "year": "1983", "paper_id": "01467836cecf"}, {"title": "Ecological interface design: theoretical foundations", "year": "1992", "paper_id": "c6c22fc10c10"}, {"title": "Design principles for data analysis", "year": "2021", "paper_id": "93bb03ac03b6"}]}, {"cluster": 1, "count": 8, "theme": "design | vr | games | learning | identity | cyberbullying | principles | learners | social | ation is not necessary.", "paragraph_index": 0, "sentence_hash": "c64eeda0e671", "score": 21.0, "score_breakdown": {"total": 21.0, "term_overlap": 7.0, "first_person": 8.0, "action": 4.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we define\"", "own-claim marker: \"in this paper, we\"", "action pattern (defines): \"we define\"", "action pattern (synthesizes): \"survey of\""]}}, {"id": "E2", "paper_id": "0b35e34543e2", "paper_title": "Designing Artificial Identity: The Identity Design Framework and Research Agenda", "sentences": "To address urgent challenges in artificial identity design, including harmful stereotypes and deceptive practices, we introduce the Identity Design (ID) Framework and an accompanying research agenda. Drawing on emerging work on artificial identity in human-robot interaction and taking an interdisciplinary perspective, we propose twelve design principles across three levels: individual (recognisability, behavioural consistency, identity continuity, memory, persistent goals), group (membership signalling, social alignment, role clarity), and societal (benevolence, artificiality, social justice, transparency).", "paragraph_index": 0, "sentence_hash": "b31fe0c0e398", "score": 19.0, "score_breakdown": {"total": 19.0, "term_overlap": 9.0, "first_person": 8.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we propose\"", "own-claim marker: \"we introduce\""]}}, {"id": "E3", "paper_id": "42c66c187222", "paper_title": "Toward an effective approach to collaboration education: A taxonomy for game design", "sentences": "Collaborative video games provide a challenge to designers, who must account for not only the thoughts and actions of individuals, but also the events and interactions among players. Our taxonomy can be used by researchers to inform study design, by game creators to develop design principles, and by educators to guide collaboration assessment.", "paragraph_index": 0, "sentence_hash": "106a62673362", "score": 15.5, "score_breakdown": {"total": 15.5, "term_overlap": 8.0, "first_person": 4.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"our taxonomy\""]}}, {"id": "E4", "paper_id": "d0a936b480d4", "paper_title": "Acquiring educational access for neurodiverse learners through multisensory design principles", "sentences": "Educational interface designers are in an unprecedented position to facilitate autonomous learning in neurodiverse learners (children with special needs). Based upon these and existing methods and applications, we present our insights in the form of guidelines for universal design that have the potential to not only embrace the differences of all learners but to maximize the potential of underserved neurodiverse learners so they can become self-sufficient masters of their own skills and interests across their lifetime.", "paragraph_index": 0, "sentence_hash": "2d0ee17e9d31", "score": 15.5, "score_breakdown": {"total": 15.5, "term_overlap": 6.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 1.5, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we present\"", "action pattern (translates): \"guidelines for\""]}}, {"id": "E5", "paper_id": "4d05e05aa876", "paper_title": "Theoretical Constructs for Design Lenses for Developing Cyberbullying Countering Games for Adolescences", "sentences": "Additionally, developed theoretical constructs to understand the cyberbullying process from social sciences seems not to be used in the creation of these games. This study proposes a set of theoretical constructs, built upon social interaction theory, as a theoretical perspective for understanding the social aspects of cyberbullying, to ground and introduce design lenses, that can be used as design principles, for informing the creation of counter cyberbullying games.", "paragraph_index": 0, "sentence_hash": "fe72bf6a30e0", "score": 15.0, "score_breakdown": {"total": 15.0, "term_overlap": 13.0, "first_person": 0.0, "action": 0.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design lenses\"", "phrase match: \"social interaction\"", "phrase match: \"design principles\""]}}, {"id": "E6", "paper_id": "8eb8539b9712", "paper_title": "Designing Dialogic Disclaimers: Principles for Ethical Conversational Design in LLM Interfaces", "sentences": "Current disclaimer approaches in large language model (LLM) systems often disrupt conversational flow with static, one-shot warnings that fail to engage users in deeper ethical reflection and, as a growing body of evidence reveals, are largely ineffective at achieving their intended goals of calibrated trust and informed use. Through a theoretical synthesis drawing on research in conversational repair, dialogue structure, AI transparency, and empirical studies of user interaction with LLMs, we identify four design principles for dialogic disclaimers: Conversational Continuity, Contextual Adaptation, Layered Communication, and User Agency.", "paragraph_index": 0, "sentence_hash": "2b10b0d54814", "score": 15.0, "score_breakdown": {"total": 15.0, "term_overlap": 7.0, "first_person": 4.0, "action": 2.0, "keyword": 2.0, "citation_penalty": -0.0, "representative_bonus": 0.0, "reasons": ["phrase match: \"design principles\"", "own-claim marker: \"we identify\"", "action pattern (evaluates): \"empirical evaluation\""]}}], "source_faithfulness_score": 1.0, "representatives": [{"title": "Personalising learning: towards a coherent learning design framework", "year": "", "paper_id": "fee96194a322"}, {"title": "Toward an effective approach to collaboration education: A taxonomy for game design", "year": "2015", "paper_id": "42c66c187222"}, {"title": "Acquiring educational access for neurodiverse learners through multisensory design principles", "year": "2013", "paper_id": "d0a936b480d4"}]}], "keywords": ["Design principles"]}</script>
  <script>
    const data = JSON.parse(document.getElementById('payload').textContent);
    const papers = data.papers;
    const palette = ['#f05a71','#4c78a8','#f58518','#54a24b','#b279a2','#72b7b2','#eeca3b','#ff9da6','#9d755d','#59a14f','#edc948','#76b7b2'];
    const colorFor = c => palette[Math.abs(Number(c)) % palette.length];
    const clusterName = c => Number(c) === -1 ? 'Unclustered papers' : `Cluster ${Number(c) + 1}`;
    const clusterTopicLabel = value => String(value || '').replace(/\s*\[[^\]]+\]\s*$/, '').trim();
    const readableClusterLabel = c => { const label = clusterTopicLabel(c.label || c.theme); return `${label || clusterName(c.cluster)} · ${c.count} ${c.count === 1 ? 'paper' : 'papers'}`; };
    const clusterLegendLabel = c => readableClusterLabel(c);
    const state = { selected: papers[0]?.paper_id || null };
    const svg = document.getElementById('plot');
    const details = document.getElementById('details');
    const status = document.getElementById('status');

    function initControls() {
      const clusterFilter = document.getElementById('clusterFilter');
      data.clusters.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.cluster;
        opt.textContent = readableClusterLabel(c);
        clusterFilter.appendChild(opt);
      });
      ['clusterFilter'].forEach(id => {
        document.getElementById(id).addEventListener('input', render);
        document.getElementById(id).addEventListener('change', render);
      });
      renderLegend();
    }

    function filteredPapers() {
      const cluster = document.getElementById('clusterFilter').value;
      return papers.filter(p => {
        return (cluster === 'all' || String(p.cluster) === cluster);
      });
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      legend.innerHTML = '';
      data.clusters.forEach(c => {
        const item = document.createElement('span');
        item.className = 'legend-item';
        item.innerHTML = `<span class="swatch" style="background:${colorFor(c.cluster)}"></span> ${escapeHtml(clusterLegendLabel(c))}`;
        legend.appendChild(item);
      });
      const shapeNote = document.createElement('span');
      shapeNote.className = 'legend-item';
      shapeNote.innerHTML = '<span>◆ Discussion detected</span><span>● No explicit discussion</span>';
      legend.appendChild(shapeNote);
    }

    function render() {
      const shown = filteredPapers();
      status.textContent = `${shown.length} of ${papers.length} papers shown; ${data.clusters.length} clusters in this view. Axes are UMAP 1 and UMAP 2 coordinates, not interpretable variables.`;
      drawPlot(shown);
      renderDetails(papers.find(p => p.paper_id === state.selected) || shown[0] || papers[0]);
    }

    function drawPlot(shown) {
      const width = svg.clientWidth || 900;
      const height = svg.clientHeight || 560;
      const pad = 44;
      const xs = papers.map(p => p.umap_x), ys = papers.map(p => p.umap_y);
      let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const xRange = Math.max(0.0001, maxX - minX);
      const yRange = Math.max(0.0001, maxY - minY);
      minX -= xRange * 0.08;
      maxX += xRange * 0.08;
      minY -= yRange * 0.08;
      maxY += yRange * 0.08;
      const sx = x => pad + ((x - minX) / Math.max(0.0001, maxX - minX)) * (width - pad * 2);
      const sy = y => height - pad - ((y - minY) / Math.max(0.0001, maxY - minY)) * (height - pad * 2);
      const shownIds = new Set(shown.map(p => p.paper_id));
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const x = pad + i * (width - pad * 2) / 5;
        const y = pad + i * (height - pad * 2) / 5;
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${x}" y1="${pad}" x2="${x}" y2="${height-pad}"></line>`);
        svg.insertAdjacentHTML('beforeend', `<line class="axis" x1="${pad}" y1="${y}" x2="${width-pad}" y2="${y}"></line>`);
      }
      svg.insertAdjacentHTML('beforeend', `<text x="${width / 2}" y="${height - 8}" text-anchor="middle" fill="#65758b" font-size="12">UMAP 1</text>`);
      svg.insertAdjacentHTML('beforeend', `<text x="16" y="${height / 2}" text-anchor="middle" fill="#65758b" font-size="12" transform="rotate(-90 16 ${height / 2})">UMAP 2</text>`);
      papers.forEach(p => {
        const visible = shownIds.has(p.paper_id);
        const selected = p.paper_id === state.selected;
        const x = sx(p.umap_x), y = sy(p.umap_y);
        const size = selected ? 7.5 : 6.5;
        const cls = `point ${visible ? '' : 'dim'} ${selected ? 'selected' : ''}`;
        const fill = colorFor(p.cluster);
        const node = document.createElementNS('http://www.w3.org/2000/svg', p.discussion_found ? 'path' : 'circle');
        node.setAttribute('class', cls);
        node.setAttribute('fill', fill);
        if (p.discussion_found) {
          const d = `M ${x} ${y - size} L ${x + size} ${y} L ${x} ${y + size} L ${x - size} ${y} Z`;
          node.setAttribute('d', d);
        } else {
          node.setAttribute('cx', x);
          node.setAttribute('cy', y);
          node.setAttribute('r', size);
        }
        node.addEventListener('click', () => {
          state.selected = p.paper_id;
          render();
        });
        node.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = p.title;
        svg.appendChild(node);
      });
    }

    function clusterRecord(clusterId) {
      return data.clusters.find(c => String(c.cluster) === String(clusterId));
    }

    function renderSourceEvidence(clusterId) {
      const cluster = clusterRecord(clusterId);
      const evidence = cluster?.source_evidence || [];
      const score = cluster?.source_faithfulness_score;
      const scorePill = Number.isFinite(Number(score)) ?
        `<span class="pill">${Math.round(Number(score) * 100)}% summary support</span>` : '';
      if (!evidence.length) {
        return `
          <div class="insight-card">
            <div class="section-title">Source Evidence ${scorePill}</div>
            <div class="meta">No direct source evidence selected from extracted full text for this cluster.</div>
          </div>
        `;
      }
      const items = evidence.map(item => {
        const reasons = item.score_breakdown?.reasons || [];
        const reasonList = reasons.slice(0, 4).map(reason => `<li>${escapeHtml(reason)}</li>`).join('');
        return `
          <div class="source-evidence-item">
            <div class="pill-row">
              <span class="pill">${escapeHtml(item.id)}</span>
              <span class="pill">score ${Number(item.score).toFixed(1)}</span>
              <span class="pill">para ${Number(item.paragraph_index) + 1}</span>
              <span class="pill">hash ${escapeHtml(item.sentence_hash)}</span>
            </div>
            <div class="source-evidence-quote">${escapeHtml(item.sentences)}</div>
            <a class="paper-link" href="#" data-paper="${escapeAttr(item.paper_id)}">${escapeHtml(item.paper_title)}</a>
            ${reasonList ? `<ul class="source-evidence-reasons">${reasonList}</ul>` : ''}
          </div>
        `;
      }).join('');
      return `
        <div class="insight-card">
          <div class="section-title">Source Evidence ${scorePill}</div>
          <div class="evidence-block">${items}</div>
        </div>
      `;
    }

    function renderDetails(p) {
      if (!p) return;
      const doi = p.doi ? `<a class="paper-link" href="https://doi.org/${escapeHtml(p.doi)}" target="_blank">DOI: ${escapeHtml(p.doi)}</a>` : '';
      const url = p.url ? `<a class="paper-link" href="${escapeAttr(p.url)}" target="_blank">Open paper URL</a>` : '';
      const nearest = (p.nearest_papers || []).map(n =>
        `<a class="paper-link" href="#" data-paper="${escapeAttr(n.paper_id)}">${clusterName(n.cluster)}, distance ${Number(n.distance).toFixed(3)}: ${escapeHtml(n.title)}</a>`
      ).join('');
      const discussionSummary = p.discussion_summary ?
        `<div class="insight-card"><div class="section-title">Discussion Summary</div>${renderDiscussionSummary(p.discussion_summary)}</div>` : '';
      const discussionExcerpt = '';
      const discussionStatus = p.discussion_found ?
        `<span class="pill">Discussion detected: ${p.discussion_paragraph_count} paragraphs</span>` :
        `<span class="pill">No explicit Discussion section detected</span>`;
      const peripheralStatus = p.hdbscan_peripheral ?
        `<span class="pill">Peripheral: soft-assigned to nearest cluster (HDBSCAN noise)</span>` : '';
      const sourceEvidence = renderSourceEvidence(p.cluster);
      details.innerHTML = `
        <div class="paper-heading">
          <h2>${escapeHtml(p.title)}</h2>
          <div class="meta">${escapeHtml(p.authors)}<br>${escapeHtml(p.year)} · ${escapeHtml(p.venue)}</div>
          <div class="pill-row">
            <span class="pill">${clusterName(p.cluster)}</span>
            <span class="pill">${escapeHtml(p.keyword)}</span>
            <span class="pill">Rep rank ${p.representative_rank}</span>
            <span class="pill">Medoid rank ${p.medoid_rank}</span>
            <span class="pill">Path 1 interpretation</span>
            ${discussionStatus}${peripheralStatus}
          </div>
        </div>
        <div class="details-inner">
        <div class="insight-card primary">
          <div class="section-title">Topic Phrase</div>
          <div class="abstract">${escapeHtml(clusterTopicLabel(p.cluster_label_candidate))}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Key Phrases</div>
          <div class="abstract">${escapeHtml(p.distinguishing_evidence_terms || p.cluster_theme_terms || 'n/a')}</div>
        </div>
        <div class="insight-card">
          <div class="section-title">Prose Summary</div>
          <div class="abstract">${escapeHtml(p.cluster_summary_candidate)}</div>
        </div>
        ${sourceEvidence}
        <div class="insight-card">
          <div class="section-title">Fine-Grained Form &amp; Review Status</div>
          <div class="pill-row">
            <span class="pill">Form: ${escapeHtml(p.design_knowledge_form || 'n/a')}</span>
            <span class="pill">Status: ${escapeHtml(p.contribution_type || 'n/a')}</span>
            ${p.contribution_subtype ? `<span class="pill">Subtype: ${escapeHtml(p.contribution_subtype)}</span>` : ''}
            ${p.contribution_type_secondary ? `<span class="pill">Secondary: ${escapeHtml(p.contribution_type_secondary)}</span>` : ''}

            ${p.additional_application_domains ? `<span class="pill">Additional domains: ${escapeHtml(p.additional_application_domains)}</span>` : ''}
          </div>
          <div class="meta" style="margin-top:8px">Review status: ${escapeHtml(p.contribution_type_support || 'n/a')}</div>
          <div class="meta">Contribution definition: ${escapeHtml(p.contribution_type_definition || 'n/a')}</div>




          ${p.theory_move_key !== 'not_applicable' && p.theory_move_key !== 'n/a' ? `
          <div class="section-title" style="margin-top:14px">Theory Move Candidate</div>
          <div class="pill-row">
            <span class="pill">Theory move: ${escapeHtml(p.theory_move || 'n/a')}</span>
            <span class="pill">Support: ${escapeHtml(p.theory_move_support || 'n/a')}</span>
          </div>
          <div class="meta" style="margin-top:8px">Matched patterns: ${escapeHtml(p.theory_move_patterns || 'n/a')}</div>` : ''}
        </div>
        <details class="lexical-evidence">
          <summary>Show lexical evidence</summary>
          <div class="evidence-block">
            <div class="section-title">Cluster Theme Evidence</div>
            <div class="abstract">${escapeHtml(p.cluster_theme_terms)}</div>
            <div class="section-title">Class-Based TF-IDF Evidence</div>
            <div class="abstract">${escapeHtml(p.lda_topic_words)}</div>
          </div>
        </details>
        <div class="insight-card">
          <div class="section-title">Abstract</div>
          <div class="abstract">${escapeHtml(p.abstract)}</div>
        </div>
        ${discussionSummary}
        ${discussionExcerpt}
        <div class="insight-card">
          <div class="section-title">Links</div>
          ${doi}${url}
        </div>
        <div class="insight-card">
          <div class="section-title">Nearest Papers by Cosine Distance</div>
          ${nearest || '<div class="meta">No nearest-paper data available.</div>'}
        </div>
        </div>
      `;
      details.querySelectorAll('[data-paper]').forEach(a => {
        a.addEventListener('click', evt => {
          evt.preventDefault();
          state.selected = a.getAttribute('data-paper');
          render();
        });
      });
      details.scrollTop = 0;
    }

    function renderDiscussionSummary(value) {
      const items = String(value || '').split('\n').map(line => line.replace(/^[-•]\s*/, '').trim()).filter(Boolean);
      if (!items.length) return '<div class="meta">No discussion summary available.</div>';
      return `<ul class="discussion-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    initControls();
    render();
    window.addEventListener('resize', render);
  </script>
</body>
</html>
